const categoryUseCount = (store, id) => ['financeTitles', 'despesas', 'incomes', 'cashAdjustments']
  .reduce((sum, collection) => sum + store.state[collection].filter((record) => record.categoryId === id).length, 0);

const preferCategory = (store, left, right) => {
  if (!left) return right;
  const score = (category) => (category.duplicateOf ? 0 : 1000000)
    + (category.archived ? 0 : 100000)
    + categoryUseCount(store, category.id);
  return score(right) > score(left) ? right : left;
};

/** Hide redundant categories without changing the category on past financial events. */
function consolidateFinanceCategories(store) {
  let changed = 0;
  const canonical = new Map();
  const duplicates = [];
  for (const category of store.state.categories) {
    if (category.systemKey) canonical.set(category.systemKey, preferCategory(store, canonical.get(category.systemKey), category));
  }
  for (const category of store.state.categories) {
    if (category.systemKey && canonical.get(category.systemKey)?.id !== category.id) {
      duplicates.push([category, canonical.get(category.systemKey)]);
    } else if (!category.systemKey && !category.archived) {
      const spec = DEFAULT_CHART.find((entry) =>
        (entry.direction === 'receber' || (!entry.direction && entry.nature === 'receita')) === (category.direction === 'receber' || (!category.direction && category.kind === 'receita'))
        && [entry.name, ...(LEGACY_CATEGORY_ALIASES[entry.systemKey] || [])].some((name) => financeNorm(name) === financeNorm(category.name)));
      const target = spec && canonical.get(spec.systemKey);
      if (target && target.id !== category.id) duplicates.push([category, target]);
    }
  }
  const duplicateIds = new Set(duplicates.map(([category]) => category.id));
  const customByName = new Map();
  for (const category of store.state.categories.filter((item) => !item.systemKey && !item.archived && !duplicateIds.has(item.id))) {
    const key = `${category.kind}:${category.parentId || ''}:${financeNorm(category.name)}`;
    const previous = customByName.get(key);
    customByName.set(key, preferCategory(store, previous, category));
  }
  for (const category of store.state.categories.filter((item) => !item.systemKey && !item.archived && !duplicateIds.has(item.id))) {
    const key = `${category.kind}:${category.parentId || ''}:${financeNorm(category.name)}`;
    const target = customByName.get(key);
    if (target && target.id !== category.id) duplicates.push([category, target]);
  }
  for (const [category, target] of duplicates) {
    const current = store.get('categories', category.id);
    if (!current.archived || current.duplicateOf !== target.id) {
      store.upsertCategory({ ...current, archived: true, duplicateOf: target.id });
      changed++;
    }
    for (const child of store.state.categories.filter((item) => item.parentId === category.id && item.id !== target.id)) {
      store.upsertCategory({ ...child, parentId: target.id });
      changed++;
    }
  }
  return changed;
}

/** Seed/upgrade financial master data and keep one receivable title per active historical order. */
function ensureFinanceFoundation(store, idFactory = () => crypto.randomUUID()) {
  let changed = 0;
  for (const spec of DEFAULT_ACCOUNTS) {
    let account = store.state.cashAccounts.find((a) => a.systemKey === spec.systemKey);
    if (!account) { store.upsertCashAccount({ id: idFactory(), ...spec }); changed++; }
  }

  const byKey = new Map();
  for (const category of store.state.categories.filter((c) => c.systemKey)) {
    byKey.set(category.systemKey, preferCategory(store, byKey.get(category.systemKey), category));
  }
  for (const spec of DEFAULT_CHART) {
    let cat = byKey.get(spec.systemKey);
    if (!cat) {
      // Reuse a legacy category with the same name whenever possible, preserving its id/history.
      const aliases = [spec.name, ...(LEGACY_CATEGORY_ALIASES[spec.systemKey] || [])].map(financeNorm);
      cat = store.state.categories.find((c) => !c.systemKey && !c.archived && aliases.includes(financeNorm(c.name)));
      const parentId = spec.parentKey ? byKey.get(spec.parentKey)?.id : undefined;
      const record = { ...(cat || {}), id: cat?.id || idFactory(), ...spec, ...(parentId ? { parentId } : {}) };
      delete record.parentKey;
      store.upsertCategory(record); byKey.set(spec.systemKey, record); changed++;
    } else {
      const parentId = spec.parentKey ? byKey.get(spec.parentKey)?.id : undefined;
      const upgraded = { ...cat, ...spec, ...(cat.customName ? { name: cat.name } : {}), ...(cat.customCode ? { code: cat.code } : {}), ...(parentId ? { parentId } : {}) };
      delete upgraded.parentKey;
      if (!spec.parentKey) delete upgraded.parentId;
      if (JSON.stringify(upgraded) !== JSON.stringify(cat)) { store.upsertCategory(upgraded); changed++; }
      byKey.set(spec.systemKey, upgraded);
    }
  }

  for (let pass = 0; pass < 3; pass++) {
    const cleaned = consolidateFinanceCategories(store);
    changed += cleaned;
    if (!cleaned) break;
  }

  for (const order of store.state.encomendas) changed += syncOrderReceivable(store, order, idFactory) ? 1 : 0;
  changed += applyClientCredits(store, idFactory);
  if ((store.state.version || 0) < 2) { store.state.version = 2; changed++; }
  return changed;
}

/** Create/update the financial title derived from an order. Idempotent by sourceType+sourceId. */
function syncOrderReceivable(store, order, idFactory = () => crypto.randomUUID()) {
  const title = store.state.financeTitles.find((t) => t.sourceType === 'encomenda' && t.sourceId === order.id);
  const client = order.clienteId ? store.get('clients', order.clienteId) : null;
  const salesCat = categoryByKey(store, 'vendas');
  const configuredDays = Number(store.getConfig().orderPaymentDueDays);
  const dueDays = Number.isSafeInteger(configuredDays) && configuredDays >= 0 ? configuredDays : 0;
  const deliveryDay = financeDay(order.deliveryDate || order.at);
  const calculatedDue = new Date(`${deliveryDay}T12:00:00`);
  if (Number.isFinite(calculatedDue.getTime())) calculatedDue.setDate(calculatedDue.getDate() + dueDays);
  const automaticDueDate = Number.isFinite(calculatedDue.getTime()) ? calculatedDue.toISOString() : (order.deliveryDate || order.at);
  const legacyManualDue = title?.paymentDueManual == null && title?.competenceDate && financeDay(title.dueDate) !== financeDay(title.competenceDate);
  const paymentDueManual = Boolean(title?.paymentDueManual || legacyManualDue);
  const record = {
    ...(title || {}), id: title?.id || idFactory(), direction: 'receber',
    issuedAt: order.at || order.deliveryDate, competenceDate: order.deliveryDate || order.at,
    dueDate: paymentDueManual ? title.dueDate : automaticDueDate, paymentDueManual,
    amount: Number(order.total) || 0,
    description: `${order.quickSale ? 'Venda rápida' : 'Encomenda'}${client?.name || order.customerName ? ` · ${client?.name || order.customerName}` : ''}`,
    categoryId: salesCat?.id, partyType: 'cliente', partyId: order.clienteId,
    partyName: client?.name || order.customerName || 'Sem cliente', sourceType: 'encomenda', sourceId: order.id,
    ...(order.desistenciaAt ? { cancelledAt: order.desistenciaAt } : {}),
  };
  if (!order.desistenciaAt) delete record.cancelledAt;
  if (title && JSON.stringify(title) === JSON.stringify(record)) return false;
  store.upsertFinanceTitle(record); return true;
}

function categoryByKey(store, key) {
  return store.state.categories.find((c) => c.systemKey === key && !c.archived)
    || store.state.categories.find((c) => c.systemKey === key) || null;
}

function canonicalCategoryId(store, id) {
  let current = id;
  const seen = new Set();
  while (current && !seen.has(current)) {
    seen.add(current);
    const next = store.get('categories', current)?.duplicateOf;
    if (!next || !store.get('categories', next)) break;
    current = next;
  }
  return current;
}

function defaultCashAccount(store) {
  return store.state.cashAccounts.find((a) => a.systemKey === 'caixa') || store.state.cashAccounts.find((a) => !a.archived) || null;
}

function titleSettlements(store, title) {
  const activeSettlement = (s) => !store.isReversed('financeSettlement', s.id)
    && (s.kind !== 'client-payment-allocation' || !store.isReversed('cashAdjustment', s.paymentId));
  if (title.sourceType === 'encomenda') {
    const payments = store.state.payments.filter((p) => p.encomendaId === title.sourceId && !store.isReversed('payment', p.id))
      .map((p) => ({ id: p.id, at: p.at, titleId: title.id, amount: Number(p.valor) || 0, method: p.forma, kind: 'payment', legacyKind: 'payment' }));
    const adjustments = store.state.financeSettlements.filter((s) => s.titleId === title.id && activeSettlement(s));
    return [...payments, ...adjustments];
  }
  if (title.sourceType === 'sale') {
    const sale = store.get('sales', title.sourceId);
    return sale && !store.isReversed('sale', sale.id) ? [{ id: sale.id, at: sale.at, titleId: title.id, amount: title.amount, legacyKind: 'sale' }] : [];
  }
  if (title.sourceType === 'income') {
    const income = store.get('incomes', title.sourceId);
    return income && !store.isReversed('income', income.id) ? [{ id: income.id, at: income.at, titleId: title.id, amount: title.amount, legacyKind: 'income' }] : [];
  }
  if (title.sourceType === 'despesa') {
    const expense = store.get('despesas', title.sourceId);
    return expense && !store.isReversed('despesa', expense.id) ? [{ id: expense.id, at: expense.at, titleId: title.id, amount: title.amount, legacyKind: 'despesa' }] : [];
  }
  return store.state.financeSettlements.filter((s) => s.titleId === title.id && activeSettlement(s));
}

function titlePaid(store, title) {
  return titleSettlements(store, title).filter((s) => !['discount', 'credit', 'loss'].includes(s.kind)).reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
}

function titleState(store, title, today = localFinanceDay()) {
  const paid = Math.max(0, titlePaid(store, title));
  const discounted = Math.max(0, titleSettlements(store, title).filter((s) => s.kind === 'discount').reduce((sum, s) => sum + (Number(s.amount) || 0), 0));
  const credited = Math.max(0, titleSettlements(store, title).filter((s) => s.kind === 'credit').reduce((sum, s) => sum + (Number(s.amount) || 0), 0));
  const writtenOff = Math.max(0, titleSettlements(store, title).filter((s) => s.kind === 'loss').reduce((sum, s) => sum + (Number(s.amount) || 0), 0));
  const settled = paid + discounted + credited + writtenOff;
  const balance = Math.max(0, (Number(title.amount) || 0) - settled);
  let status = 'aberto';
  if (title.cancelledAt) status = 'cancelado';
  else if (balance <= 0.005) status = writtenOff > 0.005 ? 'perda' : 'quitado';
  else if (financeDay(title.dueDate) < today) status = 'vencido';
  else if (settled > 0.005) status = 'parcial';
  return { paid, discounted, credited, writtenOff, settled, balance, status, overdueDays: status === 'vencido' ? Math.max(1, Math.floor((new Date(`${today}T12:00:00`) - new Date(`${financeDay(title.dueDate)}T12:00:00`)) / 86400000)) : 0 };
}

/** Cash received beyond a client's titles, minus credit already used on later titles. */
function clientCreditNet(store, clientId) {
  let credit = 0;
  for (const title of store.state.financeTitles.filter((t) => t.direction === 'receber' && t.partyId === clientId && !t.cancelledAt)) {
    const settlements = titleSettlements(store, title);
    const paid = settlements.filter((s) => !['discount', 'credit', 'loss'].includes(s.kind)).reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
    const discounted = settlements.filter((s) => s.kind === 'discount').reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
    const applied = settlements.filter((s) => s.kind === 'credit').reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
    const amount = Number(title.amount) || 0;
    const writtenOff = settlements.filter((s) => s.kind === 'loss').reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
    credit += Math.max(0, paid + applied + Math.min(discounted + writtenOff, Math.max(0, amount - applied)) - amount);
    credit -= applied;
  }
  for (const entry of store.state.cashAdjustments) {
    if (entry.kind === 'client-credit' && entry.clientId === clientId && !store.isReversed('cashAdjustment', entry.id)) credit += Number(entry.amount) || 0;
    if (entry.kind === 'client-payment' && entry.clientId === clientId && !store.isReversed('cashAdjustment', entry.id)) credit += Number(entry.creditAmount) || 0;
  }
  return Math.round(credit * 100) / 100;
}

function clientCreditBalance(store, clientId) {
  return Math.max(0, clientCreditNet(store, clientId));
}

/** Apply available credit once per title. Credit use changes debt, never cash flow. */
function applyClientCredits(store, idFactory = () => crypto.randomUUID()) {
  let changed = 0;
  for (const client of store.state.clients) {
    // A corrected or reversed payment can remove credit that was already used. Reopen the
    // affected title instead of leaving it marked as paid by credit that no longer exists.
    const used = store.state.financeSettlements.filter((s) => s.kind === 'credit' && !store.isReversed('financeSettlement', s.id)
      && store.get('financeTitles', s.titleId)?.partyId === client.id).sort((a, b) => String(b.at).localeCompare(String(a.at)));
    for (const settlement of used) {
      if (clientCreditNet(store, client.id) >= -0.005) break;
      store.addReversal({ id: idFactory(), at: new Date().toISOString(), kind: 'financeSettlement', refId: settlement.id });
      changed++;
    }
    let available = clientCreditBalance(store, client.id);
    if (available < 0.005) continue;
    const titles = store.state.financeTitles.filter((t) => t.direction === 'receber' && t.partyId === client.id && !t.cancelledAt)
      .sort((a, b) => String(a.issuedAt || '').localeCompare(String(b.issuedAt || '')));
    for (const title of titles) {
      if (available < 0.005) break;
      const balance = titleState(store, title).balance;
      if (balance < 0.005) continue;
      const amount = Math.round(Math.min(available, balance) * 100) / 100;
      store.addFinanceSettlement({ id: idFactory(), at: new Date().toISOString(), titleId: title.id, amount, kind: 'credit', notes: 'Crédito do cliente aplicado automaticamente' });
      available = Math.round((available - amount) * 100) / 100;
      changed++;
    }
  }
  return changed;
}

function listTitles(store, filters = {}) {
  let rows = store.state.financeTitles.map((title) => ({ title, ...titleState(store, title, filters.today) }));
  if (filters.direction) rows = rows.filter((r) => r.title.direction === filters.direction);
  if (filters.start || filters.end) rows = rows.filter((r) => inRange(r.title.dueDate, filters.start, filters.end));
  if (filters.status && filters.status !== 'todos') {
    if (filters.status === 'aberto') rows = rows.filter((r) => ['aberto', 'parcial', 'vencido'].includes(r.status));
    else if (filters.status === 'parcial') rows = rows.filter((r) => r.settled > 0.005 && r.balance > 0.005);
    else rows = rows.filter((r) => r.status === filters.status);
  }
  if (filters.partyId) rows = rows.filter((r) => r.title.partyId === filters.partyId);
  if (filters.categoryId) rows = rows.filter((r) => canonicalCategoryId(store, r.title.categoryId) === canonicalCategoryId(store, filters.categoryId));
  if (filters.method) rows = rows.filter((r) => r.title.expectedMethod === filters.method || titleSettlements(store, r.title).some((s) => (s.method || '') === filters.method));
  return rows.sort((a, b) => financeDay(a.title.dueDate).localeCompare(financeDay(b.title.dueDate)) || a.title.description.localeCompare(b.title.description));
}

/** Actual cash movements only. Losses are managerial/stock facts and intentionally absent. */
function cashMovements(store, { includeReversed = false } = {}) {
  const out = [];
  const fallbackAccount = defaultCashAccount(store)?.id;
  for (const s of store.state.sales) {
    const reversed = store.isReversed('sale', s.id);
    if (!reversed || includeReversed) out.push({ id: `sale:${s.id}`, at: s.at, direction: 'entrada', amount: saleNet(s), label: 'Venda rápida', sourceType: 'sale', sourceId: s.id, accountId: fallbackAccount, categoryId: categoryByKey(store, 'vendas')?.id, reversed });
  }
  for (const p of store.state.payments) {
    const reversed = store.isReversed('payment', p.id);
    if (reversed && !includeReversed) continue;
    const order = store.get('encomendas', p.encomendaId); const title = store.state.financeTitles.find((t) => t.sourceType === 'encomenda' && t.sourceId === p.encomendaId);
    out.push({ id: `payment:${p.id}`, at: p.at, direction: 'entrada', amount: Number(p.valor) || 0, label: title?.partyName || 'Recebimento de venda', method: p.forma, sourceType: 'payment', sourceId: p.id, accountId: fallbackAccount, categoryId: title?.categoryId, order, reversed });
  }
  for (const i of store.state.incomes) {
    const reversed = store.isReversed('income', i.id);
    if (!reversed || includeReversed) out.push({ id: `income:${i.id}`, at: i.at, direction: 'entrada', amount: Number(i.valor) || 0, label: i.description || 'Outra receita', sourceType: 'income', sourceId: i.id, accountId: fallbackAccount, categoryId: i.categoryId, reversed });
  }
  for (const d of store.state.despesas) {
    const reversed = store.isReversed('despesa', d.id);
    if (!reversed || includeReversed) out.push({ id: `despesa:${d.id}`, at: d.at, direction: 'saida', amount: Number(d.valor) || 0, label: d.description || store.get('categories', d.categoryId)?.name || 'Despesa', sourceType: 'despesa', sourceId: d.id, accountId: fallbackAccount, categoryId: d.categoryId, reversed });
  }
  for (const v of store.state.variableCosts) {
    const reversed = store.isReversed('variableCost', v.id);
    if (!reversed || includeReversed) out.push({ id: `variableCost:${v.id}`, at: v.at, direction: 'saida', amount: Number(v.amount) || 0, label: v.description || v.note || 'Custo antigo', sourceType: 'variableCost', sourceId: v.id, accountId: fallbackAccount, categoryId: categoryByKey(store, 'outros-custos')?.id, reversed });
  }
  for (const st of store.state.financeSettlements) {
    const reversed = store.isReversed('financeSettlement', st.id);
    if (reversed && !includeReversed) continue;
    if (['discount', 'credit', 'loss', 'client-payment-allocation'].includes(st.kind)) continue;
    const title = store.get('financeTitles', st.titleId); if (!title) continue;
    out.push({ id: `financeSettlement:${st.id}`, at: st.at, direction: title.direction === 'receber' ? 'entrada' : 'saida', amount: Number(st.amount) || 0, label: title.description, method: st.method, sourceType: 'financeSettlement', sourceId: st.id, titleId: title.id, accountId: st.accountId || fallbackAccount, categoryId: title.categoryId, reversed });
  }
  for (const a of store.state.cashAdjustments) {
    const reversed = store.isReversed('cashAdjustment', a.id);
    if (reversed && !includeReversed) continue;
    if (a.kind === 'transfer') {
      out.push({ id: `cashAdjustment:${a.id}:out`, at: a.at, direction: 'saida', amount: Number(a.amount) || 0, label: a.description || 'Transferência', sourceType: 'cashAdjustment', sourceId: a.id, accountId: a.accountId, transfer: true, reversed });
      out.push({ id: `cashAdjustment:${a.id}:in`, at: a.at, direction: 'entrada', amount: Number(a.amount) || 0, label: a.description || 'Transferência', sourceType: 'cashAdjustment', sourceId: a.id, accountId: a.toAccountId, transfer: true, reversed });
    } else out.push({ id: `cashAdjustment:${a.id}`, at: a.at, direction: a.direction || 'entrada', amount: Number(a.amount) || 0, label: a.description || 'Ajuste financeiro', sourceType: 'cashAdjustment', sourceId: a.id, accountId: a.accountId || fallbackAccount, categoryId: a.categoryId, adjustment: true, reversed });
  }
  return out.sort((a, b) => (a.at < b.at ? 1 : -1));
}

function projectedMovements(store, start, end, filters = {}) {
  return listTitles(store, { status: 'aberto' }).filter((r) => r.balance > 0.005 && inRange(r.title.dueDate, start, end) && (!filters.accountId || true) && (!filters.categoryId || canonicalCategoryId(store, r.title.categoryId) === canonicalCategoryId(store, filters.categoryId))).map((r) => ({
    id: `projected:${r.title.id}`, at: r.title.dueDate, direction: r.title.direction === 'receber' ? 'entrada' : 'saida', amount: r.balance,
    label: r.title.description, projected: true, titleId: r.title.id, categoryId: r.title.categoryId,
  }));
}

function cashFlow(store, start, end, filters = {}) {
  const allAccounts = store.state.cashAccounts.filter((a) => !a.archived && (!filters.accountId || a.id === filters.accountId));
  const opening = allAccounts.reduce((sum, a) => sum + (Number(a.openingBalance) || 0), 0);
  // A transfer is relevant inside one selected account, but must disappear from the
  // consolidated company flow so it does not inflate both receipts and payments.
  const actualAll = cashMovements(store).filter((m) => filters.accountId ? m.accountId === filters.accountId : !m.transfer).filter((m) => !filters.categoryId || canonicalCategoryId(store, m.categoryId) === canonicalCategoryId(store, filters.categoryId));
  const prior = actualAll.filter((m) => financeDay(m.at) < start).reduce((sum, m) => sum + (m.direction === 'entrada' ? m.amount : -m.amount), opening);
  const movements = actualAll.filter((m) => inRange(m.at, start, end));
  const projected = filters.projected ? projectedMovements(store, start, end, filters) : [];
  const map = new Map();
  for (const m of [...movements, ...projected]) {
    const key = financeDay(m.at); const row = map.get(key) || { date: key, in: 0, out: 0, projectedIn: 0, projectedOut: 0, movements: [] };
    if (m.projected) { if (m.direction === 'entrada') row.projectedIn += m.amount; else row.projectedOut += m.amount; }
    else if (m.direction === 'entrada') row.in += m.amount; else row.out += m.amount;
    row.movements.push(m); map.set(key, row);
  }
  let cumulative = prior;
  const days = [...map.values()].sort((a, b) => a.date.localeCompare(b.date)).map((r) => { cumulative += r.in - r.out; return { ...r, balance: r.in - r.out, cumulative }; });
  return { start, end, opening: prior, days, totalIn: days.reduce((s, r) => s + r.in, 0), totalOut: days.reduce((s, r) => s + r.out, 0), projectedIn: days.reduce((s, r) => s + r.projectedIn, 0), projectedOut: days.reduce((s, r) => s + r.projectedOut, 0), ending: cumulative };
}

function financeDashboard(store, month, today = localFinanceDay()) {
  const start = `${month}-01`; const endDate = new Date(`${start}T12:00:00`); endDate.setMonth(endDate.getMonth() + 1); endDate.setDate(0);
  const end = localFinanceDay(endDate);
  const flow = cashFlow(store, start, end, { projected: true });
  const receivables = listTitles(store, { direction: 'receber', status: 'aberto' });
  const payables = listTitles(store, { direction: 'pagar', status: 'aberto' });
  return {
    flow,
    receivable: receivables.reduce((s, r) => s + r.balance, 0), payable: payables.reduce((s, r) => s + r.balance, 0),
    overdueReceivable: receivables.filter((r) => r.status === 'vencido').reduce((s, r) => s + r.balance, 0),
    overduePayable: payables.filter((r) => r.status === 'vencido').reduce((s, r) => s + r.balance, 0),
    dueSoon: [...receivables, ...payables].filter((r) => financeDay(r.title.dueDate) >= today && financeDay(r.title.dueDate) <= localFinanceDay(new Date(new Date(`${today}T12:00:00`).getTime() + 7 * 86400000))).length,
  };
}

// ── src/inventory.js ──
const add = (target, source, factor = 1) => {
  for (const [id, qty] of source) target.set(id, (target.get(id) || 0) + qty * factor);
  return target;
};

/** Ingredient quantities in stock units consumed by one yield-unit of a recipe. */
function recipeIngredientUsage(store, recipeId, stack = new Set()) {
  const recipe = store.get('recipes', recipeId);
  if (!recipe || stack.has(recipeId) || !(Number(recipe.yieldNominal) > 0)) return new Map();
  stack.add(recipeId);
  const result = new Map();
  for (const component of recipe.components || []) {
    if (component.ref?.kind === 'ingredient') {
      const ingredient = store.get('ingredients', component.ref.id);
      if (!ingredient) continue;
      try {
        const stockQty = convert(Number(component.qty) || 0, component.unit, ingredient.stockUnit, ingredient.conversions);
        result.set(ingredient.id, (result.get(ingredient.id) || 0) + stockQty / Number(recipe.yieldNominal));
      } catch { /* incompatible legacy unit: do not invent a stock movement */ }
    } else if (component.ref?.kind === 'recipe') {
      const nested = store.get('recipes', component.ref.id);
      if (!nested) continue;
      try {
        const nestedYieldUnits = convert(Number(component.qty) || 0, component.unit, nested.yieldUnit);
        add(result, recipeIngredientUsage(store, nested.id, stack), nestedYieldUnits / Number(recipe.yieldNominal));
      } catch { /* incompatible legacy unit */ }
    }
  }
  stack.delete(recipeId);
  return result;
}

/** Ingredient quantities in stock units consumed by one produced unit of a product. */
function productIngredientUsage(store, productId, stack = new Set()) {
  const product = store.get('products', productId);
  if (!product || stack.has(productId)) return new Map();
  stack.add(productId);
  const result = new Map();
  for (const component of product.components || []) {
    const qty = Number(component.qty) || 0;
    if (component.kind === 'recipe') add(result, recipeIngredientUsage(store, component.id), qty);
    // Bundle children appear as separate produced rows in the comanda. Only its physical
    // packaging/details are consumed on the parent row, preventing duplicate stock usage.
    else if (component.kind === 'product' && !isBundleProduct(product)) add(result, productIngredientUsage(store, component.id, stack), qty);
    else if (component.kind === 'ingredient') result.set(component.id, (result.get(component.id) || 0) + qty);
  }
  stack.delete(productId);
  return result;
}

/** Current ingredient stock. Sales never enter this calculation. */
function inventorySummary(store) {
  const purchased = new Map();
  for (const purchase of store.state.purchases || []) {
    for (const item of purchase.items || []) purchased.set(item.ingredientId, (purchased.get(item.ingredientId) || 0) + (Number(item.qty) || 0));
  }
  const producedUsage = new Map();
  for (const command of store.state.comandas || []) for (const item of command.itens || []) {
    const produced = Number(item.realizado) || 0;
    if (produced > 0) add(producedUsage, productIngredientUsage(store, item.productId), produced);
  }
  const lost = new Map();
  for (const loss of store.state.perdas || []) {
    if (store.isReversed('perda', loss.id) || loss.refKind !== 'insumo' || !loss.refId) continue;
    lost.set(loss.refId, (lost.get(loss.refId) || 0) + (Number(loss.qty) || 0));
  }
  return (store.state.ingredients || []).map((ingredient) => {
    const opening = Number(ingredient.stockQty) || 0;
    const purchases = purchased.get(ingredient.id) || 0;
    const production = producedUsage.get(ingredient.id) || 0;
    const losses = lost.get(ingredient.id) || 0;
    const current = opening + purchases - production - losses;
    const minimum = Math.max(0, Number(ingredient.minStockQty) || 0);
    return { ingredient, opening, purchases, production, losses, current, minimum, low: minimum > 0 && current <= minimum };
  });
}

function ingredientInventory(store, ingredientId) {
  return inventorySummary(store).find((row) => row.ingredient.id === ingredientId) || null;
}

// ── src/assets.js ──
// Straight-line managerial depreciation. An asset enters the calculation on the day it is
// available for use, not on the day it is paid. The useful life is entered in months; a
// partial reporting period receives its proportional share of calendar days.

const dayMs = 86400000;
const assetDay = (value) => String(value || '').slice(0, 10);
const utc = (value) => {
  const text = assetDay(value);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return NaN;
  return Date.parse(`${text}T00:00:00Z`);
};

function assetDepreciation(asset, start, end) {
  const cost = Number(asset.cost) || 0;
  const residual = Number(asset.residualValue) || 0;
  const months = Number(asset.usefulMonths) || 0;
  const inUse = utc(asset.inUseDate);
  const rangeStart = utc(start);
  const rangeEnd = utc(end);
  if (asset.archived || !(cost > residual) || !(months > 0) || !Number.isInteger(months)
      || !Number.isFinite(inUse) || !Number.isFinite(rangeStart) || !Number.isFinite(rangeEnd)) return 0;
  const date = new Date(inUse);
  const monthIndex = date.getUTCMonth() + months;
  const years = date.getUTCFullYear() + Math.floor(monthIndex / 12);
  const month = monthIndex % 12;
  const lastDay = new Date(Date.UTC(years, month + 1, 0)).getUTCDate();
  const endUse = Date.UTC(years, month, Math.min(date.getUTCDate(), lastDay));
  const stop = Number.isFinite(utc(asset.disposalDate)) ? Math.min(endUse, utc(asset.disposalDate)) : endUse;
  const overlap = Math.max(0, Math.min(rangeEnd + dayMs, stop) - Math.max(rangeStart, inUse));
  return overlap > 0 ? ((cost - residual) * overlap) / (endUse - inUse) : 0;
}

function depreciationSummary(store, start, end) {
  const rows = (store.state.assets || []).map((asset) => ({ asset, amount: assetDepreciation(asset, start, end) }))
    .filter((row) => row.amount > 0);
  const production = rows.filter((row) => row.asset.use === 'producao').reduce((sum, row) => sum + row.amount, 0);
  const administration = rows.reduce((sum, row) => sum + row.amount, 0) - production;
  return { rows, production, administration, total: production + administration };
}

// ── src/dre.js ──
// DRE gerencial por competência. Diferente do fluxo de caixa: considera o valor integral quando
// a receita/despesa pertence ao período, independentemente da data de recebimento ou pagamento.







const dreDay = (iso) => String(iso || '').slice(0, 10);
const dreInPeriod = (iso, start, end) => (!start || dreDay(iso) >= start) && (!end || dreDay(iso) <= end);
const dreAmount = (value) => Number(value) || 0;

/** Ingredient and packaging cost of products sold, without allocated salaries or fixed costs. */
function orderMaterialEstimate(store, order) {
  const engine = store.toEngineStore();
  const config = store.getConfig(); const lens = estimateLens(config);
  let ingredients = 0; let packaging = 0; let missing = 0;
  const one = (id, qty) => {
    if (!(qty > 0)) return;
    try {
      const product = store.get('products', id);
      const parts = productBreakdown(engine, id, config, lens);
      ingredients += (Number(parts.ingredients) || 0) * qty;
      packaging += ((Number(parts.packaging) || 0) + (Number(product?.packagingCost) || 0)) * qty;
    } catch { missing++; }
  };
  for (const item of order.itens || []) {
    const qty = Math.max(0, Number(item.qty) || 0);
    one(item.productId, qty);
    for (const child of item.bundleItems || []) one(child.productId, qty * Math.max(0, Number(child.qty) || 0));
  }
  return { ingredients, packaging, missing };
}

function managerialDre(store, start, end) {
  const revenue = new Map(); const costs = new Map(); const expenses = new Map(); const selling = new Map();
  const linkedSources = new Set();
  let salesRevenue = 0; let otherRevenue = 0; let directCosts = 0; let operatingExpenses = 0;
  let salesDiscounts = 0; let settlementDiscounts = 0; let salesReturns = 0; let salesTaxes = 0; let sellingExpenses = 0; let indirectCosts = 0; let clientLosses = 0;
  let missingMaterials = 0; let undeliveredSales = 0; let legacyCostEstimates = 0;
  let fixedExpenses = 0; let variableExpenses = 0; let excluded = 0; let unclassified = 0;
  let openReceivables = 0; let openPayables = 0; let overdueReceivables = 0;

  const categoryOf = (id) => id ? store.get('categories', id) : null;
  const addRow = (map, category, fallback, amount) => {
    const id = category?.id || `__${fallback}`;
    const row = map.get(id) || { id, name: category?.name || fallback, amount: 0 };
    row.amount += amount; map.set(id, row);
  };
  const classify = (direction, amount, category, fallback, sourceKind) => {
    if (!(amount > 0)) return false;
    const nature = category?.nature || (category?.kind === 'receita' ? 'receita' : category?.kind === 'custo' || category?.kind === 'perda' ? 'custo' : category?.kind ? 'despesa' : null);
    if (category?.cashFlowGroup === 'investimento' || category?.cashFlowGroup === 'financiamento' || nature === 'investimento' || nature === 'movimento') { excluded += amount; return false; }
    if (!category) unclassified += 1;
    if (direction === 'pagar' && category?.systemKey === 'devolucoes-vendas') { salesReturns += amount; return true; }
    if (direction === 'pagar' && category?.systemKey === 'tributos-vendas') { salesTaxes += amount; return true; }
    if (direction === 'receber') {
      addRow(revenue, category, fallback || 'Receita sem categoria', amount);
      if (category?.systemKey === 'vendas' || sourceKind === 'sale' || sourceKind === 'encomenda') salesRevenue += amount;
      else otherRevenue += amount;
    } else if (['taxas-venda', 'motoboy', 'comissoes-venda'].includes(category?.systemKey)) {
      addRow(selling, category, fallback || 'Despesa de venda', amount); sellingExpenses += amount;
    } else if (nature === 'custo') {
      addRow(costs, category, fallback || 'Custo sem categoria', amount); directCosts += amount;
      if (category?.behavior === 'fixa' || category?.systemKey === 'indiretos-producao') indirectCosts += amount;
    } else {
      addRow(expenses, category, fallback || 'Despesa sem categoria', amount); operatingExpenses += amount;
      if (category?.behavior === 'fixa' || (!category?.behavior && category?.kind === 'despesaFixa')) fixedExpenses += amount;
      else variableExpenses += amount;
      if (category?.systemKey === 'perdas-clientes') clientLosses += amount;
    }
    return true;
  };

  for (const title of store.state.financeTitles) {
    if (title.sourceType && title.sourceId) linkedSources.add(`${title.sourceType}:${title.sourceId}`);
    if (title.cancelledAt || !dreInPeriod(title.competenceDate || title.issuedAt || title.dueDate, start, end)) continue;
    // The stock purchase creates an asset. Its materials enter the result when products are sold.
    if (title.sourceType === 'compra') { excluded += Math.max(0, dreAmount(title.amount)); continue; }
    const order = title.sourceType === 'encomenda' ? store.get('encomendas', title.sourceId) : null;
    if (order && (order.desistenciaAt || !order.entregue)) { if (!order.desistenciaAt) undeliveredSales++; continue; }
    const state = titleState(store, title);
    // The original sale belongs to its delivery period. A later settlement discount is
    // recognized separately on the date it was granted, without moving cash.
    const amount = Math.max(0, dreAmount(title.amount)); const category = categoryOf(title.categoryId);
    if (title.direction === 'receber' && (order || ['vendas', 'vendas-encomendas'].includes(category?.systemKey))) {
      salesDiscounts += order ? Math.max(0, orderGross(order) - dreAmount(title.amount)) : 0;
    }
    const included = classify(title.direction, amount, category, title.description, title.sourceType);
    if (included) {
      if (title.direction === 'receber') {
        openReceivables += state.balance;
        if (dreDay(title.dueDate) < dreDay(new Date().toISOString())) overdueReceivables += state.balance;
      } else openPayables += state.balance;
    }
  }

  for (const settlement of store.state.financeSettlements) {
    if (settlement.kind === 'discount' && !store.isReversed('financeSettlement', settlement.id)) {
      const title = store.get('financeTitles', settlement.titleId);
      const order = title?.sourceType === 'encomenda' ? store.get('encomendas', title.sourceId) : null;
      const recognitionAt = order?.entregue && dreDay(settlement.at) < dreDay(order.deliveryDate) ? order.deliveryDate : settlement.at;
      if (title?.direction === 'receber' && !title.cancelledAt && !order?.desistenciaAt && (!order || order.entregue) && dreInPeriod(recognitionAt, start, end)) settlementDiscounts += Math.max(0, dreAmount(settlement.amount));
    }
    if (settlement.kind !== 'loss' || store.isReversed('financeSettlement', settlement.id) || !dreInPeriod(settlement.at, start, end)) continue;
    const title = store.get('financeTitles', settlement.titleId);
    if (title?.direction === 'receber' && !title.cancelledAt) classify('pagar', dreAmount(settlement.amount), store.state.categories.find((c) => c.systemKey === 'perdas-clientes'), `Perda com cliente · ${title.partyName || title.description}`, 'loss');
  }

  // Operational records created before the title-based Financeiro remain valid and are included
  // only when no linked title exists, preventing double counting after migrations.
  for (const order of store.state.encomendas) if (!order.desistenciaAt && !linkedSources.has(`encomenda:${order.id}`) && dreInPeriod(order.deliveryDate || order.at, start, end)) {
    if (!order.entregue) { undeliveredSales++; continue; }
    classify('receber', dreAmount(order.total), store.state.categories.find((c) => c.systemKey === 'vendas'), 'Vendas de quitutes', 'encomenda');
    salesDiscounts += Math.max(0, orderGross(order) - dreAmount(order.total));
    openReceivables += Math.max(0, dreAmount(order.total) - store.paidFor(order.id));
  }
  for (const sale of store.state.sales) if (!store.isReversed('sale', sale.id) && !linkedSources.has(`sale:${sale.id}`) && dreInPeriod(sale.at, start, end)) {
    classify('receber', saleNet(sale), store.state.categories.find((c) => c.systemKey === 'vendas'), 'Vendas rápidas', 'sale');
    salesDiscounts += Math.max(0, dreAmount(sale.discount));
  }
  for (const income of store.state.incomes) if (!store.isReversed('income', income.id) && !linkedSources.has(`income:${income.id}`) && dreInPeriod(income.at, start, end)) {
    classify('receber', dreAmount(income.valor), categoryOf(income.categoryId), income.description || 'Outras receitas', 'income');
  }
  for (const expense of store.state.despesas) if (!store.isReversed('despesa', expense.id) && !linkedSources.has(`despesa:${expense.id}`) && dreInPeriod(expense.at, start, end)) {
    classify('pagar', dreAmount(expense.valor), categoryOf(expense.categoryId), expense.description || 'Despesa', 'despesa');
  }
  for (const legacy of store.state.variableCosts) if (!store.isReversed('variableCost', legacy.id) && dreInPeriod(legacy.at, start, end)) {
    classify('pagar', dreAmount(legacy.amount), store.state.categories.find((c) => c.systemKey === 'outros-custos'), legacy.description || legacy.note || 'Custo antigo', 'variableCost');
  }
  for (const purchase of store.state.purchases) if (!linkedSources.has(`compra:${purchase.id}`) && dreInPeriod(purchase.at, start, end)) excluded += Math.max(0, dreAmount(purchase.total));
  for (const loss of store.state.perdas) if (!store.isReversed('perda', loss.id) && dreInPeriod(loss.at, start, end)) {
    classify('pagar', dreAmount(loss.amount), store.state.categories.find((c) => c.systemKey === 'perdas-producao'), 'Perdas de produção', 'perda');
  }

  let materialCosts = 0; let packagingCosts = 0;
  for (const order of store.state.encomendas) if (order.entregue && !order.desistenciaAt && dreInPeriod(order.deliveryDate || order.at, start, end)) {
    const estimate = orderMaterialEstimate(store, order);
    if (order.materialCostSnapshot == null || order.packagingCostSnapshot == null) legacyCostEstimates++;
    materialCosts += order.materialCostSnapshot != null ? Math.max(0, dreAmount(order.materialCostSnapshot)) : estimate.ingredients;
    packagingCosts += order.packagingCostSnapshot != null ? Math.max(0, dreAmount(order.packagingCostSnapshot)) : estimate.packaging;
    missingMaterials += estimate.missing;
  }
  for (const sale of store.state.sales) if (!store.isReversed('sale', sale.id) && dreInPeriod(sale.at, start, end)) {
    const estimate = orderMaterialEstimate(store, { itens: [{ productId: sale.productId, qty: sale.qty }] });
    if (sale.materialCostSnapshot == null || sale.packagingCostSnapshot == null) legacyCostEstimates++;
    materialCosts += sale.materialCostSnapshot != null ? Math.max(0, dreAmount(sale.materialCostSnapshot)) : estimate.ingredients;
    packagingCosts += sale.packagingCostSnapshot != null ? Math.max(0, dreAmount(sale.packagingCostSnapshot)) : estimate.packaging;
    missingMaterials += estimate.missing;
  }
  const depreciation = depreciationSummary(store, start, end);
  const inventory = inventorySummary(store);
  let inventoryValue = 0; let unpricedInventory = 0;
  for (const row of inventory) {
    if (!(row.current > 0)) continue;
    const price = store.currentPrice(row.ingredient.id);
    if (price == null) unpricedInventory++;
    else inventoryValue += row.current * Math.max(0, dreAmount(price));
  }
  directCosts += materialCosts + packagingCosts + depreciation.production;
  const grossRevenue = salesRevenue + otherRevenue - settlementDiscounts - salesReturns - salesTaxes;
  const grossProfit = grossRevenue - directCosts;
  const netResult = grossProfit - operatingExpenses - sellingExpenses - depreciation.administration;
  const grossMarginPct = grossRevenue > 0 ? grossProfit / grossRevenue : null;
  const netMarginPct = grossRevenue > 0 ? netResult / grossRevenue : null;
  const diagnostics = [];
  const note = (tone, title, text) => diagnostics.push({ tone, title, text });
  if (grossRevenue <= 0) note('warn', 'Sem receita líquida no período', 'Não houve receita líquida positiva neste período. Confira vendas entregues, descontos concedidos e outras receitas.');
  else {
    if (directCosts <= 0) note('warn', 'Custos de produção não informados', 'O resultado pode estar superestimado. Cadastre receitas, preços dos insumos e despesas de produção.');
    else if (directCosts / grossRevenue > 0.60) note('warn', 'Custos diretos elevados', `Os custos consomem ${Math.round((directCosts / grossRevenue) * 100)}% da receita. Revise compras, perdas, rendimento e preços.`);
    else note('ok', 'Margem bruta acompanhada', `A margem bruta do período é de ${Math.round(grossMarginPct * 100)}%. Compare a evolução entre períodos.`);
    if (netResult < 0) note('bad', 'Prejuízo no período', 'Custos e despesas superaram as receitas. Priorize os maiores grupos e reveja preços e gastos recorrentes.');
    else if (netMarginPct < 0.10) note('warn', 'Margem líquida apertada', `A margem líquida ficou em ${Math.round(netMarginPct * 100)}%. Há pouca folga para imprevistos e reinvestimentos.`);
    else note('ok', 'Resultado positivo', `A margem líquida gerencial ficou em ${Math.round(netMarginPct * 100)}% no período.`);
    if (operatingExpenses / grossRevenue > 0.35) note('warn', 'Despesas operacionais elevadas', `As despesas representam ${Math.round((operatingExpenses / grossRevenue) * 100)}% da receita. Observe principalmente os gastos fixos.`);
  }
  if (openReceivables > 0.005) note('info', 'Lucro não é dinheiro em caixa', `Há R$ ${openReceivables.toFixed(2).replace('.', ',')} de receitas desta DRE ainda a receber.`);
  if (overdueReceivables > 0.005) note('warn', 'Contas vencidas', 'O saldo vencido é um risco; só a perda confirmada reduz o lucro líquido.');
  if (openPayables > 0.005) note('info', 'Obrigações pendentes', `Há R$ ${openPayables.toFixed(2).replace('.', ',')} de custos e despesas desta DRE ainda a pagar.`);
  if (unclassified) note('warn', 'Lançamentos sem categoria', `${unclassified} lançamento(s) foram incluídos por direção, mas precisam ser classificados para melhorar a precisão da DRE.`);
  if (excluded > 0.005) note('info', 'Aquisições e investimentos fora do lucro', 'Compras de estoque, equipamentos e movimentações patrimoniais não são despesa integral no dia da compra.');
  if (undeliveredSales) note('info', 'Pedidos ainda não entregues', `${undeliveredSales} pedido(s) ainda não entram como venda nesta DRE.`);
  if (missingMaterials) note('warn', 'Custos de produtos incompletos', `${missingMaterials} item(ns) vendidos não tiveram o custo de insumos calculado. Confira o cadastro e os preços de compra.`);
  if (legacyCostEstimates) note('info', 'Vendas antigas sem custo congelado', `${legacyCostEstimates} venda(s) antigas usam os preços atuais de insumos como estimativa. Mudanças de preço podem alterar a DRE histórica.`);
  if (unpricedInventory) note('warn', 'Estoque sem preço', `${unpricedInventory} insumo(s) com estoque não têm preço e ficaram fora do valor estimado.`);

  const rows = (map) => [...map.values()].sort((a, b) => b.amount - a.amount || a.name.localeCompare(b.name, 'pt-BR'));
  return {
    start, end, salesRevenue: salesRevenue - settlementDiscounts, salesGross: salesRevenue + salesDiscounts, salesDiscounts: salesDiscounts + settlementDiscounts, salesReturns, salesTaxes,
    otherRevenue, grossRevenue, directCosts, materialCosts, packagingCosts, productionDepreciation: depreciation.production,
    administrationDepreciation: depreciation.administration, inventoryValue, unpricedInventory, missingMaterials, legacyCostEstimates,
    grossProfit, sellingExpenses, indirectCosts, clientLosses,
    operatingExpenses, fixedExpenses, variableExpenses, netResult, grossMarginPct, netMarginPct,
    openReceivables, openPayables, overdueReceivables, excluded, unclassified, diagnostics,
    revenueRows: rows(revenue), costRows: rows(costs), sellingRows: rows(selling), expenseRows: rows(expenses),
  };
}

// ── src/reports.js ──
// paiol — reporting aggregations (Rev 06: CASH BASIS). Pure functions over a PaiolStore; no DOM,
// no I/O — unit-testable. The UI (Relatórios) renders these.
//
// The monthly RESULT is a pure cash ledger and NEVER uses the recipe/product unit cost (that lives
// only in pricing — Preços/Simulador). This separation is what guarantees no double-counting (§9):
//   Saldo operacional de caixa = Receitas recebidas − pagamentos realizados.
// Perdas sem pagamento no momento do registro não saem do caixa; ficam como indicador gerencial
// de produção. Isso evita contar novamente o valor de um insumo cuja compra já foi paga.
// Receita is recognized when RECEIVED (walk-up sales are paid on the spot; encomenda payments when
// they land); despesas/perdas when lançadas. The per-PRODUCT analysis (productSummary) DOES use the
// recipe cost — but ONLY as an ESTIMATE for "which products earn most" (a decision tool), never in
// the cash result.






const ym = (iso) => String(iso || '').slice(0, 7); // 'YYYY-MM'
const day = (iso) => String(iso || '').slice(0, 10);
const inPeriod = (iso, start, end) => (!start || day(iso) >= start) && (!end || day(iso) <= end);

/**
 * Cash-basis monthly result + reference figures.
 * @param {import('./store.js').PaiolStore} store @param {string} month 'YYYY-MM'
 */
function monthSummary(store, month) {
  // Receitas recebidas: walk-up sales (paid on the spot) + encomenda payments that landed this month.
  let recebidoVendas = 0; let unidades = 0;
  for (const s of store.state.sales) {
    if (ym(s.at) !== month || store.isReversed('sale', s.id)) continue;
    recebidoVendas += saleNet(s);
    unidades += s.qty;
  }
  let recebidoPagamentos = 0;
  for (const pg of store.state.payments) {
    if (ym(pg.at) !== month || store.isReversed('payment', pg.id)) continue;
    recebidoPagamentos += pg.valor || 0;
  }
  let recebidoOutrasReceitas = 0;
  for (const income of store.state.incomes || []) {
    if (ym(income.at) !== month || store.isReversed('income', income.id)) continue;
    recebidoOutrasReceitas += income.valor || 0;
  }
  let recebidoFinanceiro = 0;
  for (const st of store.state.financeSettlements || []) {
    if (ym(st.at) !== month || store.isReversed('financeSettlement', st.id)) continue;
    if (['discount', 'credit', 'loss', 'client-payment-allocation'].includes(st.kind)) continue;
    const title = store.get('financeTitles', st.titleId);
    if (title?.direction === 'receber') recebidoFinanceiro += st.amount || 0;
  }
  for (const payment of store.state.cashAdjustments || []) {
    if (payment.kind !== 'client-payment' || ym(payment.at) !== month || store.isReversed('cashAdjustment', payment.id)) continue;
    recebidoFinanceiro += Number(payment.amount) || 0;
  }
  const recebido = recebidoVendas + recebidoPagamentos + recebidoOutrasReceitas + recebidoFinanceiro;

  // Despesas lançadas this month, split by the category's kind (default → variável).
  let despVar = 0; let despFix = 0; let custos = 0;
  for (const d of store.state.despesas) {
    if (ym(d.at) !== month || store.isReversed('despesa', d.id)) continue;
    const kind = store.get('categories', d.categoryId)?.kind;
    if (kind === 'despesaFixa') despFix += d.valor || 0;
    else if (kind === 'custo') custos += d.valor || 0;
    else despVar += d.valor || 0;
  }
  // Legacy ad-hoc variable costs (pre-Rev 06) fold into variável so nothing is lost.
  for (const v of store.state.variableCosts) {
    if (ym(v.at) === month && !store.isReversed('variableCost', v.id)) despVar += v.amount || 0;
  }
  let pagoFinanceiro = 0;
  for (const st of store.state.financeSettlements || []) {
    if (ym(st.at) !== month || store.isReversed('financeSettlement', st.id)) continue;
    if (['discount', 'loss'].includes(st.kind)) continue;
    const title = store.get('financeTitles', st.titleId); if (title?.direction !== 'pagar') continue;
    const category = store.get('categories', title.categoryId); const value = st.amount || 0;
    pagoFinanceiro += value;
    if (category?.nature === 'custo' || category?.kind === 'custo') custos += value;
    else if (category?.kind === 'despesaFixa' || category?.behavior === 'fixa') despFix += value;
    else despVar += value;
  }
  let perdas = 0;
  for (const p of store.state.perdas) {
    if (ym(p.at) === month && !store.isReversed('perda', p.id)) perdas += p.amount || 0;
  }
  const despesas = despVar + despFix + custos;
  const saldoCaixa = recebido - despesas;
  const lucro = saldoCaixa; // alias legado; a interface usa o nome correto "saldo de caixa".

  // Reference (accrual): what you sold/delivered this month, and what is still owed (current total).
  let faturado = recebidoVendas; // walk-up sales are also "faturado" in their month
  for (const e of store.state.encomendas) if (!e.desistenciaAt && ym(e.quickSale ? e.at : e.deliveryDate) === month) faturado += e.total || 0;
  let aReceber = 0;
  for (const e of store.state.encomendas) {
    if (e.desistenciaAt) continue;
    const title = store.state.financeTitles.find((t) => t.sourceType === 'encomenda' && t.sourceId === e.id);
    const saldo = title ? titleState(store, title).balance : (e.total || 0) - store.paidFor(e.id);
    if (saldo > 0.005) aReceber += saldo;
  }
  for (const t of store.state.financeTitles || []) {
    if (t.direction !== 'receber' || t.sourceType === 'encomenda' || t.cancelledAt) continue;
    const saldo = titleState(store, t).balance;
    if (saldo > 0.005) aReceber += saldo;
  }

  return {
    month, recebido, recebidoVendas, recebidoPagamentos, recebidoOutrasReceitas, recebidoFinanceiro,
    despVar, despFix, custos, pagoFinanceiro, perdas, despesas, saldoCaixa, lucro,
    faturado, aReceber, unidades,
    margem: recebido > 0 ? lucro / recebido : 0,
  };
}

/** Despesas grouped by category for the month, biggest first; folds legacy costs into a bucket. */
function despesasByCategory(store, month) {
  const map = new Map();
  for (const d of store.state.despesas) {
    if (ym(d.at) !== month || store.isReversed('despesa', d.id)) continue;
    map.set(d.categoryId, (map.get(d.categoryId) || 0) + (d.valor || 0));
  }
  for (const st of store.state.financeSettlements || []) {
    if (ym(st.at) !== month || store.isReversed('financeSettlement', st.id)) continue;
    if (['discount', 'loss'].includes(st.kind)) continue;
    const title = store.get('financeTitles', st.titleId);
    if (title?.direction !== 'pagar') continue;
    map.set(title.categoryId || '__sem__', (map.get(title.categoryId || '__sem__') || 0) + (st.amount || 0));
  }
  const rows = [...map.entries()].map(([id, total]) => {
    const c = store.get('categories', id);
    return { id, name: c?.name || '(sem categoria)', kind: c?.kind || 'despesaVariavel', total };
  });
  let legacy = 0;
  for (const v of store.state.variableCosts) if (ym(v.at) === month && !store.isReversed('variableCost', v.id)) legacy += v.amount || 0;
  if (legacy > 0) rows.push({ id: '__legacy__', name: 'Outras (lançamentos antigos)', kind: 'despesaVariavel', total: legacy });
  return rows.sort((a, b) => b.total - a.total);
}

/**
 * Per-product analysis for the month (walk-up sales + encomenda items delivered this month):
 * [{ id, name, qty, faturamento, lucroEstimado }]. `lucroEstimado` uses the recipe unit cost as an
 * ESTIMATE (decision tool — "which products earn most"); it is NOT the cash result. Caller sorts.
 */
function productSummary(store, month) {
  const config = store.getConfig();
  const es = store.toEngineStore();
  const lens = estimateLens(config);
  const unitCost = (pid) => { try { return productUnitCost(es, pid, config, lens); } catch { return 0; } };
  const map = new Map();
  const add = (pid, qty, revenue) => {
    const e = map.get(pid) || { qty: 0, faturamento: 0, custoEst: 0 };
    e.qty += qty; e.faturamento += revenue; e.custoEst += qty * unitCost(pid);
    map.set(pid, e);
  };
  for (const s of store.state.sales) {
    if (ym(s.at) !== month || store.isReversed('sale', s.id)) continue;
    add(s.productId, s.qty, saleNet(s));
  }
  for (const e of store.state.encomendas) {
    if (e.desistenciaAt || ym(e.quickSale ? e.at : e.deliveryDate) !== month) continue;
    for (const it of e.itens || []) for (const line of orderItemSaleLines(it)) add(line.productId, line.qty, line.total);
  }
  return [...map.entries()].map(([id, e]) => ({
    id, name: store.get('products', id)?.name || '(produto removido)',
    qty: e.qty, faturamento: e.faturamento, lucroEstimado: e.faturamento - e.custoEst,
  }));
}

/** Per-client totals for the month (from encomendas delivered), biggest spender first. */
function clientSummary(store, month) {
  const map = new Map();
  for (const e of store.state.encomendas) {
    if (e.desistenciaAt || ym(e.quickSale ? e.at : e.deliveryDate) !== month) continue;
    const key = e.clienteId || '__sem__';
    const c = map.get(key) || { total: 0, recebido: 0, n: 0 };
    c.total += e.total || 0; c.recebido += store.paidFor(e.id); c.n += 1;
    map.set(key, c);
  }
  return [...map.entries()].map(([id, c]) => ({
    id, name: id === '__sem__' ? 'Sem cliente' : (store.get('clients', id)?.name || '(removido)'),
    total: c.total, recebido: c.recebido, saldo: c.total - c.recebido, n: c.n,
  })).sort((a, b) => b.total - a.total);
}

/**
 * The `n` month keys ending at `month` (oldest first). Deterministic — no "now" dependency.
 * @param {string} month 'YYYY-MM' @param {number} n @returns {string[]}
 */
function monthsEndingAt(month, n) {
  const [y, m] = month.split('-').map(Number);
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(y, (m - 1) - i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  return out;
}

/** Recebido + lucro per month over a trailing window, for the evolution chart. */
function revenueTrend(store, month, n = 6) {
  return monthsEndingAt(month, n).map((mo) => {
    const s = monthSummary(store, mo);
    return { month: mo, recebido: s.recebido, lucro: s.lucro };
  });
}

const trendDate = (value) => new Date(`${value}T12:00:00`);
const trendDay = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
const trendAddDays = (value, days) => { const date = trendDate(value); date.setDate(date.getDate() + days); return trendDay(date); };

/** DRE net-result evolution using daily, weekly or monthly buckets according to the chosen period. */
function businessProfitTrend(store, start, end) {
  if (!start || !end || start > end) return [];
  const span = Math.round((trendDate(end) - trendDate(start)) / 86400000) + 1;
  const buckets = [];
  if (span <= 31) {
    for (let cursor = start; cursor <= end; cursor = trendAddDays(cursor, 1)) buckets.push({ start: cursor, end: cursor, label: cursor.slice(8, 10) + '/' + cursor.slice(5, 7) });
  } else if (span <= 120) {
    for (let cursor = start; cursor <= end;) {
      const nextEnd = trendAddDays(cursor, 6);
      const bucketEnd = nextEnd > end ? end : nextEnd;
      buckets.push({ start: cursor, end: bucketEnd, label: cursor.slice(8, 10) + '/' + cursor.slice(5, 7) });
      cursor = trendAddDays(bucketEnd, 1);
    }
  } else {
    let cursor = start;
    while (cursor <= end) {
      const date = trendDate(cursor);
      const monthEnd = new Date(date.getFullYear(), date.getMonth() + 1, 0, 12);
      const bucketEnd = trendDay(monthEnd) > end ? end : trendDay(monthEnd);
      buckets.push({ start: cursor, end: bucketEnd, label: `${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getFullYear()).slice(2)}` });
      cursor = trendAddDays(bucketEnd, 1);
    }
  }
  return buckets.map((bucket) => ({ ...bucket, profit: managerialDre(store, bucket.start, bucket.end).netResult }));
}

/**
 * Commercial decision indicators for an inclusive period. Sales volume is recognized on the sale
 * date (walk-up) or scheduled delivery date (orders). Margins are estimates using the current
 * technical sheet; they are deliberately separate from realized cash.
 */
function businessPeriodSummary(store, start, end) {
  const config = store.getConfig();
  const es = store.toEngineStore();
  const lens = estimateLens(config);
  const productCosts = new Map();
  const unitCost = (id) => {
    if (productCosts.has(id)) return productCosts.get(id);
    let value = null;
    const product = store.get('products', id);
    try { if ((product?.components || []).length || Number(product?.packagingCost) > 0) value = productUnitCost(es, id, config, lens); } catch { /* incomplete technical sheet */ }
    productCosts.set(id, value); return value;
  };
  // Only active catalog items count as "without sales". An inactive item is still added below if
  // it has a historical sale in this period, preserving the truth of past reports and rankings.
  const products = new Map(store.state.products.filter((p) => p.active !== false).map((p) => [p.id, { id: p.id, name: p.name, qty: 0, revenue: 0, cost: 0, fees: 0, costKnown: true }]));
  const clients = new Map();
  let basketRevenue = 0;
  const addProduct = (id, qty, revenue, feePct, costOverride = null) => {
    const product = store.get('products', id);
    const row = products.get(id) || { id, name: product?.name || '(produto removido)', qty: 0, revenue: 0, cost: 0, fees: 0, costKnown: true };
    const cost = costOverride == null ? unitCost(id) : costOverride;
    row.qty += Number(qty) || 0; row.revenue += Number(revenue) || 0; row.fees += (Number(revenue) || 0) * (Number(feePct) || 0);
    if (cost == null) row.costKnown = false; else row.cost += (Number(qty) || 0) * cost;
    products.set(id, row);
  };
  for (const sale of store.state.sales) {
    if (store.isReversed('sale', sale.id) || !inPeriod(sale.at, start, end)) continue;
    const gross = (Number(sale.qty) || 0) * (Number(sale.unitPrice) || 0);
    const rates = effectiveSalesRates(store.get('products', sale.productId), config);
    if (isBundleProduct(store.get('products', sale.productId))) basketRevenue += saleNet(sale);
    addProduct(sale.productId, sale.qty, Math.max(0, gross - (Number(sale.discount) || 0)),
      (sale.paymentFeePct ?? rates.paymentFeePct) + (sale.commissionPct ?? rates.commissionPct) + (sale.salesTaxPct ?? 0));
  }
  for (const order of store.state.encomendas) {
    if (order.desistenciaAt || !inPeriod(order.quickSale ? order.at : order.deliveryDate, start, end)) continue;
    const clientId = order.clienteId || '__sem__';
    const client = clients.get(clientId) || { id: clientId, orders: 0, total: 0 };
    client.orders += 1; client.total += Number(order.total) || 0; clients.set(clientId, client);
    const itemGross = (order.itens || []).reduce((sum, item) => sum + orderItemGross(item), 0);
    const discountFactor = itemGross > 0 ? Math.max(0, itemGross - (Number(order.discount) || 0)) / itemGross : 1;
    for (const item of order.itens || []) for (const line of orderItemSaleLines(item)) {
      const rates = effectiveSalesRates(store.get('products', line.productId), config);
      addProduct(line.productId, line.qty, line.total * discountFactor, rates.total);
    }
    for (const item of order.itens || []) if (isBundleProduct(store.get('products', item.productId))) basketRevenue += orderItemGross(item) * discountFactor;
  }
  const productRows = [...products.values()].map((row) => {
    const profit = row.costKnown ? row.revenue - row.cost - row.fees : null;
    return { ...row, profit, marginPct: profit != null && row.revenue > 0 ? profit / row.revenue : null };
  });
  const sold = productRows.filter((p) => p.qty > 0).sort((a, b) => b.qty - a.qty || b.revenue - a.revenue);
  const marginKnown = sold.filter((p) => p.marginPct != null).sort((a, b) => b.marginPct - a.marginPct);
  const baskets = sold.filter((row) => isBundleProduct(store.get('products', row.id)));
  const clientRows = [...clients.values()].map((row) => ({ ...row, name: row.id === '__sem__' ? 'Sem cliente' : (store.get('clients', row.id)?.name || '(cliente removido)') }));
  return {
    start, end,
    mostFrequentClient: clientRows.slice().sort((a, b) => b.orders - a.orders || b.total - a.total)[0] || null,
    highestValueClient: clientRows.slice().sort((a, b) => b.total - a.total || b.orders - a.orders)[0] || null,
    mostSoldProduct: sold[0] || null,
    leastSoldProduct: sold.slice().sort((a, b) => a.qty - b.qty || a.revenue - b.revenue)[0] || null,
    bestMarginProduct: marginKnown[0] || null,
    worstMarginProduct: marginKnown[marginKnown.length - 1] || null,
    baskets,
    basketQty: baskets.reduce((sum, p) => sum + p.qty, 0),
    basketRevenue,
    productsWithoutSales: productRows.filter((p) => p.qty <= 0).length,
    soldProducts: sold,
    clients: clientRows,
  };
}

/**
 * Managerial sales report for an inclusive date period. Orders are sales; legacy walk-up sales are
 * preserved and treated as received on the spot. Delivery and payment are intentionally unrelated.
 * `status`: todos | recebidos | naorecebidos | desistencias.
 */
function salesPeriodSummary(store, start, end, status = 'todos') {
  const cancellations = [];
  for (const e of store.state.encomendas) {
    if (!e.desistenciaAt || !inPeriod(e.desistenciaAt, start, end)) continue;
    cancellations.push({
      kind: 'encomenda', id: e.id, at: e.desistenciaAt, order: e,
      clientId: e.clienteId || '__sem__', total: Number(e.total) || 0,
    });
  }
  for (const s of store.state.sales) {
    if (!store.isReversed('sale', s.id) || !inPeriod(s.at, start, end)) continue;
    cancellations.push({ kind: 'sale', id: s.id, at: s.at, sale: s, clientId: '__sem__', total: Math.max(0, (Number(s.qty) || 0) * (Number(s.unitPrice) || 0) - (Number(s.discount) || 0)) });
  }
  cancellations.sort((a, b) => (a.at < b.at ? 1 : -1));

  if (status === 'desistencias') {
    return {
      start, end, status, rows: [], clients: [], products: [], cancellations,
      totalVendido: 0, totalRecebido: 0, totalPendente: 0,
      totalDesistencias: cancellations.reduce((sum, x) => sum + x.total, 0),
    };
  }

  const rows = [];
  for (const e of store.state.encomendas) {
    if (e.desistenciaAt || !inPeriod(e.quickSale ? e.at : e.deliveryDate, start, end)) continue;
    const total = Number(e.total) || 0;
    const title = store.state.financeTitles.find((t) => t.sourceType === 'encomenda' && t.sourceId === e.id);
    const finance = title ? titleState(store, title) : null;
    const received = Math.min(total, finance ? finance.paid : Math.max(0, store.paidFor(e.id)));
    const discounted = finance?.discounted || 0;
    const pending = finance ? finance.balance : Math.max(0, total - received);
    const paid = pending <= 0.005;
    if (status === 'recebidos' && !paid) continue;
    if (status === 'naorecebidos' && paid) continue;
    rows.push({ kind: 'encomenda', id: e.id, at: e.quickSale ? e.at : e.deliveryDate, order: e, clientId: e.clienteId || '__sem__', total, received, discounted, pending, paid });
  }
  for (const s of store.state.sales) {
    if (store.isReversed('sale', s.id) || !inPeriod(s.at, start, end) || status === 'naorecebidos') continue;
    const total = Math.max(0, (Number(s.qty) || 0) * (Number(s.unitPrice) || 0) - (Number(s.discount) || 0));
    rows.push({ kind: 'sale', id: s.id, at: s.at, sale: s, clientId: '__sem__', total, received: total, pending: 0, paid: true });
  }
  rows.sort((a, b) => (a.at < b.at ? 1 : -1));

  const clients = new Map();
  const products = new Map();
  const addClient = (id, total, received, pending) => {
    const c = clients.get(id) || { id, total: 0, received: 0, pending: 0, orders: 0 };
    c.total += total; c.received += received; c.pending += pending; c.orders += 1; clients.set(id, c);
  };
  const addProduct = (id, qty, total) => {
    const p = products.get(id) || { id, qty: 0, total: 0 };
    p.qty += qty; p.total += total; products.set(id, p);
  };
  for (const row of rows) {
    addClient(row.clientId, row.total, row.received, row.pending);
    if (row.kind === 'encomenda') {
      for (const it of row.order.itens || []) for (const line of orderItemSaleLines(it)) addProduct(line.productId, line.qty, line.total);
    } else addProduct(row.sale.productId, Number(row.sale.qty) || 0, row.total);
  }

  return {
    start, end, status, rows, cancellations,
    totalVendido: rows.reduce((sum, x) => sum + x.total, 0),
    totalRecebido: rows.reduce((sum, x) => sum + x.received, 0),
    totalPendente: rows.reduce((sum, x) => sum + x.pending, 0),
    totalDescontado: rows.reduce((sum, x) => sum + (x.discounted || 0), 0),
    totalDesistencias: cancellations.reduce((sum, x) => sum + x.total, 0),
    clients: [...clients.values()].map((c) => ({ ...c, name: c.id === '__sem__' ? 'Sem cliente' : (store.get('clients', c.id)?.name || '(cliente removido)') })).sort((a, b) => b.total - a.total),
    products: [...products.values()].map((p) => ({ ...p, name: store.get('products', p.id)?.name || '(produto removido)' })).sort((a, b) => b.total - a.total),
  };
}

// ── src/client-statement.js ──
// Detailed client financial statement. It joins operational orders with their append-only
// payments and manual receivables without duplicating the finance title generated for an order.




const statementDate = (iso) => String(iso || '').slice(0, 10);
const statementInPeriod = (iso, start, end) => (!start || statementDate(iso) >= start) && (!end || statementDate(iso) <= end);
const personName = (name) => String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

/**
 * @param {import('./store.js').PaiolStore} store
 * @param {string} clientId
 * @param {string} [start] YYYY-MM-DD; blank means since the first record
 * @param {string} [end] YYYY-MM-DD; blank means through the latest record
 */
function clientFinancialStatement(store, clientId, start = '', end = '') {
  const groupedName = String(clientId || '').startsWith('name:') ? String(clientId).slice(5) : '';
  const originName = String(clientId || '').startsWith('origin:') ? String(clientId).slice(7) : '';
  const matchingClients = groupedName ? store.state.clients.filter((c) => personName(c.name) === groupedName) : [];
  const matchingIds = new Set(originName ? [] : groupedName ? matchingClients.map((c) => c.id) : [clientId]);
  const matchesTitle = (title) => originName
    ? title.partyType === 'origem' && personName(title.partyName) === originName
    : groupedName
    ? title.partyType !== 'origem' && (title.partyId && store.get('clients', title.partyId) ? matchingIds.has(title.partyId) : personName(title.partyName || 'Sem cliente') === groupedName)
    : title.partyId === clientId;
  const namedTitle = (groupedName || originName) && store.state.financeTitles.find((t) => t.direction === 'receber' && matchesTitle(t));
  const client = originName ? { name: namedTitle?.partyName || originName } : groupedName ? (matchingClients[0] || { name: namedTitle?.partyName || groupedName }) : store.get('clients', clientId) || null;
  const allMovements = [];

  for (const order of store.state.encomendas.filter((e) => matchingIds.has(e.clienteId) && !e.desistenciaAt)) {
    const items = (order.itens || []).map((item) => {
      const product = store.get('products', item.productId);
      const qty = Number(item.qty) || 0;
      const total = orderItemGross(item);
      const unitPrice = qty > 0 ? total / qty : 0;
      const composition = bundleCompositionText(store, item);
      return { productId: item.productId, name: `${product?.name || '(produto removido)'}${composition ? ` (${composition})` : ''}`, qty, unitPrice, total };
    });
    const title = store.state.financeTitles.find((t) => t.sourceType === 'encomenda' && t.sourceId === order.id);
    const state = title ? titleState(store, title) : null;
    const paid = state ? state.paid : Math.max(0, store.paidFor(order.id));
    const total = Number(order.total) || 0;
    allMovements.push({
      id: `order:${order.id}`, type: 'purchase', at: order.quickSale ? order.at : order.deliveryDate || order.at,
      orderId: order.id, clientId: order.clienteId, description: order.quickSale ? 'Venda rápida' : 'Compra / encomenda', amount: total, items,
      paid: Math.min(total, paid), discounted: state?.discounted || 0, credited: state?.credited || 0, writtenOff: state?.writtenOff || 0, balance: state ? state.balance : Math.max(0, total - paid), titleId: title?.id,
      deliveryMethod: order.deliveryMethod || 'retirada', freight: Number(order.frete) || 0, discount: Number(order.discount) || 0, notes: order.notes,
    });
    for (const payment of store.state.payments.filter((p) => p.encomendaId === order.id && !store.isReversed('payment', p.id))) {
      allMovements.push({
        id: `payment:${payment.id}`, type: 'payment', at: payment.at, orderId: order.id,
        description: `Pagamento da compra de ${statementDate(order.deliveryDate || order.at)}`,
        amount: Number(payment.valor) || 0, method: payment.forma,
      });
    }
    for (const settlement of title ? titleSettlements(store, title).filter((row) => ['discount', 'credit', 'loss'].includes(row.kind)) : []) {
      allMovements.push({ id: `${settlement.kind}:${settlement.id}`, type: settlement.kind === 'credit' ? 'credit-application' : settlement.kind === 'loss' ? 'loss' : 'discount', at: settlement.at, orderId: order.id, description: settlement.kind === 'credit' ? 'Crédito aplicado na encomenda' : settlement.kind === 'loss' ? 'Fatura registrada como perda' : 'Desconto concedido na quitação', amount: Number(settlement.amount) || 0 });
    }
  }

  // Manually entered receivables belong in the financial statement too. The finance title whose
  // source is an order is deliberately excluded because that order and its payments are above.
  for (const title of store.state.financeTitles.filter((t) => t.direction === 'receber' && matchesTitle(t) && (groupedName || t.sourceType !== 'encomenda') && !t.cancelledAt && !(groupedName && t.sourceType === 'encomenda' && store.state.encomendas.some((e) => e.id === t.sourceId && matchingIds.has(e.clienteId) && !e.desistenciaAt)))) {
    const amount = Number(title.amount) || 0;
    const settlements = titleSettlements(store, title);
    const state = titleState(store, title);
    const paid = state.paid;
    const discounted = state.discounted;
    allMovements.push({
      id: `title:${title.id}`, type: 'charge', at: title.issuedAt || title.competenceDate || title.dueDate,
      titleId: title.id, description: title.description || 'Valor a receber', amount,
      paid: Math.min(amount, paid), discounted, credited: state.credited, writtenOff: state.writtenOff, balance: state.balance, dueDate: title.dueDate,
    });
    for (const settlement of settlements) {
      if (settlement.kind === 'client-payment-allocation') continue;
      allMovements.push({
        id: `settlement:${settlement.id}`, type: settlement.kind === 'discount' ? 'discount' : settlement.kind === 'credit' ? 'credit-application' : settlement.kind === 'loss' ? 'loss' : 'payment', at: settlement.at, titleId: title.id,
        description: settlement.kind === 'discount' ? 'Desconto concedido na quitação' : settlement.kind === 'credit' ? 'Crédito aplicado no valor a receber' : settlement.kind === 'loss' ? 'Fatura registrada como perda' : `Pagamento de ${title.description || 'valor a receber'}`,
        amount: Number(settlement.amount) || 0, method: settlement.method,
      });
    }
  }

  for (const entry of store.state.cashAdjustments.filter((a) => ['client-credit', 'client-payment'].includes(a.kind) && matchingIds.has(a.clientId) && !store.isReversed('cashAdjustment', a.id))) {
    allMovements.push({ id: `${entry.kind}:${entry.id}`, type: 'payment', at: entry.at, description: entry.description || (entry.kind === 'client-payment' ? 'Pagamento total do cliente' : 'Pagamento recebido como crédito'), amount: Number(entry.amount) || 0, method: entry.method });
  }

  allMovements.sort((a, b) => String(a.at).localeCompare(String(b.at)) || (a.type === 'payment' ? 1 : -1));
  const movements = allMovements.filter((row) => statementInPeriod(row.at, start, end));
  const charges = (rows) => rows.filter((row) => ['purchase', 'charge'].includes(row.type)).reduce((sum, row) => sum + row.amount, 0);
  const payments = (rows) => rows.filter((row) => row.type === 'payment').reduce((sum, row) => sum + row.amount, 0);
  const discounts = (rows) => rows.filter((row) => row.type === 'discount').reduce((sum, row) => sum + row.amount, 0);
  const losses = (rows) => rows.filter((row) => row.type === 'loss').reduce((sum, row) => sum + row.amount, 0);
  const totalCharged = charges(allMovements);
  const totalPaid = payments(allMovements);

  return {
    client, clientId, isOrigin: Boolean(originName), start, end, movements,
    periodPurchases: charges(movements),
    periodPayments: payments(movements),
    periodDiscounts: discounts(movements),
    periodLosses: losses(movements),
    periodBalance: charges(movements) - payments(movements) - discounts(movements) - losses(movements),
    totalCharged, totalPaid, totalDiscounted: discounts(allMovements), totalWrittenOff: losses(allMovements),
    currentBalance: store.state.financeTitles.filter((t) => t.direction === 'receber' && matchesTitle(t) && !t.cancelledAt).reduce((sum, t) => sum + titleState(store, t).balance, 0)
      + allMovements.filter((row) => row.type === 'purchase' && !store.state.financeTitles.some((t) => t.sourceType === 'encomenda' && t.sourceId === row.orderId)).reduce((sum, row) => sum + row.balance, 0),
    creditBalance: [...matchingIds].reduce((sum, id) => sum + (store.get('clients', id) ? clientCreditBalance(store, id) : 0), 0),
  };
}

// A later request for the same registered client and delivery day extends the open order.
// Keep its id so payments, the receivable and the client's history stay attached.
const orderDay = (value) => String(value || '').slice(0, 10);
const amount = (value) => Number(value) || 0;

function findOpenOrderForClientDate(store, clientId, deliveryDate) {
  if (!clientId || !orderDay(deliveryDate)) return null;
  return store.state.encomendas
    .filter((order) => order.clienteId === clientId && orderDay(order.deliveryDate) === orderDay(deliveryDate) && !order.desistenciaAt && !order.entregue)
    .sort((a, b) => String(a.at || '').localeCompare(String(b.at || '')))[0] || null;
}

function addOrAppendOrder(store, newOrder) {
  const existing = findOpenOrderForClientDate(store, newOrder.clienteId, newOrder.deliveryDate);
  if (!existing) { store.upsertEncomenda(newOrder); return { order: newOrder, appended: false }; }
  const combined = {
    ...existing,
    itens: [...(existing.itens || []), ...(newOrder.itens || [])],
    total: amount(existing.total) + amount(newOrder.total),
    costSnapshot: amount(existing.costSnapshot) + amount(newOrder.costSnapshot),
    materialCostSnapshot: existing.materialCostSnapshot == null || newOrder.materialCostSnapshot == null ? undefined : amount(existing.materialCostSnapshot) + amount(newOrder.materialCostSnapshot),
    packagingCostSnapshot: existing.packagingCostSnapshot == null || newOrder.packagingCostSnapshot == null ? undefined : amount(existing.packagingCostSnapshot) + amount(newOrder.packagingCostSnapshot),
    frete: amount(existing.frete) + amount(newOrder.frete) || undefined,
    discount: amount(existing.discount) + amount(newOrder.discount) || undefined,
    notes: [existing.notes, newOrder.notes].filter(Boolean).join('\n') || undefined,
    urgente: existing.urgente || newOrder.urgente || undefined,
  };
  store.upsertEncomenda(combined);
  return { order: combined, appended: true };
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'value') node.value = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}

function parseNum(s) {

  if (str === '') return null;

}
