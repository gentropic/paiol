<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3d526f" />
  <title>Quitutes do Paiol</title>

  <!-- PWA: installable, offline-capable (the service worker is registered from app.js). -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Paiol" />
  <style>
    /* Phone-first; warm confeitaria palette. Tokens mirror the GCU --au-* roles loosely so we
       can swap in @gcu/switchboard later without touching markup. */
    :root {
      --au-bg: #fbf6f0;
      --au-surface: #ffffff;
      --au-fg: #2a211c;
      --au-fg-soft: #6b5d54;
      --au-border: #ece0d5;
      --au-action: #9a4a2f;     /* terracotta */
      --au-action-fg: #ffffff;
      --au-ok: #2f7d4f;
      --au-radius: 12px;
      --au-shadow: 0 1px 3px rgba(60, 40, 30, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--au-bg); color: var(--au-fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(72px + env(safe-area-inset-bottom)); }

    .pa-header { padding: 8px 4px 16px; display: flex; align-items: flex-start; gap: 8px; }
    .pa-header h1 { margin: 0; font-size: 1.5rem; color: var(--au-action); display: flex; align-items: baseline; gap: 7px; }
    .pa-beta { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--au-action);
      background: #f6e9e1; border: 1px solid #e6c3b3; border-radius: 999px; padding: 1px 7px; align-self: center; }
    .pa-sub { margin: 2px 0 0; color: var(--au-fg-soft); font-size: 0.9rem; }
    .pa-help-btn { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--au-border);
      background: var(--au-surface); color: var(--au-action); font-size: 1.15rem; font-weight: 700; cursor: pointer;
      box-shadow: var(--au-shadow); line-height: 1; }
    .pa-help-btn:active { transform: translateY(1px); }
    .pa-help-area { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .pa-version { color: var(--au-fg-soft); font-size: .58rem; font-weight: 700; letter-spacing: .02em; line-height: 1; }
    /* Help sheet content */
    .pa-help-det { border-bottom: 1px solid var(--au-border); padding: 6px 0; }
    .pa-help-det > summary { cursor: pointer; font-weight: 600; padding: 6px 2px; list-style: none;
      display: flex; align-items: center; gap: 8px; }
    .pa-help-det > summary::-webkit-details-marker { display: none; }
    .pa-help-det > summary::after { content: '›'; margin-left: auto; color: var(--au-fg-soft); font-size: 1.2rem; transition: transform 0.15s; }
    .pa-help-det[open] > summary::after { transform: rotate(90deg); }
    .pa-help-det .pa-badge { margin-left: 0; }
    .pa-help-p { margin: 4px 2px 8px; color: var(--au-fg-soft); font-size: 0.92rem; }
    /* "New version available" banner (PWA update) */
    .pa-update { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 10px 12px;
      background: #f6e9e1; border: 1px solid var(--au-action); border-radius: 10px; font-size: 0.92rem; color: var(--au-fg); }
    .pa-update .pa-btn { background: var(--au-action); color: var(--au-action-fg); border-color: var(--au-action); }

    .pa-card { background: var(--au-surface); border: 1px solid var(--au-border);
      border-radius: var(--au-radius); box-shadow: var(--au-shadow); padding: 16px; margin: 0 0 16px; }
    .pa-card h2 { margin: 0 0 12px; font-size: 1.15rem; }

    .pa-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pa-row + .pa-row { margin-top: 10px; }
    .pa-form { margin-top: 14px; }

    .pa-badge { font-size: 0.78rem; padding: 2px 8px; border-radius: 999px;
      background: var(--au-border); color: var(--au-fg-soft); margin-left: auto; }
    .pa-badge.pa-ok { background: #e3f2e8; color: var(--au-ok); }

    .pa-btn { font: inherit; font-size: 0.95rem; padding: 9px 14px; border-radius: 10px;
      border: 1px solid var(--au-border); background: var(--au-surface); color: var(--au-fg); cursor: pointer; }
    .pa-btn:active { transform: translateY(1px); }
    .pa-btn[disabled] { opacity: 0.55; cursor: default; }
    .pa-primary { background: var(--au-action); color: var(--au-action-fg); border-color: var(--au-action); }
    .pa-ghost { background: transparent; border-color: transparent; color: var(--au-fg-soft); }
    .pa-sm { padding: 4px 8px; font-size: 0.85rem; }

    .pa-input { font: inherit; padding: 9px 11px; border: 1px solid var(--au-border);
      border-radius: 10px; background: var(--au-surface); color: var(--au-fg); flex: 1 1 auto; min-width: 0; }
    select.pa-input { flex: 0 0 auto; }

    .pa-list { list-style: none; margin: 0; padding: 0; }
    .pa-list-item { display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 10px 4px; border-bottom: 1px solid var(--au-border);
      content-visibility: auto; contain-intrinsic-size: auto 44px; }
    .pa-list-item:last-child { border-bottom: none; }
    .pa-category-code { flex: 0 0 2.5rem; }
    .pa-category-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .pa-category-info strong { overflow-wrap: anywhere; }
    .pa-category-info .pa-muted { font-size: .78rem; }
    .pa-empty { color: var(--au-fg-soft); font-style: italic; margin: 4px 0; }
    /* Reversed (estornado) log entry */
    .pa-reversed { opacity: 0.55; }
    .pa-reversed strong, .pa-reversed .pa-num { text-decoration: line-through; }
    /* Date header inside an operação log (Fornadas/Vendas) */
    .pa-daygroup { list-style: none; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--au-fg-soft); padding: 12px 4px 2px; }
    .pa-daygroup:first-child { padding-top: 2px; }
    /* Search + month scope row on the operação logs */
    .pa-row.pa-logfilters { margin: 0 0 10px; flex-wrap: nowrap; }
    .pa-logfilters .pa-search { width: auto; margin: 0; flex: 1 1 auto; }
    .pa-logfilters input[type="month"] { flex: 0 0 auto; }
    .pa-status { margin: 10px 0 0; font-size: 0.88rem; color: var(--au-fg-soft); }

    /* Bottom tab bar (iOS-native) */
    .pa-bottomnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%;
      max-width: 640px; display: flex; background: var(--au-surface); border-top: 1px solid var(--au-border);
      box-shadow: 0 -1px 6px rgba(60, 40, 30, 0.06); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
    .pa-navbtn { position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 2px 5px; border: none; background: none; color: var(--au-fg-soft); cursor: pointer; font: inherit; }
    .pa-navbtn.active { color: var(--au-action); background: #f6e9e1; }
    .pa-navbtn.active::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 36px; height: 3px; border-radius: 0 0 3px 3px; background: var(--au-action); }
    .pa-navico { font-size: 1.25rem; line-height: 1; }
    .pa-navlbl { font-size: 0.66rem; letter-spacing: 0.01em; }
    .pa-navbtn.active .pa-navlbl { font-weight: 700; }

    /* Segmented sub-nav (within a section) */
    .pa-seg { display: flex; gap: 6px; margin: 0 0 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .pa-segbtn { flex: 0 0 auto; font: inherit; font-size: 0.9rem; padding: 6px 14px; border: 1px solid var(--au-border);
      border-radius: 999px; background: var(--au-surface); color: var(--au-fg-soft); cursor: pointer; }
    .pa-segbtn.active { background: var(--au-action); color: var(--au-action-fg); border-color: var(--au-action); font-weight: 600; }

    /* Misc layout */
    .pa-grow { flex: 1 1 auto; min-width: 0; }
    .pa-muted { color: var(--au-fg-soft); font-size: 0.86rem; }
    .pa-narrow { flex: 0 0 auto; width: 7.5em; }
    input[type="date"].pa-narrow { width: 9.5em; }  /* native date control needs more room — pa-narrow clips the year */
    .pa-hint { color: var(--au-fg-soft); font-size: 0.8rem; margin: 8px 0 0; }
    .pa-h3 { font-size: 1rem; margin: 18px 0 8px; color: var(--au-fg-soft); }
    .pa-lab { color: var(--au-fg-soft); font-size: 0.88rem; }
    .pa-form { flex-wrap: wrap; }

    .pa-sub-card { border: 1px solid var(--au-border); border-radius: 10px; padding: 12px; margin: 0 0 10px; background: #fffdfb;
      content-visibility: auto; contain-intrinsic-size: auto 200px; }
    .pa-list.pa-tight .pa-list-item { padding: 6px 2px; }

    .pa-field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; }
    .pa-field label { font-size: 0.88rem; color: var(--au-fg-soft); }
    .pa-field .pa-input { width: 100%; }

    /* Price breakdown */
    .pa-price { font-size: 1.2rem; font-weight: 700; color: var(--au-action); }
    .pa-kv { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.92rem; }
    .pa-kv td { padding: 4px 0; border-bottom: 1px solid var(--au-border); color: var(--au-fg-soft); }
    .pa-kv td.pa-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--au-fg); }
    .pa-kv-total td { font-weight: 600; color: var(--au-fg); }
    .pa-kv tr:last-child td { border-bottom: none; }
    .pa-kv-sec td { padding-top: 10px; color: var(--au-action); font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: none; }
    .pa-h3row { align-items: baseline; gap: 6px; }
    .pa-chip { flex: 0 0 auto; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--au-border); background: #fff; color: var(--au-fg-soft); font-size: 0.78rem; }
    .pa-chip-on { background: var(--au-action); color: #fff; border-color: var(--au-action); }
    .pa-fichas { margin-top: 16px; border-top: 1px solid var(--au-border); padding-top: 6px; }
    .pa-fichas .pa-row { flex-wrap: wrap; gap: 8px; }
    .pa-logo-preview { display: flex; align-items: center; min-height: 56px; padding: 6px 0; }
    .pa-logo-img { max-height: 64px; max-width: 70%; object-fit: contain; }
    /* Rev 07: encomendas hub — filters, urgente, entregue */
    .pa-chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .pa-cli-chip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--au-border); border-radius: 10px; background: #fff; }
    .pa-enc-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .pa-enc-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .pa-badge.pa-urg { background: #f6d9c9; color: #9a3a1f; font-weight: 700; }
    .pa-urgente { border-left: 3px solid var(--au-action); }
    .pa-row-done { opacity: 0.72; }
    .pa-urg-btn { font-size: 1.05rem; line-height: 1; padding: 4px 8px; }
    .pa-ent { flex: 0 0 auto; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--au-border); background: #fff; color: var(--au-fg-soft); font-size: 0.8rem; }
    .pa-ent-on { background: #2e7330; border-color: #2e7330; color: #fff; }
    .pa-pag-cli { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--au-bg); border-radius: 10px; margin-bottom: 4px; }
    .pa-pag-cli strong { font-size: 1.15rem; color: var(--au-action); }
    .pa-ficha-prev { display: flex; flex-direction: column; gap: 8px; }
    .pa-ficha-card { border: 1px solid var(--au-border); border-radius: 10px; padding: 9px 11px; background: #fff; }
    .pa-num.pa-strong { color: var(--au-action); font-weight: 700; }

    .pa-totals { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--au-border); }
    .pa-bad { color: #b3261e; }
    .pa-badge.pa-bad { background: #fbe3e1; color: #b3261e; }
    .pa-badge.pa-warn { background: #f6e6c9; color: #9a6b2f; }

    /* Encomenda line item (qty · name+linetotal · R$ unit · remove) + product search-to-add */
    .pa-encitem { gap: 6px; }
    .pa-encitem .pa-qty { width: 44px; flex: 0 0 auto; text-align: center; padding: 7px 4px; }
    .pa-encitem .pa-unit { width: 76px; flex: 0 0 auto; padding: 7px 6px; }
    .pa-encitem .pa-grow { min-width: 0; }
    .pa-encitem .pa-grow > div:first-child { overflow: hidden; text-overflow: ellipsis; }
    .pa-bundle-editor { margin-top: 9px; padding: 10px; border: 1px dashed var(--pa-gold); border-radius: 12px; background: color-mix(in srgb, var(--pa-gold) 7%, white); }
    .pa-bundle-editor .pa-list-item { padding: 7px 0; }
    .pa-bundle-total { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--au-border); }
    .pa-bundle-total .pa-num { color: var(--au-action); white-space: nowrap; }
    .pa-linetot { font-size: 0.8rem; }
    .pa-suggest { background: #fffdfb; border: 1px solid var(--au-border); border-radius: 10px; margin: 6px 0 0; }
    .pa-suggest .pa-row-item { padding: 9px 11px; }
    .pa-add { color: var(--au-action); font-size: 1.35rem; font-weight: 700; line-height: 1; flex: 0 0 auto; }
    .pa-check { display: flex; align-items: center; gap: 8px; margin: 8px 2px; }
    .pa-check input { width: 20px; height: 20px; }

    /* Rev 04: comanda do dia (production table) */
    .pa-comanda { width: 100%; border-collapse: collapse; margin: 6px 0 4px; }
    .pa-comanda th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
      color: var(--au-fg-soft); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--au-border); }
    .pa-comanda th.pa-num { text-align: right; } .pa-comanda th.pa-center { text-align: center; }
    .pa-comanda td { padding: 7px 6px; border-bottom: 1px solid var(--au-border); vertical-align: middle; }
    .pa-comanda td.pa-center { text-align: center; }
    .pa-comanda td.pa-prev { color: var(--au-fg-soft); white-space: nowrap; }
    .pa-comanda .pa-qty { width: 56px; text-align: center; padding: 6px 4px; }
    .pa-comanda input[type=checkbox] { width: 22px; height: 22px; }
    .pa-comanda tr.pa-done td:first-child div:first-child { color: var(--au-fg-soft); }
    .pa-exced { display: block; font-size: 0.74rem; color: var(--au-fg-soft); }
    .pa-comanda-ind { margin-top: 10px; }
    /* Rev 07: comanda as a card per product (full labels, aligned fields) */
    .pa-cmd-list { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 4px; }
    .pa-cmd-item { border: 1px solid var(--au-border); border-radius: 12px; padding: 10px 12px; background: #fff; }
    .pa-cmd-item.pa-done { background: #f6faf4; }
    .pa-cmd-head { display: flex; align-items: center; gap: 8px; }
    .pa-cmd-fields { display: flex; flex-wrap: wrap; gap: 10px 14px; margin: 8px 0 2px; }
    .pa-cmd-field { display: flex; flex-direction: column; gap: 3px; }
    .pa-cmd-field > span { font-size: 0.7rem; color: var(--au-fg-soft); }
    .pa-cmd-field .pa-qty { width: 92px; text-align: center; }
    .pa-cmd-feito { display: flex; align-items: center; gap: 6px; align-self: flex-end; padding-bottom: 7px; }
    .pa-cmd-feito input { width: 22px; height: 22px; }

    /* Lote 1: search, edit, history, observação */
    .pa-search { width: 100%; margin: 0 0 10px; }
    .pa-list-item.pa-stack { display: block; }
    .pa-editing { background: #fffaf3; border: 1px solid var(--au-action); }
    .pa-cardfoot { margin-top: 10px; justify-content: flex-end; }
    .pa-history { margin: 4px 0 0; }
    .pa-history summary { cursor: pointer; color: var(--au-fg-soft); font-size: 0.8rem; }
    .pa-history .pa-list-item { padding: 3px 0; }
    .pa-obs { white-space: pre-wrap; font-size: 0.88rem; color: var(--au-fg-soft); font-style: italic;
      margin: 2px 0 8px; padding-left: 8px; border-left: 2px solid var(--au-border); }
    textarea.pa-textarea { width: 100%; resize: vertical; font: inherit; min-height: 60px; }

    /* Cadastro lists: header with add button, clean tappable rows */
    .pa-cardhead { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; }
    .pa-rows { margin: 0; }
    .pa-row-item { display: flex; align-items: center; gap: 8px; padding: 12px 4px; border-bottom: 1px solid var(--au-border); cursor: pointer;
      content-visibility: auto; contain-intrinsic-size: auto 64px; }
    .pa-row-item:last-child { border-bottom: none; }
    .pa-row-item:active { background: #faf3ec; }
    .pa-row-item .pa-muted { font-size: 0.85rem; }
    .pa-chev { color: var(--au-fg-soft); font-size: 1.4rem; line-height: 1; flex: 0 0 auto; }
    /* Tags (etiquetas) */
    .pa-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .pa-tag { font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; background: #f0e3d8; color: var(--au-action); }
    /* "Tap to edit" discoverability hint */
    .pa-tap { margin: 0 0 8px; font-style: italic; }

    /* Currency input */
    .pa-money { display: flex; align-items: stretch; border: 1px solid var(--au-border); border-radius: 10px;
      background: var(--au-surface); overflow: hidden; }
    .pa-money:focus-within { border-color: var(--au-action); }
    .pa-money-pfx { display: flex; align-items: center; padding: 0 10px; background: #f6efe8; color: var(--au-fg-soft); font-size: 0.95rem; }
    .pa-money-input { flex: 1; min-width: 0; border: none; background: none; font: inherit; padding: 9px 11px; color: var(--au-fg); }
    .pa-money-input:focus { outline: none; }

    /* Bottom sheet / modal */
    .pa-backdrop { position: fixed; inset: 0; background: rgba(40, 26, 18, 0.45); z-index: 100;
      display: flex; align-items: flex-end; justify-content: center; }
    .pa-sheet { width: 100%; max-width: 640px; background: var(--au-surface); border-radius: 18px 18px 0 0;
      padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
      box-shadow: 0 -4px 24px rgba(40, 26, 18, 0.18); animation: pa-sheet-up 0.18s ease-out; }
    @keyframes pa-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .pa-sheet-grab { width: 40px; height: 4px; border-radius: 999px; background: var(--au-border); margin: 4px auto 10px; }
    .pa-sheet-title { margin: 0 0 14px; font-size: 1.2rem; }
    .pa-sheet-msg { color: var(--au-fg-soft); margin: 0 0 18px; }
    .pa-sheet-body .pa-field:last-child { margin-bottom: 6px; }
    .pa-sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
    .pa-sheet-danger { width: 100%; margin-top: 14px; }
    .pa-danger-btn { background: #b3261e; color: #fff; border-color: #b3261e; }

    /* Simulador (what-if) */
    .pa-sim td:nth-child(2), .pa-sim td:nth-child(3) { width: 28%; }
    .pa-sim .pa-sim-head td { color: var(--au-fg-soft); font-size: 0.82rem; border-bottom: 1px solid var(--au-border); }
    .pa-sim .pa-strong { color: var(--au-action); }
    .pa-sim-explain { display: block; font-size: 0.78rem; line-height: 1.25; font-weight: 400; color: var(--au-fg-soft); }

    /* Lote 2: Relatórios */
    .pa-chart { display: block; width: 100%; height: auto; margin: 6px 0 10px; }
    .pa-dashboard-chartgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 14px 0 18px; }
    @media (max-width: 720px) { .pa-dashboard-chartgrid { grid-template-columns: 1fr; } }
    .pa-report td:first-child { color: var(--au-fg); }
    .pa-report td.pa-num { font-variant-numeric: tabular-nums; }

    /* 2026 brand refresh — clearer hierarchy, roomier controls and the Paiol color system. */
    :root {
      --pa-navy: #3d526f;
      --pa-teal: #0f7881;
      --pa-olive: #687456;
      --pa-gold: #c58b32;
      --pa-terra: #a94f31;
      --pa-wine: #853f50;
      --au-bg: #f4f3ef;
      --au-surface: #ffffff;
      --au-fg: #24313f;
      --au-fg-soft: #68717a;
      --au-border: #dfe3e4;
      --au-action: var(--pa-navy);
      --au-action-fg: #ffffff;
      --au-ok: #347160;
      --au-radius: 18px;
      --au-shadow: 0 10px 30px rgba(39, 58, 75, 0.08);
    }
    html, body { background: var(--au-bg); color: var(--au-fg); font-family: "Segoe UI", Inter, system-ui, sans-serif; }
    body { min-height: 100vh; }
    #app { max-width: none; padding: 0 14px calc(84px + env(safe-area-inset-bottom)); }
    .pa-main { width: 100%; max-width: 920px; margin: 0 auto; }

    .pa-header { position: relative; margin: 0 -14px 18px; padding: 20px 18px 15px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--au-border); align-items: center; }

      const dstChild = dst === '/' ? '/' + name : dst + '/' + name;
      const info = await this.stat(srcChild);
      if (info.type === 'directory') {
        await this._cpRecursive(srcChild, dstChild);
      } else {
        const content = await this.readFile(srcChild, info._binary ? 'bytes' : 'utf8');
        await this.writeFile(dstChild, content);
      }
    }
  }

  async touch(p) {
    try {
      const info = await this.stat(p);
      if (info.type === 'file') {
        // Update mtime — re-read and re-write
        const content = await this.readFile(p, 'bytes');
        await this.writeFile(p, content);
      }
    } catch (e) {
      if (e.code === 'ENOENT') {
        await this.writeFile(p, '');
      } else throw e;
    }
  }

  async lstat(p) {
    return this.stat(p);
  }

  async export(basePath) {
    const result = {};
    const _walk = async (dir, prefix) => {
      const entries = await this.readdir(dir);
      for (const name of entries) {
        const full = dir === '/' ? '/' + name : dir + '/' + name;
        const rel = prefix ? prefix + '/' + name : name;
        const info = await this.stat(full);
        if (info.type === 'directory') {
          await _walk(full, rel);
        } else {
          const content = await this.readFile(full);
          result[rel] = content;
        }
      }
    };
    await _walk(basePath, '');
    return result;
  }

  async import(basePath, data) {
    // Collect and sort paths so directories come first
    const paths = Object.keys(data).sort();
    const createdDirs = new Set();
    for (const rel of paths) {
      const full = basePath === '/' ? '/' + rel : basePath + '/' + rel;
      // Ensure parent directories exist
      const parts = rel.split('/');
      for (let i = 1; i < parts.length; i++) {
        const dir = basePath === '/'
          ? '/' + parts.slice(0, i).join('/')
          : basePath + '/' + parts.slice(0, i).join('/');
        if (!createdDirs.has(dir)) {
          try { await this.mkdir(dir); } catch (e) { if (e.code !== 'EEXIST') throw e; }
          createdDirs.add(dir);
        }
      }
      await this.writeFile(full, data[rel]);
    }
  }

  createReadStream() { return null; }
  createWriter() { return null; }

  // Worker-replication: return a structured-cloneable config that a worker
  // can pass back to the constructor (alongside the type string from
  // BACKEND_TYPES) to instantiate a peer backend that talks to the same
  // underlying storage. Return null (the default) to indicate this backend
  // CANNOT be replicated in a worker — @gcu/proc will fall back to RPC.
  //
  // Backends that override should restrict themselves to JSON-cloneable
  // config (no closures, no DOM handles, no callbacks). E.g. IDBBackend
  // returns { type: 'idb', name }; MemoryBackend / CommentBackend /
  // FSAABackend / AbusBackend all keep the null default because their state
  // either lives on the main thread (Memory) or requires DOM (Comment) or
  // requires a single permission-bound handle (FSAA) or is broker-bound
  // (Abus). FetchBackend / RESTBackend override only when their headers
  // config is a plain object — function-typed headers are non-serializable.
  toConfig() { return null; }

  get readonly() { return false; }
  get persistent() { return false; }
  get streamable() { return false; }
  get estimatable() { return false; }
  get exportable() { return true; }
  get portable() { return false; }
  get symlinks() { return false; }
}

// -- memory.js --

const MAX_SYMLINK_DEPTH = 40;

function _makeNode(type, content) {
  const now = new Date();
  const node = {
    _meta: {
      type,
      size: 0,
      created: now,
      modified: now,
      mode: type === 'directory' ? 0o755 : 0o644,
      owner: 'user',
      group: 'staff',
    },
  };
  if (type === 'directory') {
    node._children = new Map();
  } else if (type === 'file') {
    node._content = content !== undefined ? content : '';
    node._meta.size = typeof node._content === 'string'
      ? new TextEncoder().encode(node._content).byteLength
      : node._content.byteLength;
  } else if (type === 'symlink') {
    node._target = content || '';
  }
  return node;
}

class MemoryBackend extends Backend {
  static type = 'memory';

  constructor() {
    super();
    this._root = _makeNode('directory');
  }

  _segments(p) {
    const n = path.normalize(p);
    if (n === '/') return [];
    return n.split('/').filter(Boolean);
  }

  _resolve(p, followSymlinks = true) {
    const segs = this._segments(p);
    let node = this._root;
    let depth = 0;

    for (let i = 0; i < segs.length; i++) {
      // Follow symlink if current node is a symlink
      if (followSymlinks && node._meta.type === 'symlink') {
        const target = node._target;
        node = this._resolve(target, true);
        depth++;
        if (depth > MAX_SYMLINK_DEPTH) throw vfsError('ENOENT', p, 'too many symlinks');
      }

      if (node._meta.type !== 'directory') {
        throw vfsError('ENOTDIR', p);
      }

      const child = node._children.get(segs[i]);
      if (!child) throw vfsError('ENOENT', p);
      node = child;
    }

    // Follow final symlink
    if (followSymlinks && node._meta.type === 'symlink') {
      depth++;
      if (depth > MAX_SYMLINK_DEPTH) throw vfsError('ENOENT', p, 'too many symlinks');
      node = this._resolve(node._target, true);
    }

    return node;
  }

  _resolveParent(p) {
    const segs = this._segments(p);
    if (segs.length === 0) throw vfsError('EEXIST', '/');
    const name = segs.pop();
    let node = this._root;
    for (const seg of segs) {
      if (node._meta.type === 'symlink') {
        node = this._resolve(node._target, true);
      }
      if (node._meta.type !== 'directory') throw vfsError('ENOTDIR', p);
      const child = node._children.get(seg);
      if (!child) throw vfsError('ENOENT', p);
      node = child;
    }
    if (node._meta.type === 'symlink') {
      node = this._resolve(node._target, true);
    }
    if (node._meta.type !== 'directory') throw vfsError('ENOTDIR', p);
    return [node, name];
  }

  async readFile(p, encoding) {
    const node = this._resolve(p);
    if (node._meta.type === 'directory') throw vfsError('EISDIR', p);
    if (node._meta.type === 'symlink') throw vfsError('ENOENT', p);
    const content = node._content;
    if (encoding === 'bytes') {
      if (content instanceof Uint8Array) return new Uint8Array(content);
      return new TextEncoder().encode(content);
    }
    if (content instanceof Uint8Array) return new TextDecoder().decode(content);
    return content;
  }

  async writeFile(p, content) {
    const [parent, name] = this._resolveParent(p);
    const existing = parent._children.get(name);
    if (existing && existing._meta.type === 'directory') throw vfsError('EISDIR', p);

    const node = existing || _makeNode('file');
    node._content = content;
    node._meta.type = 'file';
    node._meta.modified = new Date();
    node._meta.size = typeof content === 'string'
      ? new TextEncoder().encode(content).byteLength
      : (content instanceof Uint8Array ? content.byteLength : 0);
    if (!existing) {
      node._meta.created = new Date();
    }
    parent._children.set(name, node);
  }

  async unlink(p) {
    const [parent, name] = this._resolveParent(p);
    const child = parent._children.get(name);
    if (!child) throw vfsError('ENOENT', p);
    if (child._meta.type === 'directory') throw vfsError('EISDIR', p);
    parent._children.delete(name);
  }

  async rename(oldP, newP) {
    const [oldParent, oldName] = this._resolveParent(oldP);
    const child = oldParent._children.get(oldName);
    if (!child) throw vfsError('ENOENT', oldP);

    const [newParent, newName] = this._resolveParent(newP);
    const existingNew = newParent._children.get(newName);

    // Can't overwrite a non-empty directory
    if (existingNew && existingNew._meta.type === 'directory' && existingNew._children.size > 0) {
      throw vfsError('ENOTEMPTY', newP);
    }
    // Can't overwrite a directory with a file
    if (existingNew && existingNew._meta.type === 'directory' && child._meta.type !== 'directory') {
      throw vfsError('EISDIR', newP);
    }

    oldParent._children.delete(oldName);
    child._meta.modified = new Date();
    newParent._children.set(newName, child);
  }

  async stat(p) {
    const node = this._resolve(p);
    const m = node._meta;
    return {
      type: m.type,
      size: m.size,
      created: m.created,
      modified: m.modified,
      mode: m.mode,
      owner: m.owner,
      group: m.group,
    };
  }

  async lstat(p) {
    const node = this._resolve(p, false);
    const m = node._meta;
    const result = {
      type: m.type,
      size: m.size,
      created: m.created,
      modified: m.modified,
      mode: m.mode,
      owner: m.owner,
      group: m.group,
    };
    if (m.type === 'symlink') result.target = node._target;
    return result;
  }

  async mkdir(p, opts) {
    if (opts && opts.recursive) return this._mkdirRecursive(p);
    const [parent, name] = this._resolveParent(p);
    if (parent._children.has(name)) throw vfsError('EEXIST', p);
    parent._children.set(name, _makeNode('directory'));
  }

  async _mkdirRecursive(p) {
    const segs = this._segments(p);
    let node = this._root;
    for (const seg of segs) {
      if (node._meta.type !== 'directory') throw vfsError('ENOTDIR', p);
      if (!node._children.has(seg)) {
        node._children.set(seg, _makeNode('directory'));
      }
      node = node._children.get(seg);
    }
  }

  async readdir(p) {
    const node = this._resolve(p);
    if (node._meta.type !== 'directory') throw vfsError('ENOTDIR', p);
    return [...node._children.keys()].sort();
  }

  async rmdir(p) {
    const [parent, name] = this._resolveParent(p);
    const child = parent._children.get(name);
    if (!child) throw vfsError('ENOENT', p);
    if (child._meta.type !== 'directory') throw vfsError('ENOTDIR', p);
    if (child._children.size > 0) throw vfsError('ENOTEMPTY', p);
    parent._children.delete(name);
  }

  async symlink(target, p) {
    const [parent, name] = this._resolveParent(p);
    if (parent._children.has(name)) throw vfsError('EEXIST', p);
    const node = _makeNode('symlink', target);
    parent._children.set(name, node);
  }

  async readlink(p) {
    const node = this._resolve(p, false);
    if (node._meta.type !== 'symlink') throw vfsError('ENOENT', p, 'not a symlink');
    return node._target;
  }

  async chmod(p, mode) {
    const node = this._resolve(p);
    node._meta.mode = mode;
  }

  async chown(p, owner, group) {
    const node = this._resolve(p);
    if (owner !== undefined) node._meta.owner = owner;
    if (group !== undefined) node._meta.group = group;
  }

  async estimate() {
    return { used: this._calcSize(this._root), available: Infinity };
  }

  _calcSize(node) {
    if (node._meta.type === 'file') return node._meta.size;
    if (node._meta.type !== 'directory') return 0;
    let total = 0;
    for (const child of node._children.values()) {
      total += this._calcSize(child);
    }
    return total;
  }

  get symlinks() { return true; }
}

// -- idb.js --

class IDBBackend extends Backend {
  static type = 'idb';

  constructor(config) {
    super();
    this._dbName = (config && config.name) || 'gcu-vfs';
    this._db = null;
  }

  toConfig() {
    return { type: 'idb', name: this._dbName };
  }

  async init() {
    this._db = await new Promise((resolve, reject) => {
      const req = indexedDB.open(this._dbName, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('files')) {
          db.createObjectStore('files', { keyPath: 'path' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    // Ensure root directory exists
    const root = await this._get('/');
    if (!root) {
      const now = new Date();
      await this._put({
        path: '/', type: 'directory', content: null,
        size: 0, created: now, modified: now,
        mode: 0o755, owner: 'user', group: 'staff',
      });
    }
  }

  async destroy() {
    if (this._db) {
      this._db.close();
      this._db = null;
    }
  }

  _tx(mode) {
    const tx = this._db.transaction('files', mode);
    return tx.objectStore('files');
  }

  _get(p) {
    return new Promise((resolve, reject) => {
      const req = this._tx('readonly').get(p);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  _put(record) {
    return new Promise((resolve, reject) => {
      const req = this._tx('readwrite').put(record);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  _del(p) {
    return new Promise((resolve, reject) => {
      const req = this._tx('readwrite').delete(p);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  _cursorRange(prefix) {
    // All paths that start with prefix
    const lower = prefix === '/' ? '/' : prefix + '/';
    const upper = prefix === '/' ? '/\uffff' : prefix + '/\uffff';
    return { lower, upper };
  }

  _scan(prefix) {
    return new Promise((resolve, reject) => {
      const store = this._tx('readonly');
      const { lower, upper } = this._cursorRange(prefix);
      const range = IDBKeyRange.bound(lower, upper, false, true);
      const results = [];
      const req = store.openCursor(range);
      req.onsuccess = () => {
        const cursor = req.result;
        if (cursor) {
          results.push(cursor.value);
          cursor.continue();
        } else {
          resolve(results);
        }
      };
      req.onerror = () => reject(req.error);
    });
  }

  async readFile(p, encoding) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type === 'directory') throw vfsError('EISDIR', np);
    if (encoding === 'bytes') {
      if (rec.content instanceof Uint8Array) return new Uint8Array(rec.content);
      return new TextEncoder().encode(rec.content || '');
    }
    if (rec.content instanceof Uint8Array) return new TextDecoder().decode(rec.content);
    return rec.content || '';
  }

  async writeFile(p, content) {
    const np = path.normalize(p);
    const parentPath = path.dirname(np);
    if (parentPath !== np) {
      const parent = await this._get(parentPath);
      if (!parent) throw vfsError('ENOENT', np);
      if (parent.type !== 'directory') throw vfsError('ENOTDIR', np);
    }
    const existing = await this._get(np);
    if (existing && existing.type === 'directory') throw vfsError('EISDIR', np);
    const now = new Date();
    const isBinary = content instanceof Uint8Array;
    const size = typeof content === 'string'
      ? new TextEncoder().encode(content).byteLength
      : (isBinary ? content.byteLength : 0);
    await this._put({
      path: np, type: 'file', content,
      size, created: existing ? existing.created : now, modified: now,
      mode: existing ? existing.mode : 0o644,
      owner: existing ? existing.owner : 'user',
      group: existing ? existing.group : 'staff',
      _binary: isBinary,
    });
  }

  async stat(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    return {
      type: rec.type,
      size: rec.size || 0,
      created: rec.created instanceof Date ? rec.created : new Date(rec.created),
      modified: rec.modified instanceof Date ? rec.modified : new Date(rec.modified),
      mode: rec.mode != null ? rec.mode : (rec.type === 'directory' ? 0o755 : 0o644),
      owner: rec.owner || 'user',
      group: rec.group || 'staff',
    };
  }

  async mkdir(p, opts) {
    const np = path.normalize(p);
    if (opts && opts.recursive) return this._mkdirRecursive(np);
    const parentPath = path.dirname(np);
    if (parentPath !== np) {
      const parent = await this._get(parentPath);
      if (!parent) throw vfsError('ENOENT', np);
    }
    const existing = await this._get(np);
    if (existing) throw vfsError('EEXIST', np);
    const now = new Date();
    await this._put({
      path: np, type: 'directory', content: null,
      size: 0, created: now, modified: now,
      mode: 0o755, owner: 'user', group: 'staff',
    });
  }

  async _mkdirRecursive(np) {
    const segs = np.split('/').filter(Boolean);
    let current = '';
    for (const seg of segs) {
      current += '/' + seg;
      const existing = await this._get(current);
      if (!existing) {
        const now = new Date();
        await this._put({
          path: current, type: 'directory', content: null,
          size: 0, created: now, modified: now,
          mode: 0o755, owner: 'user', group: 'staff',
        });
      }
    }
  }

  async readdir(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type !== 'directory') throw vfsError('ENOTDIR', np);

    const all = await this._scan(np);
    const prefix = np === '/' ? '/' : np + '/';
    const names = new Set();
    for (const entry of all) {
      const rel = entry.path.slice(prefix.length);
      if (!rel) continue;
      // Direct children only: no '/' in the remaining path
      const slashIdx = rel.indexOf('/');
      names.add(slashIdx === -1 ? rel : rel.slice(0, slashIdx));
    }
    return [...names].sort();
  }

  async rmdir(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type !== 'directory') throw vfsError('ENOTDIR', np);
    const children = await this.readdir(np);
    if (children.length > 0) throw vfsError('ENOTEMPTY', np);
    await this._del(np);
  }

  async unlink(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (rec.type === 'directory') throw vfsError('EISDIR', np);
    await this._del(np);
  }

  async rename(oldP, newP) {
    const oldNp = path.normalize(oldP);
    const newNp = path.normalize(newP);
    const rec = await this._get(oldNp);
    if (!rec) throw vfsError('ENOENT', oldNp);

    if (rec.type === 'directory') {
      // Move directory and all children
      const all = await this._scan(oldNp);
      const oldPrefix = oldNp === '/' ? '/' : oldNp + '/';
      const newPrefix = newNp === '/' ? '/' : newNp + '/';
      // Re-key all children
      for (const entry of all) {
        const newPath = newPrefix + entry.path.slice(oldPrefix.length);
        await this._del(entry.path);
        entry.path = newPath;
        await this._put(entry);
      }
      // Move the directory record itself
      await this._del(oldNp);
      rec.path = newNp;
      rec.modified = new Date();
      await this._put(rec);
    } else {
      await this._del(oldNp);
      rec.path = newNp;
      rec.modified = new Date();
      await this._put(rec);
    }
  }

  async touch(p) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (rec) {
      if (rec.type === 'file') {
        rec.modified = new Date();
        await this._put(rec);
      }
    } else {
      await this.writeFile(np, '');
    }
  }

  async chmod(p, mode) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    rec.mode = mode;
    await this._put(rec);
  }

  async chown(p, owner, group) {
    const np = path.normalize(p);
    const rec = await this._get(np);
    if (!rec) throw vfsError('ENOENT', np);
    if (owner !== undefined) rec.owner = owner;
    if (group !== undefined) rec.group = group;
    await this._put(rec);
  }

  async estimate() {
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      return { used: est.usage || 0, available: (est.quota || 0) - (est.usage || 0) };
    }
    // Fallback: sum record sizes
    const all = await this._scan('/');
    let used = 0;
    for (const entry of all) used += entry.size || 0;
    return { used, available: Infinity };
  }

  get persistent() { return true; }
  get estimatable() { return true; }
}

// -- comment.js --

class CommentBackend extends Backend {
  static type = 'comment';

  constructor(config) {
    super();
    this._map = new Map();
    this._commentNode = null;
    this._dataMode = !!(config && config.data);
    this._initData = (config && config.data) || null;
  }

  async init() {
    if (this._initData) {
      // Data mode: load from provided object
      for (const [key, entry] of Object.entries(this._initData)) {
        this._map.set(key, { ...entry });
      }
    } else if (typeof document !== 'undefined') {
      // DOM mode: find existing AUDITABLE-FS comment
      this._commentNode = this._findComment();
      if (this._commentNode) {
        const raw = this._commentNode.nodeValue.replace(/^AUDITABLE-FS\n/, '').replace(/\nAUDITABLE-FS$/, '');
        const obj = this._decode(raw);
        for (const [key, entry] of Object.entries(obj)) {
          this._map.set(key, entry);
        }
      }
    }
  }

  _findComment() {
    if (typeof document === 'undefined') return null;
    const walker = document.createTreeWalker(document, 128 /* NodeFilter.SHOW_COMMENT */);
    while (walker.nextNode()) {
      if (walker.currentNode.nodeValue.startsWith('AUDITABLE-FS\n')) {
        return walker.currentNode;
      }
    }
    return null;
  }

  _toRel(p) {
    // Strip leading / for internal storage
    const np = path.normalize(p);
    return np === '/' ? '' : np.slice(1);
  }

  _toAbs(rel) {
    return rel ? '/' + rel : '/';
  }

  _encode(obj) {
    const json = JSON.stringify(obj);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    // Split into 76-char lines
    const lines = [];
    for (let i = 0; i < b64.length; i += 76) {
      lines.push(b64.slice(i, i + 76));
    }
    return lines.join('\n');
  }

  _decode(raw) {
    const stripped = raw.replace(/\s/g, '');
    // Legacy raw JSON detection
    if (stripped.startsWith('{')) {
      return JSON.parse(stripped);
    }
    const json = decodeURIComponent(escape(atob(stripped)));
    return JSON.parse(json);
  }

  _syncComment() {
    if (!this._commentNode) return;
    const obj = Object.fromEntries(this._map);
    this._commentNode.nodeValue = 'AUDITABLE-FS\n' + this._encode(obj) + '\nAUDITABLE-FS';
  }

  async readFile(p, encoding) {
    const rel = this._toRel(p);
    const entry = this._map.get(rel);
    if (!entry) throw vfsError('ENOENT', p);

    let raw;
    if (entry.compressed && typeof DecompressionStream !== 'undefined') {
      // Decompress gzip base64
      const bytes = Uint8Array.from(atob(entry.data), c => c.charCodeAt(0));
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const reader = ds.readable.getReader();
      const chunks = [];
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      const total = chunks.reduce((s, c) => s + c.byteLength, 0);
      const result = new Uint8Array(total);
      let offset = 0;
      for (const c of chunks) { result.set(c, offset); offset += c.byteLength; }
      raw = result;
    } else if (entry.data) {
      // Uncompressed base64
      const binary = atob(entry.data);
      raw = Uint8Array.from(binary, c => c.charCodeAt(0));
    } else {
      raw = new Uint8Array(0);
    }

    if (encoding === 'bytes') return raw;
    return new TextDecoder().decode(raw);
  }

  async writeFile(p, content) {
    const rel = this._toRel(p);
    // Verify parent directory exists (implicitly — check that we're not writing under a file)
    const parentRel = this._toRel(path.dirname(path.normalize(p)));
    if (parentRel) {
      // Check parent isn't a file
      if (this._map.has(parentRel)) throw vfsError('ENOTDIR', p);
    }

    let data, compressed = false, mimeType, size;

    if (content instanceof Uint8Array) {
      mimeType = path.mime(p);
      size = content.byteLength;
      // Try gzip compression in browser
      if (typeof CompressionStream !== 'undefined') {
        const cs = new CompressionStream('gzip');
        const writer = cs.writable.getWriter();
        writer.write(content);
        writer.close();
        const reader = cs.readable.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const total = chunks.reduce((s, c) => s + c.byteLength, 0);
        const result = new Uint8Array(total);
        let offset = 0;
        for (const c of chunks) { result.set(c, offset); offset += c.byteLength; }
        if (result.byteLength < content.byteLength) {
          data = btoa(String.fromCharCode(...result));
          compressed = true;
        } else {
          data = btoa(String.fromCharCode(...content));
        }
      } else {
        data = btoa(String.fromCharCode(...content));
      }
    } else {
      const str = content || '';
      mimeType = path.mime(p);
      const bytes = new TextEncoder().encode(str);
      size = bytes.byteLength;
      if (typeof CompressionStream !== 'undefined') {
        const cs = new CompressionStream('gzip');
        const writer = cs.writable.getWriter();
        writer.write(bytes);
        writer.close();
        const reader = cs.readable.getReader();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const total = chunks.reduce((s, c) => s + c.byteLength, 0);
        const result = new Uint8Array(total);
        let offset = 0;
        for (const c of chunks) { result.set(c, offset); offset += c.byteLength; }
        if (result.byteLength < bytes.byteLength) {
          data = btoa(String.fromCharCode(...result));
          compressed = true;
        } else {
          data = btoa(String.fromCharCode(...bytes));
        }
      } else {
        data = btoa(String.fromCharCode(...bytes));
      }
    }

    this._map.set(rel, { type: mimeType, compressed, size, data });
    this._syncComment();
  }

  async stat(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);

    // Root always exists
    if (rel === '') {
      return {
        type: 'directory', size: 0,
        created: new Date(0), modified: new Date(0),
        mode: 0o755, owner: 'user', group: 'staff',
      };
    }

    // Check if it's a file
    const entry = this._map.get(rel);
    if (entry) {
      return {
        type: 'file', size: entry.size || 0,
        created: new Date(0), modified: new Date(0),
        mode: 0o644, owner: 'user', group: 'staff',
      };
    }

    // Check if it's an implicit directory
    const prefix = rel + '/';
    for (const key of this._map.keys()) {
      if (key.startsWith(prefix)) {
        return {
          type: 'directory', size: 0,
          created: new Date(0), modified: new Date(0),
          mode: 0o755, owner: 'user', group: 'staff',
        };
      }
    }

    throw vfsError('ENOENT', np);
  }

  async mkdir(/* p, opts */) {
    // Implicit directories — mkdir is a no-op
  }

  async readdir(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    const prefix = rel ? rel + '/' : '';
    const names = new Set();

    for (const key of this._map.keys()) {
      if (rel === '') {
        // Root: all top-level entries
        const slashIdx = key.indexOf('/');
        names.add(slashIdx === -1 ? key : key.slice(0, slashIdx));
      } else if (key.startsWith(prefix)) {
        const rest = key.slice(prefix.length);
        if (!rest) continue;
        const slashIdx = rest.indexOf('/');
        names.add(slashIdx === -1 ? rest : rest.slice(0, slashIdx));
      }
    }

    return [...names].sort();
  }

  async rmdir(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    if (rel === '') throw vfsError('EACCES', np, 'cannot remove root');
    const children = await this.readdir(np);
    if (children.length > 0) throw vfsError('ENOTEMPTY', np);
    // No-op if empty (implicit directories have no record to delete)
  }

  async unlink(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    if (!this._map.has(rel)) throw vfsError('ENOENT', np);
    this._map.delete(rel);
    this._syncComment();
  }

  async rename(oldP, newP) {
    const oldRel = this._toRel(oldP);
    const newRel = this._toRel(newP);
    const entry = this._map.get(oldRel);
    if (!entry) throw vfsError('ENOENT', oldP);
    this._map.delete(oldRel);
    this._map.set(newRel, entry);
    this._syncComment();
  }

  async touch(p) {
    const np = path.normalize(p);
    const rel = this._toRel(np);
    if (!this._map.has(rel)) {
      // Create empty file
      this._map.set(rel, { type: path.mime(np), compressed: false, size: 0, data: '' });
      this._syncComment();
    }
    // No mtime to update in this format
  }

  async chmod() {
    // AUDITABLE-FS format doesn't store permissions — no-op
  }

  async chown() {
    // AUDITABLE-FS format doesn't store ownership — no-op
  }

  async export(basePath) {
    const np = path.normalize(basePath);
    const rel = this._toRel(np);
    const result = {};
    const prefix = rel ? rel + '/' : '';

    for (const [key, entry] of this._map) {
      let exportKey;
      if (rel === '') {
        exportKey = key;
      } else if (key.startsWith(prefix)) {
        exportKey = key.slice(prefix.length);
      } else if (key === rel) {
        // Exporting a single file
        const content = await this.readFile(np);
        return { [path.basename(np)]: content };
      } else {
        continue;
      }
      if (!exportKey) continue;
      result[exportKey] = entry;
    }
    return result;
  }

  async import(basePath, data) {
    const np = path.normalize(basePath);
    const rel = this._toRel(np);
    const prefix = rel ? rel + '/' : '';

    for (const [key, entry] of Object.entries(data)) {
      this._map.set(prefix + key, { ...entry });
    }
    this._syncComment();
  }

  getData() {
    return Object.fromEntries(this._map);
  }

  get persistent() { return true; }
  get portable() { return true; }
  get exportable() { return true; }
}

// -- handle.js --

class HandleBackend extends Backend {
  constructor(root) {
    super();
    this._root = root;
  }

  async _resolveDir(p) {
    const n = path.normalize(p);
    if (n === '/') return this._root;
    const segs = n.split('/').filter(Boolean);
    let dir = this._root;
    for (const seg of segs) {
      try {
        dir = await dir.getDirectoryHandle(seg);
      } catch {
        throw vfsError('ENOENT', p);
      }
    }
    return dir;
  }

  async _resolveFile(p, create) {
    const n = path.normalize(p);
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const dir = await this._resolveDir(parentPath);
    try {
      return await dir.getFileHandle(name, create ? { create: true } : undefined);
    } catch {
      throw vfsError('ENOENT', p);
    }
  }

  _resolveParent(p) {
    const n = path.normalize(p);
    return { dir: path.dirname(n), name: path.basename(n) };
  }

  async readFile(p, encoding) {
    const handle = await this._resolveFile(p);
    const file = await handle.getFile();
    if (encoding === 'bytes') {
      const buf = await file.arrayBuffer();
      return new Uint8Array(buf);
    }
    return await file.text();
  }

  async writeFile(p, content) {
    // Ensure parent exists (will throw ENOENT if not)
    const n = path.normalize(p);
    const parentPath = path.dirname(n);
    await this._resolveDir(parentPath);
    const handle = await this._resolveFile(p, true);
    const writable = await handle.createWritable();
    await writable.write(content);
    await writable.close();
  }

  async stat(p) {
    const n = path.normalize(p);
    if (n === '/') {
      return { type: 'directory', size: 0, created: new Date(0), modified: new Date(0) };
    }
    // Try file first
    try {
      const parentPath = path.dirname(n);
      const name = path.basename(n);
      const dir = await this._resolveDir(parentPath);
      const fh = await dir.getFileHandle(name);
      const file = await fh.getFile();
      return {
        type: 'file',
        size: file.size,
        created: new Date(file.lastModified),
        modified: new Date(file.lastModified),
      };
    } catch {
      // Try directory
      try {
        await this._resolveDir(n);
        return { type: 'directory', size: 0, created: new Date(0), modified: new Date(0) };
      } catch {
        throw vfsError('ENOENT', p);
      }
    }
  }

  async mkdir(p, opts) {
    const n = path.normalize(p);
    if (opts && opts.recursive) {
      const segs = n.split('/').filter(Boolean);
      let dir = this._root;
      for (const seg of segs) {
        dir = await dir.getDirectoryHandle(seg, { create: true });
      }
      return;
    }
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const parent = await this._resolveDir(parentPath);
    // Check if exists
    try {
      await parent.getDirectoryHandle(name);
      throw vfsError('EEXIST', p);
    } catch (e) {
      if (e.code === 'EEXIST') throw e;
    }
    await parent.getDirectoryHandle(name, { create: true });
  }

  async readdir(p) {
    const dir = await this._resolveDir(p);
    const names = [];
    for await (const [name] of dir.entries()) {
      names.push(name);
    }
    return names.sort();
  }

  async unlink(p) {
    const n = path.normalize(p);
    // Verify it's a file
    const info = await this.stat(p);
    if (info.type === 'directory') throw vfsError('EISDIR', p);
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const parent = await this._resolveDir(parentPath);
    await parent.removeEntry(name);
  }

  async rmdir(p) {
    const n = path.normalize(p);
    // Verify it's a directory
    const info = await this.stat(p);
    if (info.type !== 'directory') throw vfsError('ENOTDIR', p);
    const parentPath = path.dirname(n);
    const name = path.basename(n);
    const parent = await this._resolveDir(parentPath);
    await parent.removeEntry(name);
  }

  async rename(oldP, newP) {
    // No native rename in handle APIs — read, write, delete
    const info = await this.stat(oldP);
    if (info.type === 'directory') {
      // Recursive copy then delete
      await this._cpDir(oldP, newP);
      await this._rmDir(oldP);
    } else {
      const content = await this.readFile(oldP, 'bytes');
      await this.writeFile(newP, content);
      await this.unlink(oldP);
    }
  }

  async _cpDir(src, dst) {
    await this.mkdir(dst, { recursive: true });
    const entries = await this.readdir(src);
    for (const name of entries) {
      const srcChild = path.join(src, name);
      const dstChild = path.join(dst, name);
      const info = await this.stat(srcChild);
      if (info.type === 'directory') {
        await this._cpDir(srcChild, dstChild);
      } else {
        const content = await this.readFile(srcChild, 'bytes');
        await this.writeFile(dstChild, content);
      }
    }
  }

  async _rmDir(p) {
    const entries = await this.readdir(p);
    for (const name of entries) {
      const child = path.join(p, name);
      const info = await this.stat(child);
      if (info.type === 'directory') {
        await this._rmDir(child);
      } else {
        await this.unlink(child);
      }
    }
    await this.rmdir(p);
  }

  createReadStream(p) {
    // Return a thunk — caller must await the file handle resolution
    // For HandleBackend, return null and let subclass or consumer use readFile
    return null;
  }

  async createWriter(p) {
    const handle = await this._resolveFile(p, true);
    return handle.createWritable();
  }

  get persistent() { return true; }
  get streamable() { return true; }
  get estimatable() { return true; }

  async estimate() {
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      return { used: est.usage || 0, available: (est.quota || 0) - (est.usage || 0) };
    }
    return { used: 0, available: Infinity };
  }
}

// -- opfs.js --

class OPFSBackend extends HandleBackend {
  static type = 'opfs';

  constructor(config) {
    super(null);
    this._fallbackConfig = config && config.fallback;
    this._fallback = null;
  }

  toConfig() {
    // Real OPFS replicates fine: the worker gets its own origin-private
    // directory from navigator.storage.getDirectory() — same handle as
    // the main thread. When running in fallback mode (no OPFS available
    // in this context), we can't replicate because the fallback could
    // itself be non-replicable; let proc proxy instead.
    if (this._fallback) return null;
    return { type: 'opfs' };
  }

  async init() {
    if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.getDirectory) {
      this._root = await navigator.storage.getDirectory();
    } else if (this._fallbackConfig) {
      // Create fallback backend via the factory function set during build
      if (typeof _createBackend === 'function') {
        this._fallback = _createBackend(this._fallbackConfig);
      } else {
        // Standalone usage — try to construct directly
        throw vfsError('ENOTSUP', '/', 'OPFS not available and no backend factory');
      }
      if (this._fallback.init) await this._fallback.init();
    } else {
      throw vfsError('ENOTSUP', '/', 'OPFS not available');
    }
  }

  // Delegate all methods when in fallback mode
  async readFile(p, encoding) {
    if (this._fallback) return this._fallback.readFile(p, encoding);
    return super.readFile(p, encoding);
  }
  async writeFile(p, content) {
    if (this._fallback) return this._fallback.writeFile(p, content);
    return super.writeFile(p, content);
  }
  async stat(p) {
    if (this._fallback) return this._fallback.stat(p);
    return super.stat(p);
  }
  async mkdir(p, opts) {
    if (this._fallback) return this._fallback.mkdir(p, opts);
    return super.mkdir(p, opts);
  }
  async readdir(p) {
    if (this._fallback) return this._fallback.readdir(p);
    return super.readdir(p);
  }
  async rmdir(p) {
    if (this._fallback) return this._fallback.rmdir(p);
    return super.rmdir(p);
  }
  async unlink(p) {
    if (this._fallback) return this._fallback.unlink(p);
    return super.unlink(p);
  }
  async rename(oldP, newP) {
    if (this._fallback) return this._fallback.rename(oldP, newP);
    return super.rename(oldP, newP);
  }
  async touch(p) {
    if (this._fallback) return this._fallback.touch(p);
    return super.touch(p);
  }
  async exists(p) {
    if (this._fallback) return this._fallback.exists(p);
    return super.exists(p);
  }
  createReadStream(p) {
    if (this._fallback) return this._fallback.createReadStream(p);
    return super.createReadStream(p);
  }
  async createWriter(p) {
    if (this._fallback) return this._fallback.createWriter(p);
    return super.createWriter(p);
  }
  async estimate() {
    if (this._fallback) return this._fallback.estimate();
    return super.estimate();
  }
  async chmod(p, mode) {
    if (this._fallback && this._fallback.chmod) return this._fallback.chmod(p, mode);
    return super.chmod(p, mode);
  }
  async chown(p, owner, group) {
    if (this._fallback && this._fallback.chown) return this._fallback.chown(p, owner, group);
    return super.chown(p, owner, group);
  }
  async destroy() {
    if (this._fallback && this._fallback.destroy) return this._fallback.destroy();
  }
  async export(basePath) {
    if (this._fallback && this._fallback.export) return this._fallback.export(basePath);
    return super.export(basePath);
  }
  async import(basePath, data) {
    if (this._fallback && this._fallback.import) return this._fallback.import(basePath, data);
    return super.import(basePath, data);
  }

  // Capabilities delegate to fallback when active
  get persistent() { return this._fallback ? !!this._fallback.persistent : true; }
  get streamable() { return this._fallback ? !!this._fallback.streamable : true; }
  get estimatable() { return this._fallback ? !!this._fallback.estimatable : true; }
  get readonly() { return this._fallback ? !!this._fallback.readonly : false; }
  get portable() { return this._fallback ? !!this._fallback.portable : false; }
  get symlinks() { return this._fallback ? !!this._fallback.symlinks : false; }
}

class FSAABackend extends HandleBackend {

    if (!this._root) {
      throw vfsError('ENOTSUP', '/', 'no directory handle provided');
