      if (!cur || pc.at >= cur.at) price.set(pc.ingredientId, { price: pc.price, at: pc.at });
    }
    maps.price = price;
    const reversed = new Set(); // `${kind}:${refId}` for every reversed event (estorno)
    for (const r of this.state.reversals) reversed.add(`${r.kind}:${r.refId}`);
    maps.reversed = reversed;
    this._index = maps; this._indexRev = this._rev;
    return maps;
  }

  /** Was this event (a sale/batch/variableCost/perda) reversed by an estorno? */
  isReversed(kind, id) { return this._idx().reversed.has(`${kind}:${id}`); }

  // ── Config (engine settings; §4) ─────────────────────────────────────────────

  /** @returns {import('./domain.js').Config} */
  getConfig() { return this.state.config; }

  /** Patch config in place. @param {Partial<import('./domain.js').Config>} partial */
  setConfig(partial) {
    const updatedAt = new Date().toISOString();
    for (const [key, value] of Object.entries(partial)) {
      this.state.config[key] = value;
      this.state.configUpdatedAt[key] = updatedAt;
    }
    this._rev++;
    return this.state.config;
  }

  /** Latest price for an ingredient (BRL per stockUnit), or null if none recorded yet. */
  currentPrice(ingredientId) {
    const e = this._idx().price.get(ingredientId);
    return e ? e.price : null;
  }

  /** ISO date of the latest recorded price for an ingredient, or null. */
  lastPriceAt(ingredientId) {
    const e = this._idx().price.get(ingredientId);
    return e ? e.at : null;
  }

  /** Full price history for an ingredient, newest first: [{ at, price }]. */
  priceHistory(ingredientId) {
    return this.state.priceChanges
      .filter((pc) => pc.ingredientId === ingredientId)
      .map((pc) => ({ at: pc.at, price: pc.price }))
      .sort((a, b) => (a.at < b.at ? 1 : -1));
  }

  // ── Master data (mutable upsert/remove) ──────────────────────────────────────

  /** @param {import('./domain.js').Ingredient} x */
  upsertIngredient(x) { return this._upsertDated('ingredients', x); }
  /** @param {import('./domain.js').Recipe} x */
  upsertRecipe(x) { return this._upsertDated('recipes', x); }
  /** @param {import('./domain.js').Product} x */
  upsertProduct(x) {
    const product = normalizeProductSaleKind(x);
    return this._upsert('products', {
      ...product,
      components: isBundleProduct(product) ? (product.components || []).filter((c) => c.kind !== 'product') : product.components,
      updatedAt: new Date().toISOString(),
    });
  }
  /** @param {import('./domain.js').Cliente} x */
  upsertClient(x) { return this._upsert('clients', x); }
  /** @param {object} x */
  upsertEmployee(x) { return this._upsert('employees', x); }
  /** @param {import('./domain.js').Encomenda} x */
  upsertEncomenda(x) {
    const previousAt = Date.parse(this.get('encomendas', x.id)?.updatedAt || '');
    const updatedAt = new Date(Math.max(Date.now(), Number.isFinite(previousAt) ? previousAt + 1 : 0)).toISOString();
    return this._upsert('encomendas', { ...x, updatedAt });
  }
  /** @param {import('./domain.js').Comanda} x */
  upsertComanda(x) { return this._upsertDated('comandas', x); }
  /** @param {import('./domain.js').Category} x */
  upsertCategory(x) { return this._upsert('categories', x); }
  /** @param {object} x */
  upsertSupplier(x) { return this._upsert('suppliers', x); }
  /** @param {object} x */
  upsertCashAccount(x) { return this._upsert('cashAccounts', x); }
  /** @param {object} x */
  upsertFinanceTitle(x) { return this._upsertDated('financeTitles', x); }
  /** @param {object} x */
  upsertPurchase(x) { return this._upsert('purchases', x); }
  /** @param {object} x */
  upsertNotification(x) { return this._upsert('notifications', x); }
  /** @param {object} x */
  upsertShoppingItem(x) { return this._upsert('shoppingItems', x); }
  /** Machinery and durable items; purchase stays outside the DRE, depreciation enters over time. */
  upsertAsset(x) { return this._upsertDated('assets', x); }

  removeIngredient(id, at) { return this._trash('ingredients', id, at); }
  removeRecipe(id, at) { return this._trash('recipes', id, at); }
  removeProduct(id, at) { return this._trash('products', id, at); }
  removeClient(id, at) { return this._trash('clients', id, at); }
  removeEmployee(id, at) { return this._trash('employees', id, at); }
  removeEncomenda(id, at) { return this._trash('encomendas', id, at); }
  removeComanda(id, at) { return this._trash('comandas', id, at); }
  removeCategory(id, at) { return this._trash('categories', id, at); }
  /** @param {string} id */
  removeSupplier(id, at) { return this._trash('suppliers', id, at); }
  /** @param {string} id */
  removeCashAccount(id, at) { return this._trash('cashAccounts', id, at); }
  removeNotification(id, at) { return this._trash('notifications', id, at); }
  removeShoppingItem(id, at) { return this._trash('shoppingItems', id, at); }
  removeAsset(id, at) { return this._trash('assets', id, at); }

  /** Deleted master records retained for 30 days, newest first. */
  activeTrash() {
    return this.state.trashItems
      .filter((item) => item.status === 'deleted' && item.record)
      .slice()
      .sort((a, b) => String(b.deletedAt).localeCompare(String(a.deletedAt)));
  }

  /** Restore a deleted record and keep a small sync marker so an older Dropbox copy cannot delete it again. */
  restoreTrash(itemId, at) {
    const item = this.get('trashItems', itemId);
    if (!item || item.status !== 'deleted' || !item.record || !BUSINESS_MASTER_COLLECTIONS.includes(item.collection)) return false;
    const restored = trashCloneRecord(item.record);
    const changedAt = trashNormalizeDate(at);
    this._upsert('trashItems', { ...item, status: 'restored', record: null, updatedAt: changedAt });
    this._upsert(item.collection, restored);
    return true;
  }

  /** Remove expired payloads while retaining only the tombstone required for safe Dropbox sync. */
  purgeExpiredTrash(now) {
    const cutoff = trashNormalizeDate(now);
    let purged = 0;
    for (const item of this.state.trashItems.slice()) {
      if (item.status !== 'deleted' || !item.expiresAt || item.expiresAt > cutoff) continue;
      this._upsert('trashItems', { ...item, status: 'purged', record: null, updatedAt: cutoff });
      this._hardRemove(item.collection, item.recordId);
      purged++;
    }
    return purged;
  }

  // ── Events (append-only) ─────────────────────────────────────────────────────

  /** @param {import('./domain.js').PriceChange} ev */
  addPriceChange(ev) { return this._append('priceChanges', ev); }
  /** @param {import('./domain.js').Batch} ev */
  addBatch(ev) { return this._append('batches', ev); }
  /** @param {import('./domain.js').Sale} ev */
  addSale(ev) { return this._append('sales', ev); }
  /** @param {import('./domain.js').VariableCost} ev */
  addVariableCost(ev) { return this._append('variableCosts', ev); }
  /** @param {import('./domain.js').Perda} ev */
  addPerda(ev) { return this._append('perdas', ev); }
  /** @param {import('./domain.js').Pagamento} ev — a (partial) payment toward an encomenda. */
  addPayment(ev) { return this._append('payments', ev); }
  /** @param {import('./domain.js').Despesa} ev — a dated cash expense (fixa/variável via its category). */
  addDespesa(ev) { return this._append('despesas', ev); }
  /** Another dated cash income outside order payments. */
  addIncome(ev) { return this._append('incomes', ev); }
  /** @param {object} ev */
  addFinanceSettlement(ev) { return this._append('financeSettlements', ev); }
  /** @param {object} ev */
  addCashAdjustment(ev) { return this._append('cashAdjustments', ev); }
  /** @param {import('./domain.js').Reversal} ev — estorno of a prior event (kind + refId). */
  addReversal(ev) { return this._append('reversals', ev); }
  /** Start or end of the observed working day; a reference, not direct recipe labor. */
  addWorkTimeEvent(ev) { return this._append('workTimeEvents', ev); }

  /** Clear the test orders and expenses while retaining an auditable, restorable history. */
  clearOrdersAndExpenses(at = new Date().toISOString(), idFactory = () => crypto.randomUUID()) {
    const orders = this.state.encomendas.slice();
    const orderIds = new Set(orders.map((order) => order.id));
    for (const item of this.state.trashItems) if (item.collection === 'encomendas' && item.status === 'deleted') orderIds.add(item.recordId);
    const cancelledTitles = this.state.financeTitles.filter((title) => title.direction === 'pagar'
      || (title.sourceType === 'encomenda' && orderIds.has(title.sourceId))
      || title.sourceType === 'sale');
    const titleIds = new Set(cancelledTitles.map((title) => title.id));
    const reverse = (kind, record) => {
      if (!this.isReversed(kind, record.id)) this.addReversal({ id: idFactory(), at, kind, refId: record.id, reason: 'Limpeza de pedidos e despesas' });
    };
    for (const order of orders) this.removeEncomenda(order.id, at);
    for (const payment of this.state.payments) if (orderIds.has(payment.encomendaId)) reverse('payment', payment);
    for (const sale of this.state.sales) reverse('sale', sale);
    for (const expense of this.state.despesas) reverse('despesa', expense);
    for (const cost of this.state.variableCosts) reverse('variableCost', cost);
    for (const settlement of this.state.financeSettlements) if (titleIds.has(settlement.titleId)) reverse('financeSettlement', settlement);
    for (const adjustment of this.state.cashAdjustments) if (adjustment.kind === 'client-payment') {
      const allocations = this.state.financeSettlements.filter((s) => s.paymentId === adjustment.id && s.kind === 'client-payment-allocation');
      if (allocations.length && allocations.every((s) => titleIds.has(s.titleId))) reverse('cashAdjustment', adjustment);
    }
    for (const title of cancelledTitles) if (!title.cancelledAt) this.upsertFinanceTitle({ ...title, cancelledAt: at });
    return { orders: orders.length, legacySales: this.state.sales.length, expenses: this.state.despesas.length + this.state.variableCosts.length, payables: cancelledTitles.filter((title) => title.direction === 'pagar').length };
  }

  /** Total received toward an encomenda (non-reversed payments). Saldo/status derive from this. */
  paidFor(encomendaId) {
    let sum = 0;
    for (const pg of this.state.payments) {
      if (pg.encomendaId === encomendaId && !this.isReversed('payment', pg.id)) sum += pg.valor || 0;
    }
    return sum;
  }

  /** Sum valid generic settlements for a financial title. */
  settledFor(titleId) {
    let sum = 0;
    for (const st of this.state.financeSettlements) {
      if (st.titleId === titleId && !this.isReversed('financeSettlement', st.id)) sum += Number(st.amount) || 0;
    }
    return sum;
  }

  /**
   * Mark an order as a desistência without deleting it. If the day's stored comanda has an explicit
   * planned quantity, release this order's products from that quantity so already-produced items
   * immediately become available for sale. Delivery and payment facts remain untouched.
   */
  markEncomendaDesistencia(encomendaId, at) {
    const enc = this.get('encomendas', encomendaId);
    if (!enc || enc.desistenciaAt) return enc;
    const date = String(enc.deliveryDate || '').slice(0, 10);
    const comanda = date ? this.get('comandas', date) : null;
    if (comanda?.itens?.some((item) => item.prevista != null && item.manualQty == null)) {
      const cancelled = orderProduction(enc);
      const itens = comanda.itens.map((item) => item.prevista == null || item.manualQty != null
        ? item : { ...item, prevista: Math.max(0, Number(item.prevista) - (cancelled.get(item.productId) || 0)) });
      this.upsertComanda({ ...comanda, itens });
    }
    this.upsertEncomenda({ ...enc, desistenciaAt: at });

    // New comanda records store manualQty separately, so their demand falls automatically.
    return this.get('encomendas', encomendaId);
  }

  // ── Read model ───────────────────────────────────────────────────────────────

  /** Index the state for the cost engine (memoized until the next mutation). */
  toEngineStore() {
    if (this._engineStore && this._engineRev === this._rev) return this._engineStore;
    this._engineStore = indexStore(this.state);
    this._engineRev = this._rev;
    return this._engineStore;
  }

  /** Get a master record by id, or undefined. O(1) via the memoized index. */
  get(collection, id) {
    const m = this._idx()[collection];
    return m ? m.get(id) : this.state[collection].find((x) => x.id === id);
  }

  // ── Merge (sync — union by id; §2.2) ─────────────────────────────────────────

  /**
   * Merge another store/state into this one. Events union by id (immutable, so a shared
   * id means identical content — duplicates are dropped). Dated master edits use updatedAt
   * so a stale Dropbox copy cannot undo newly saved data on this device.
   * @param {PaiolStore | State} other
   * @returns {{ eventsAdded: number, masterUpserted: number }}
   */
  merge(other) {
    const o = other instanceof PaiolStore ? other.state : other;
    let eventsAdded = 0;
    let masterUpserted = 0;

    for (const c of EVENT_COLLECTIONS) {
      const seen = new Set(this.state[c].map((x) => x.id));
      for (const ev of o[c] || []) {
        if (seen.has(ev.id)) continue;
        seen.add(ev.id);
        this.state[c].push(ev);
        eventsAdded++;
      }
    }
    // Trash markers merge by their own timestamp. This must happen before the business records,
    // otherwise an old Dropbox copy could resurrect something that was deleted on this device.
    for (const rec of o.trashItems || []) {
      const local = this.state.trashItems.find((item) => item.id === rec.id);
      const incomingAt = String(rec.updatedAt || rec.deletedAt || '');
      const localAt = String((local && (local.updatedAt || local.deletedAt)) || '');
      if (!local || incomingAt > localAt) { this._upsert('trashItems', rec); masterUpserted++; }
    }
    for (const c of BUSINESS_MASTER_COLLECTIONS) {
      for (const rec of o[c] || []) {
        if (this._trashBlocks(c, rec.id)) continue;
        // Legacy records without updatedAt remain compatible: a dated edit wins over them.
        if (['products', 'encomendas', 'ingredients', 'recipes', 'comandas', 'financeTitles', 'assets'].includes(c)) {
          const local = this.get(c, rec.id);
          if (local && String(local.updatedAt || '') > String(rec.updatedAt || '')) continue;
          if (local && JSON.stringify(local) === JSON.stringify(rec)) continue;
        }
        if (JSON.stringify(this.get(c, rec.id)) === JSON.stringify(rec)) continue;
        this._upsert(c, rec);
        masterUpserted++;
      }
    }
    this._applyTrashSuppression();
    // Settings merge field by field. A stale Dropbox snapshot must not undo a local edit.
    // Older backups have no timestamps: keep a non-default local value, but let a fresh
    // device with defaults adopt the remote value. Stamp the chosen legacy value once.
    if (o.config) for (const key of CONFIG_KEYS) {
      if (o.config[key] === undefined) continue;
      const localAt = String(this.state.configUpdatedAt[key] || '');
      const remoteAt = String(o.configUpdatedAt?.[key] || '');
      const localValue = this.state.config[key];
      const remoteValue = o.config[key];
      const localJson = JSON.stringify(localValue);
      const remoteJson = JSON.stringify(remoteValue);
      if (localAt === remoteAt && localJson === remoteJson) continue;
      let takeRemote = remoteAt > localAt;
      if (localAt === remoteAt) {
        if (localAt) takeRemote = remoteJson > localJson; // deterministic tie-break
        else takeRemote = localJson === JSON.stringify(DEFAULT_CONFIG[key]) && remoteJson !== JSON.stringify(DEFAULT_CONFIG[key]);
      }
      const chosenAt = localAt === remoteAt && !localAt
        ? new Date().toISOString() : (takeRemote ? remoteAt : localAt);
      if (takeRemote && localJson !== remoteJson) {
        this.state.config[key] = remoteValue;
        masterUpserted++;
      }
      if (chosenAt !== localAt) this.state.configUpdatedAt[key] = chosenAt;
      if ((takeRemote && localJson !== remoteJson) || chosenAt !== localAt) this._rev++;
    }
    return { eventsAdded, masterUpserted };
  }

  // ── Serialization (§5 — one YAML document) ───────────────────────────────────

  /**
   * @returns {string} canonical strict-YAML of the whole business.
   * Deterministic regardless of insertion/merge order: collection key order is fixed, events
   * are sorted chronologically by (at, id), master data by id. This is what makes the file
   * diff-stable (§5) AND makes sync converge byte-identically across devices — two stores with
   * the same data serialize to the same bytes.
   */
  toYaml() {
    const ordered = { version: this.state.version, config: orderedConfig(this.state.config), configUpdatedAt: orderedConfigUpdatedAt(this.state.configUpdatedAt) };
    for (const c of MASTER_COLLECTIONS) ordered[c] = sortBy(this.state[c], byId);
    for (const c of EVENT_COLLECTIONS) ordered[c] = sortBy(this.state[c], byAtThenId);
    return toYaml(ordered);
  }

  /** @param {string} text @returns {PaiolStore} */
  static fromYaml(text) {
    return new PaiolStore(/** @type {Partial<State>} */ (fromYaml(text)));
  }

  /** @returns {PaiolStore} a deep-ish copy (records shared; collections fresh). */
  clone() {
    const copy = emptyState();
    copy.version = this.state.version;
    copy.config = { ...this.state.config };
    copy.configUpdatedAt = { ...this.state.configUpdatedAt };
    for (const c of ALL) copy[c] = this.state[c].slice();
    return new PaiolStore(copy);
  }

  // ── internals ────────────────────────────────────────────────────────────────

  _upsertDated(collection, rec) {
    const previousAt = Date.parse(this.get(collection, rec.id)?.updatedAt || '');
    const updatedAt = new Date(Math.max(Date.now(), Number.isFinite(previousAt) ? previousAt + 1 : 0)).toISOString();
    return this._upsert(collection, { ...rec, updatedAt });
  }

  _upsert(collection, rec) {
    if (!rec || typeof rec.id !== 'string' || !rec.id) {
      throw new StoreError(`registro de ${collection} precisa de um id`);
    }
    const arr = this.state[collection];
    const i = arr.findIndex((x) => x.id === rec.id);
    if (i >= 0) arr[i] = rec; else arr.push(rec);
    this._rev++;
    return rec;
  }

  _trash(collection, id, at) {
    if (!BUSINESS_MASTER_COLLECTIONS.includes(collection)) return false;
    const arr = this.state[collection];
    const i = arr.findIndex((x) => x.id === id);
    if (i < 0) return false;
    const deletedAt = trashNormalizeDate(at);
    const record = trashCloneRecord(arr[i]);
    const trashId = `${collection}:${id}`;
    this._upsert('trashItems', {
      id: trashId,
      collection,
      recordId: id,
      label: trashRecordLabel(record),
      record,
      deletedAt,
      expiresAt: trashAddDays(deletedAt, 30),
      status: 'deleted',
      updatedAt: deletedAt,
    });
    this._hardRemove(collection, id);
    return true;
  }

  _trashBlocks(collection, id) {
    const item = this.state.trashItems.find((entry) => entry.id === `${collection}:${id}`);
    return !!item && (item.status === 'deleted' || item.status === 'purged');
  }

  _applyTrashSuppression() {
    for (const item of this.state.trashItems) {
      if (item.status === 'deleted' || item.status === 'purged') this._hardRemove(item.collection, item.recordId);
    }
  }

  _hardRemove(collection, id) {
    const arr = this.state[collection];
    if (!Array.isArray(arr)) return false;
    const i = arr.findIndex((x) => x.id === id);
    if (i >= 0) { arr.splice(i, 1); this._rev++; return true; }
    return false;
  }

  _append(collection, ev) {
    if (!ev || typeof ev.id !== 'string' || !ev.id) {
      throw new StoreError(`evento de ${collection} precisa de um id`);
    }
    if (typeof ev.at !== 'string' || !ev.at) {
      throw new StoreError(`evento de ${collection} precisa de uma data (at)`);
    }
    if (this.state[collection].some((x) => x.id === ev.id)) {
      throw new StoreError(`evento duplicado em ${collection}: ${ev.id}`);
    }
    this.state[collection].push(ev);
    this._rev++;
    return ev;
  }
}

function trashNormalizeDate(value) {
  const date = value ? new Date(value) : new Date();
  if (Number.isNaN(date.getTime())) throw new StoreError('data inválida para a lixeira');
  return date.toISOString();
}

function trashAddDays(iso, days) {
  const date = new Date(iso);
  date.setUTCDate(date.getUTCDate() + days);
  return date.toISOString();
}

function trashCloneRecord(record) {
  return JSON.parse(JSON.stringify(record));
}

function trashRecordLabel(record) {
  return String(record.name || record.description || record.nome || record.date || record.deliveryDate || record.id || 'Registro excluído');
}

// Deterministic ordering for serialization (does not mutate the live arrays).
function orderedConfig(config) {
  const out = {};
  for (const k of CONFIG_KEYS) if (config[k] !== undefined) out[k] = config[k];
  return out;
}
function orderedConfigUpdatedAt(updatedAt) {
  const out = {};
  for (const key of CONFIG_KEYS) if (updatedAt[key]) out[key] = updatedAt[key];
  return out;
}
function sortBy(arr, cmp) { return arr.slice().sort(cmp); }
function byId(a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; }
function byAtThenId(a, b) {
  if (a.at !== b.at) return a.at < b.at ? -1 : 1;
  return byId(a, b);
}

class StoreError extends Error {
  constructor(message) {
    super(message);
    this.name = 'StoreError';
  }
}

// ── src/persist.js ──
// paiol — persistence over @gcu/vfs. Backend-agnostic by design: the SAME code persists
// to IndexedDB (local source of truth) and to Dropbox (durable backup / sync) because both
// are just VFS backends. The store serializes to one YAML document (§5).
//
// This module does I/O but knows nothing about which backend it's writing to — the caller
// mounts a VFS (IDBBackend for local, DropboxBackend for remote) and hands it in.



const DEFAULT_PATH = '/paiol/business.yaml';
const SNAPSHOT_DIR = '/paiol/snapshots';

/**
 * Load the business from a VFS path. Returns a fresh empty store if the file is absent.
 * @param {object} vfs  a @gcu/vfs VFS instance
 * @param {string} [path]
 * @returns {Promise<PaiolStore>}
 */
async function loadStore(vfs, path = DEFAULT_PATH) {
  if (!(await vfs.exists(path))) return new PaiolStore();
  const text = await vfs.readFile(path, 'utf8');
  return PaiolStore.fromYaml(text);
}

/**
 * Write the whole business to a VFS path (atomic at the backend level — Dropbox commits the
 * whole file or nothing). Creates parent directories as needed.
 * @param {object} vfs @param {PaiolStore} store @param {string} [path]
 * @returns {Promise<string>} the path written
 */
async function saveStore(vfs, store, path = DEFAULT_PATH) {
  await ensureDir(vfs, parentOf(path));
  await vfs.writeFile(path, store.toYaml());
  return path;
}

/**
 * Write a dated snapshot (`paiol-2026-06.yaml`) so recovery doesn't depend on the backend's
 * own version retention (§5 safety nets).
 * @param {object} vfs @param {PaiolStore} store @param {string} label  e.g. "2026-06"
 * @param {string} [dir]
 * @returns {Promise<string>} the snapshot path
 */
async function snapshotStore(vfs, store, label, dir = SNAPSHOT_DIR) {
  await ensureDir(vfs, dir);
  const path = `${dir}/paiol-${label}.yaml`;
  await vfs.writeFile(path, store.toYaml());
  return path;
}

/**
 * A debounced background saver (§5 write path): IndexedDB is written shortly after each
 * change rather than on every keystroke. `schedule()` coalesces bursts; `flushNow()` forces
 * an immediate write (call on page hide / before sync).
 *
 * @param {object} vfs
 * @param {() => PaiolStore} getStore  // late-bound so the latest state is always saved
 * @param {{ path?: string, delayMs?: number, setTimeoutFn?: Function, clearTimeoutFn?: Function }} [opts]
 */
function createDebouncedSaver(vfs, getStore, opts = {}) {
  const path = opts.path || DEFAULT_PATH;
  const delayMs = opts.delayMs ?? 800;
  const setT = opts.setTimeoutFn || setTimeout;
  const clearT = opts.clearTimeoutFn || clearTimeout;
  let timer = null;
  let dirty = false;
  /** @type {Promise<void>|null} */
  let inflight = null;

  async function flush() {
    dirty = false;
    const write = saveStore(vfs, getStore(), path).then(() => {});
    inflight = write;
    try { await write; }
    catch (e) { dirty = true; throw e; }
    finally { if (inflight === write) inflight = null; }
  }

  return {
    /** Mark dirty and (re)arm the debounce timer. */
    schedule() {
      dirty = true;
      if (timer) clearT(timer);
      timer = setT(() => { timer = null; flush().catch(() => {}); }, delayMs);
    },
    /** Force an immediate save if anything is pending. Awaits any in-flight write. */
    async flushNow() {
      if (timer) { clearT(timer); timer = null; }
      if (inflight) await inflight;
      if (dirty) await flush();
    },
    get pending() { return dirty || !!timer; },
  };
}

// ── path helpers ──────────────────────────────────────────────────────────────

function parentOf(path) {
  const i = path.lastIndexOf('/');
  return i <= 0 ? '/' : path.slice(0, i);
}

async function ensureDir(vfs, dir) {
  if (!dir || dir === '/') return;
  if (!(await vfs.exists(dir))) await vfs.mkdir(dir, { recursive: true });
}

// ── src/sync.js ──
// paiol — sync engine (§5). Backend-agnostic: it reconciles the local store against a remote
// YAML file over a VFS. The remote is a DropboxBackend in production, but the engine neither
// knows nor cares — any VFS works, which is why it's testable against a MemoryBackend.
//
// Convergence rests on the append-only log (§2.2): pull the remote, union-by-id into local,
// push the union back. Two devices that both append merge cleanly — there is no field-level
// conflict to resolve, only set union. (A true concurrent-write race is still possible in the
// window between read and write; the dated snapshots are the backstop, and v0.1 is single-user.)





/**
 * Reconcile `localStore` with the remote file at `path` on `vfs`. Mutates `localStore` to the
 * union, and writes the union back to the remote only if it actually changed (no redundant
 * uploads). Returns what moved each way.
 *
 * @param {PaiolStore} localStore
 * @param {object} vfs                      a @gcu/vfs VFS whose mount is the remote (e.g. Dropbox)
 * @param {{ path?: string, snapshotLabel?: string }} [opts]
 * @returns {Promise<{ pulledEvents: number, pulledMaster: number, pushed: boolean }>}
 */
async function syncOnce(localStore, vfs, opts = {}) {
  const path = opts.path || DEFAULT_PATH;

  const remoteText = (await vfs.exists(path)) ? await vfs.readFile(path, 'utf8') : null;
  const remote = remoteText == null ? new PaiolStore() : PaiolStore.fromYaml(remoteText);

  const pulled = localStore.merge(remote);
  // An expired item may have arrived from another device. Purge its payload before comparing or
  // pushing, while keeping the small tombstone that prevents an old copy from resurrecting it.
  localStore.purgeExpiredTrash(new Date().toISOString());

  const localText = localStore.toYaml();
  let pushed = false;
  if (localText !== remoteText) {
    // Snapshot the prior remote before overwriting, so recovery never depends on Dropbox's own
    // version history (§5 safety net).
    if (opts.snapshotLabel && remoteText != null) {
      // Place snapshots NEXT TO the business file (e.g. /snapshots beside /business.yaml), not
      // under a hard-coded /paiol — on the Dropbox app folder the app root already is "paiol".
      const dir = path.slice(0, path.lastIndexOf('/'));
      await snapshotStore(vfs, remote, opts.snapshotLabel, `${dir}/snapshots`).catch(() => {});
    }
    await saveStore(vfs, localStore, path);
    pushed = true;
  }

  return { pulledEvents: pulled.eventsAdded, pulledMaster: pulled.masterUpserted, pushed };
}

/**
 * Drive sync automatically and SAFELY. Data-loss avoidance is the whole point, so:
 *  - every run goes through {@link syncOnce} (pull → union-merge → push) — a push never
 *    blind-overwrites the remote, and the prior remote is snapshotted first;
 *  - the local store is flushed to its source-of-truth (IndexedDB) BEFORE and AFTER each run, so
 *    nothing is lost even if the remote write fails;
 *  - runs never overlap (a request mid-flight is coalesced into a single follow-up), so two
 *    concurrent pushes can't race on this device;
 *  - bursts of changes debounce into one push.
 *
 * Pure/injectable (timers + remote are injected) so it is unit-testable against a MemoryBackend.
 *
 * @param {object} deps
 * @param {() => PaiolStore} deps.getStore
 * @param {() => Promise<void>} deps.flushLocal          persist the local store now
 * @param {() => Promise<object>} deps.openRemote        mount the remote VFS
 * @param {() => (string|undefined)} [deps.snapshotLabel]
 * @param {(res: {ok:boolean, pulledEvents?:number, pulledMaster?:number, pushed?:boolean, error?:string}, meta: object) => void} [deps.onResult]
 * @param {{ path?: string, debounceMs?: number, setTimeoutFn?: Function, clearTimeoutFn?: Function }} [deps.opts]
 */
function createSyncController(deps) {
  const { getStore, flushLocal, openRemote, snapshotLabel, onResult } = deps;
  const o = deps.opts || {};
  const path = o.path || DEFAULT_PATH;
  const debounceMs = o.debounceMs ?? 5000;
  const setT = o.setTimeoutFn || setTimeout;
  const clearT = o.clearTimeoutFn || clearTimeout;
  let running = false; let pending = false; let timer = null;

  async function runNow(meta = {}) {
    if (running) { pending = true; return null; }   // coalesce — never two runs at once on this device
    running = true;
    if (timer) { clearT(timer); timer = null; }
    let res;
    try {
      await flushLocal();                            // local is the source of truth — save it first
      const vfs = await openRemote();
      const r = await syncOnce(getStore(), vfs, { path, snapshotLabel: snapshotLabel ? snapshotLabel() : undefined });
      await flushLocal();                            // persist the merged-in remote changes locally
      res = { ok: true, pulledEvents: r.pulledEvents, pulledMaster: r.pulledMaster, pushed: r.pushed };
    } catch (e) {
      res = { ok: false, error: String((e && e.message) || e) };   // stay quiet; retried on next trigger
    } finally {
      running = false;
    }
    if (onResult) onResult(res, meta);
    if (pending) { pending = false; void runNow({ trigger: 'coalesced' }); } // a change arrived mid-run
    return res;
  }

  return {
    /** Reconcile immediately (manual button, page-hide, boot, network back). */
    runNow,
    /** Coalesce a burst of changes into one push after a quiet period. */
    schedule() { if (timer) clearT(timer); timer = setT(() => { timer = null; void runNow({ trigger: 'debounced' }); }, debounceMs); },
    /** Drop any pending debounce without running. */
    cancel() { if (timer) { clearT(timer); timer = null; } },
    get busy() { return running; },
  };
}

/**
 * Mount a VFS over Dropbox using an injected `getToken` (from the token manager). The App-folder
 * app sees its own folder as the root, so `root` is usually '' and paths are relative to
 * `/Apps/Paiol/`.
 *
 * @param {() => Promise<string>} getToken
 * @param {{ root?: string }} [opts]
 * @returns {Promise<object>} a mounted VFS
 */
async function openDropboxVfs(getToken, opts = {}) {
  const vfs = new VFS();
  await vfs.mount('/', new DropboxBackend({ getToken, root: opts.root || '' }));
  return vfs;
}

// ── src/dropbox-auth.js ──
// paiol — Dropbox PKCE OAuth (§5). PKCE = no client secret in the browser. The vendored
// DropboxBackend is auth-agnostic: it calls an injected `getToken()` per request and never
// touches OAuth. This module owns that token — the authorize redirect, the code exchange, and
// silent refresh — and hands a `getToken` to the backend.
//
// Pure where it can be: PKCE generation, URL building, and the exchange/refresh calls take an
// injected `fetch`/`crypto`/clock/storage, so the whole flow is testable headless. Only the
// actual browser redirect (window.location) lives at the edge.

const AUTHORIZE_URL = 'https://www.dropbox.com/oauth2/authorize';
const TOKEN_URL = 'https://api.dropboxapi.com/oauth2/token';
// App-folder app: these are the scopes paiol needs (declare the same set in the App Console).
const DEFAULT_SCOPES = ['files.content.read', 'files.content.write', 'files.metadata.read'];

// ── PKCE primitives ───────────────────────────────────────────────────────────

const b64url = (bytes) => {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};

/**
 * Generate a PKCE code verifier (RFC 7636): 43–128 chars from the unreserved set. base64url of
 * random bytes is a valid subset.
 * @param {Crypto} [cryptoObj]
 * @returns {string}
 */
function generateVerifier(cryptoObj = globalThis.crypto) {
  const bytes = new Uint8Array(64);
  cryptoObj.getRandomValues(bytes);
  return b64url(bytes); // ~86 chars
}

/**
 * The S256 code challenge for a verifier: base64url(SHA-256(verifier)).
 * @param {string} verifier
 * @param {Crypto} [cryptoObj]
 * @returns {Promise<string>}
 */
async function challengeFromVerifier(verifier, cryptoObj = globalThis.crypto) {
  const data = new TextEncoder().encode(verifier);
  const digest = await cryptoObj.subtle.digest('SHA-256', data);
  return b64url(new Uint8Array(digest));
}

/**
 * Build the authorize URL to redirect the user to. `token_access_type=offline` is what yields a
 * refresh token (so she only consents once).
 * @param {{ clientId: string, redirectUri: string, challenge: string, scopes?: string[], state?: string }} p
 * @returns {string}
 */
function buildAuthUrl({ clientId, redirectUri, challenge, scopes = DEFAULT_SCOPES, state }) {
  const q = new URLSearchParams({
    client_id: clientId,
    response_type: 'code',
    redirect_uri: redirectUri,
    code_challenge: challenge,
    code_challenge_method: 'S256',
    token_access_type: 'offline',
    scope: scopes.join(' '),
  });
  if (state) q.set('state', state);
  return `${AUTHORIZE_URL}?${q.toString()}`;
}

// ── Token exchange / refresh ───────────────────────────────────────────────────

/**
 * @typedef {object} TokenSet
 * @property {string} accessToken
 * @property {string} [refreshToken]
 * @property {number} expiresAt       // epoch ms when the access token expires
 * @property {string} [accountId]
 */

/**
 * Exchange an authorization code for tokens (after the redirect back).
 * @param {{ clientId: string, redirectUri: string, code: string, verifier: string, fetchFn?: Function, now?: () => number }} p
 * @returns {Promise<TokenSet>}
 */
async function exchangeCode({ clientId, redirectUri, code, verifier, fetchFn = fetch, now = Date.now }) {
  const body = new URLSearchParams({
    grant_type: 'authorization_code',
    code,
    client_id: clientId,
    redirect_uri: redirectUri,
    code_verifier: verifier,
  });
  return postToken(fetchFn, body, now);
}

/**
 * Silently mint a fresh access token from a refresh token.
 * @param {{ clientId: string, refreshToken: string, fetchFn?: Function, now?: () => number }} p
 * @returns {Promise<TokenSet>}
 */
async function refreshAccessToken({ clientId, refreshToken, fetchFn = fetch, now = Date.now }) {
  const body = new URLSearchParams({
    grant_type: 'refresh_token',
    refresh_token: refreshToken,
    client_id: clientId,
  });
  const set = await postToken(fetchFn, body, now);
  // Refresh responses omit the refresh_token; keep the one we already have.
  if (!set.refreshToken) set.refreshToken = refreshToken;
  return set;
}

async function postToken(fetchFn, body, now) {
  const resp = await fetchFn(TOKEN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString(),
  });
  if (!resp.ok) {
    const text = await resp.text().catch(() => '');
    throw new DropboxAuthError(`token endpoint ${resp.status}: ${text || resp.statusText}`);
  }
  const j = await resp.json();
  return {
    accessToken: j.access_token,
    refreshToken: j.refresh_token,
    expiresAt: now() + (j.expires_in ?? 14400) * 1000,
    accountId: j.account_id,
  };
}

// ── Token manager (what you inject into the DropboxBackend) ─────────────────────

/**
 * A token manager that returns a valid access token on demand, refreshing silently when the
 * current one is near expiry. Persist the token set however you like (IndexedDB / localStorage)
 * via `load`/`save`.
 *
 * @param {object} p
 * @param {string}   p.clientId
 * @param {() => (TokenSet|null|Promise<TokenSet|null>)} p.load   // read the stored token set
 * @param {(t: TokenSet) => void|Promise<void>}          p.save   // persist a refreshed set
 * @param {Function} [p.fetchFn]
 * @param {() => number} [p.now]
 * @param {number}  [p.skewMs]   // refresh this many ms before actual expiry (default 60s)
 * @returns {{ getToken: () => Promise<string>, isLinked: () => Promise<boolean> }}
 */
function createTokenManager({ clientId, load, save, fetchFn = fetch, now = Date.now, skewMs = 60_000 }) {
  /** @type {Promise<string>|null} */
  let inflight = null;

  async function resolve() {
    const set = await load();
    if (!set || !set.accessToken) throw new DropboxAuthError('nao conectado ao Dropbox');
    if (set.expiresAt - skewMs > now()) return set.accessToken; // still valid
    if (!set.refreshToken) throw new DropboxAuthError('token expirado e sem refresh token — reconecte');
    const fresh = await refreshAccessToken({ clientId, refreshToken: set.refreshToken, fetchFn, now });
    await save(fresh);
    return fresh.accessToken;
  }

  return {
    getToken() {
      // Coalesce concurrent callers so we refresh at most once.
      if (!inflight) inflight = resolve().finally(() => { inflight = null; });
      return inflight;
    },
    async isLinked() {
      const set = await load();
      return !!(set && (set.refreshToken || set.expiresAt - skewMs > now()));
    },
  };
}

class DropboxAuthError extends Error {
  constructor(message) {
    super(message);
    this.name = 'DropboxAuthError';
  }
}

// ── src/config.js ──
// paiol — app configuration. The Dropbox app key is a PUBLIC client id (PKCE uses no secret),
// so it lives in the shipped file. The redirect URI must EXACTLY match one registered in the
// Dropbox App Console; we pick by origin.

const DROPBOX_APP_KEY = 'co3pz3u3sqx84m2';
const APP_VERSION = '0.3.36';

// Where Dropbox stores everything (App-folder app → relative to /Apps/Paiol/).
const REMOTE_BUSINESS_PATH = '/business.yaml';
// Local IndexedDB database name (via @gcu/vfs idb backend).
const LOCAL_DB_NAME = 'paiol';

/**
 * The OAuth redirect URI for the current origin. Must be registered verbatim in the App Console:
 *   - http://localhost:8080/        (local dev — served by tools/dev-server.js)
 *   - https://gentropic.org/paiol/  (production, §6)
 * @returns {string}
 */
function redirectUri() {
  const { hostname } = location;
  if (hostname === 'localhost' || hostname === '127.0.0.1') return 'http://localhost:8080/';
  return 'https://gentropic.org/paiol/';
}

// ── src/auth-flow.js ──
// paiol — browser glue for the Dropbox PKCE flow. The pure mechanics live in dropbox-auth.js
// (tested headless); this file is the thin browser edge: redirect, callback, token storage.
//
//   connect → stash verifier, redirect to Dropbox
//   ...user consents, Dropbox redirects back with ?code=...
//   handleRedirectIfPresent → exchange code for tokens, persist, clean the URL
//   dropboxTokenManager → yields getToken() for the DropboxBackend, refreshing silently




const TOKEN_KEY = 'paiol.dropbox.token';     // localStorage — persists across sessions
const VERIFIER_KEY = 'paiol.dropbox.verifier'; // sessionStorage — one-shot, survives the redirect
const STATE_KEY = 'paiol.dropbox.state';

/** @returns {import('./dropbox-auth.js').TokenSet | null} */
function loadToken() {
  try { return JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); } catch { return null; }
}
function saveToken(t) { localStorage.setItem(TOKEN_KEY, JSON.stringify(t)); }
function forgetToken() { localStorage.removeItem(TOKEN_KEY); }

/** Begin linking: stash a fresh verifier, then redirect the whole page to Dropbox's consent screen. */
async function startDropboxLink() {
  const verifier = generateVerifier();
  const state = generateVerifier(); // reuse the CSPRNG helper for an opaque state token
  sessionStorage.setItem(VERIFIER_KEY, verifier);
  sessionStorage.setItem(STATE_KEY, state);
  const challenge = await challengeFromVerifier(verifier);
  location.assign(buildAuthUrl({
    clientId: DROPBOX_APP_KEY,
    redirectUri: redirectUri(),
    challenge,
    state,
  }));
}

/**
 * If the current URL is an OAuth callback (`?code=…`), complete the exchange and persist tokens.
 * Cleans the query off the URL afterwards so a reload doesn't re-trigger. No-op otherwise.
 * @returns {Promise<{ linked: boolean, error?: string }>}
 */
async function handleRedirectIfPresent() {
  const params = new URLSearchParams(location.search);
  if (params.has('error')) {
    cleanUrl();
    return { linked: false, error: params.get('error_description') || params.get('error') };
  }
  const code = params.get('code');
  if (!code) return { linked: false };

  const expectedState = sessionStorage.getItem(STATE_KEY);
  if (expectedState && params.get('state') !== expectedState) {
    cleanUrl();
    return { linked: false, error: 'state mismatch (possivel CSRF) — tente novamente' };
  }
  const verifier = sessionStorage.getItem(VERIFIER_KEY);
  if (!verifier) { cleanUrl(); return { linked: false, error: 'sessao de login expirada — tente novamente' }; }

  try {
    const tokens = await exchangeCode({
      clientId: DROPBOX_APP_KEY,
      redirectUri: redirectUri(),
      code,
      verifier,
    });
    saveToken(tokens);
    sessionStorage.removeItem(VERIFIER_KEY);
    sessionStorage.removeItem(STATE_KEY);
    cleanUrl();
    return { linked: true };
  } catch (e) {
    cleanUrl();
    return { linked: false, error: String(e.message || e) };
  }
}

/** A token manager bound to browser storage — pass `.getToken` to the DropboxBackend. */
function dropboxTokenManager() {
  return createTokenManager({
    clientId: DROPBOX_APP_KEY,
    load: loadToken,
    save: saveToken,
  });
}

/** Whether we currently hold (refreshable) Dropbox credentials. */
function isLinked() {
  return dropboxTokenManager().isLinked();
}

function cleanUrl() {
  history.replaceState(null, '', location.pathname);
}

// ── src/pdf.js ──
// paiol — PDF generation (Rev 04). Vendored pdf-lib (UMD) is loaded LAZILY from a sidecar the first
// time a PDF is generated, so the heavyweight (~525 KB) never bloats startup; the SW precaches it
// for offline. pdf-lib's standard Helvetica uses WinAnsi → PT-BR accents (ç ã õ é …) render fine,
// but emoji do NOT — keep PDF text plain. We do NOT import pdf-lib (it sets a global), so paiol's
// strip-and-concat build never touches it.

let _pdfLib = null;

/** Lazy-load the vendored pdf-lib UMD; resolves the global PDFLib. Same relative path works dev + prod. */
function loadPdfLib() {
  if (globalThis.PDFLib) return Promise.resolve(globalThis.PDFLib);
  if (_pdfLib) return _pdfLib;
  _pdfLib = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = './vendor/pdf-lib/pdf-lib.min.js';
    s.onload = () => (globalThis.PDFLib ? resolve(globalThis.PDFLib) : reject(new Error('pdf-lib não inicializou')));
    s.onerror = () => { _pdfLib = null; reject(new Error('não foi possível carregar o gerador de PDF')); };
    document.head.append(s);
  });
  return _pdfLib;
}

const A4 = [595.28, 841.89];           // pt, portrait
const M = 36;                          // margin
const SLOT_H = (A4[1] - 2 * M) / 3;    // 3 fichas per page
const money = (n) => 'R$ ' + (Number(n) || 0).toFixed(2).replace('.', ',');
// Standard PDF fonts use WinAnsi. Customer names copied from messaging apps may contain
// invisible bidirectional controls (for example U+202A), which otherwise abort the PDF.
const pdfText = (value) => String(value ?? '')
  .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g, '')
  .replace(/[\u0000-\u001f\u007f-\u009f]/g, ' ')
  .replace(/[^\u0020-\u007e\u00a0-\u00ff\u0152\u0153\u0160\u0161\u0178\u017d\u017e\u0192\u02c6\u02dc\u2013-\u2014\u2018-\u201a\u201c-\u201e\u2020-\u2022\u2026\u2030\u2039-\u203a\u20ac\u2122]/g, '?');
const trunc = (value, n) => { const s = pdfText(value); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

/**
 * Build a PDF of client fichas, 3 per A4 page (print-cut-file). Each ficha: business header, client
 * data, their orders (data · resumo · total · pago/deve), and the saldo devedor.
 * @param {Array<{client:{name?:string,phone?:string,address?:string}|null, orders:Array<{date:string,resumo:string,total:number,saldo:number}>, saldoTotal:number}>} fichas
 * @returns {Promise<Uint8Array>}
 */
async function generateFichasPdf(fichas) {
  const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const terr = rgb(0.604, 0.290, 0.184);
  const soft = rgb(0.42, 0.36, 0.33);
  const fg = rgb(0.165, 0.129, 0.11);
  const bad = rgb(0.70, 0.15, 0.12);
  const right = A4[0] - M;

  let page = null;
  fichas.forEach((f, i) => {
    if (i % 3 === 0) page = doc.addPage(A4);
    const top = A4[1] - M - (i % 3) * SLOT_H;
    const bottom = top - SLOT_H;

    page.drawLine({ start: { x: M, y: top }, end: { x: right, y: top }, thickness: 2, color: terr });
    let y = top - 16;
    page.drawText('Quitutes do Paiol', { x: M, y: y - 2, size: 11, font: bold, color: terr });
    page.drawText('Ficha do cliente', { x: right - 96, y: y - 2, size: 9, font, color: soft });
    y -= 19;
    page.drawText(trunc((f.client && f.client.name) || 'Sem cliente', 40), { x: M, y, size: 13, font: bold, color: fg });
    y -= 14;
    const contato = [f.client && f.client.phone, f.client && f.client.address].filter(Boolean).join('   ·   ');
    if (contato) { page.drawText(trunc(contato, 70), { x: M, y, size: 9, font, color: soft }); y -= 15; } else { y -= 3; }

    for (const o of f.orders.slice(0, 4)) {
      page.drawText(trunc(`${o.date}   ${o.resumo}`, 58), { x: M, y, size: 9, font, color: fg });
      page.drawText(money(o.total), { x: right - 150, y, size: 9, font, color: fg });
      const pend = o.saldo > 0.005;
      page.drawText(pend ? `deve ${money(o.saldo)}` : 'pago', { x: right - 80, y, size: 9, font, color: pend ? bad : soft });
      y -= 13;
    }
    if (f.orders.length > 4) { page.drawText(`+ ${f.orders.length - 4} pedido(s)…`, { x: M, y, size: 8, font, color: soft }); }

    page.drawText('Saldo devedor:', { x: M, y: bottom + 24, size: 10, font: bold, color: fg });
    page.drawText(money(f.saldoTotal), { x: M + 92, y: bottom + 24, size: 11, font: bold, color: f.saldoTotal > 0.005 ? bad : fg });

    page.drawLine({ start: { x: M, y: bottom + 8 }, end: { x: right, y: bottom + 8 }, thickness: 0.5, color: soft, dashArray: [3, 3] });
  });

  return doc.save();
}

/**
 * Build a single-page recibo (payment proof). Explicitly NOT a nota fiscal — a recibo has no rigid
 * legal format; this attests "recebemos de X a quantia de R$Y". Framed card with the empresa header
 * (logo + nome + CNPJ/endereço/telefone), the recebemos sentence, optional item table, totals
 * (pago/saldo/forma), optional observações, and a signature line (responsável) + disclaimer.
 * @param {{numero?:string, date:string, clientName:string, clientContato?:string,
 *   items?:Array<{name:string,qty:number,unitPrice:number,total:number}>, referente:string,
 *   total:number, pago:number, saldo:number, forma?:string, observacoes?:string,
 *   empresa?:{nome?:string,cnpj?:string,endereco?:string,telefone?:string,responsavel?:string,logo?:string}}} r
 * @returns {Promise<Uint8Array>}
 */
async function generateReciboPdf(r) {
  const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const terr = rgb(0.604, 0.290, 0.184);
  const soft = rgb(0.42, 0.36, 0.33);
  const fg = rgb(0.165, 0.129, 0.11);
  const line = rgb(0.86, 0.80, 0.74);
  const page = doc.addPage(A4);
  const right = A4[0] - M;
  const padL = M + 22, padR = right - 22;
  const textW = (t, s, f = font) => f.widthOfTextAtSize(t, s);
  const rightText = (t, x, y, s, f = font, color = fg) => page.drawText(t, { x: x - textW(t, s, f), y, size: s, font: f, color });

  // Content is drawn first (tracking y); the framing rectangle is drawn LAST, sized to the content,
  // so a short recibo doesn't leave a big empty box.
  const emp = r.empresa || {};
  const cardTop = A4[1] - M;
  let y = cardTop - 10;

  // Logo (optional) — top-left, aspect-preserved. Bad/unsupported image just skips.
  if (emp.logo) {
    try {
      const img = /^data:image\/jpe?g/i.test(emp.logo) ? await doc.embedJpg(emp.logo) : await doc.embedPng(emp.logo);
      const w = Math.min(130, img.width); const h = img.height * (w / img.width);
      page.drawImage(img, { x: padL, y: y - h, width: w, height: h });
      y -= h + 8;
    } catch { /* unreadable logo → skip */ }
  }

  // Empresa name (left) + RECIBO (right); then CNPJ/endereço/telefone; then data + número; rule.
  const nome = emp.nome || 'Quitutes do Paiol';
  page.drawText(trunc(nome, 46), { x: padL, y: y - 13, size: 14, font: bold, color: terr });
  rightText('RECIBO', padR, y - 11, 13, bold, soft);
  y -= 28;
  for (const ln of [emp.cnpj && `CNPJ ${emp.cnpj}`, emp.endereco, emp.telefone].filter(Boolean)) {
    page.drawText(trunc(ln, 84), { x: padL, y, size: 8.5, font, color: soft }); y -= 11;
  }
  page.drawText(`Data: ${r.date}`, { x: padL, y: y - 2, size: 9, font, color: soft });
  if (r.numero) rightText(r.numero, padR, y - 2, 9, font, soft);
  y -= 11;
  page.drawLine({ start: { x: padL, y }, end: { x: padR, y }, thickness: 2, color: terr });
  y -= 22;

  // The recebemos sentence.
  page.drawText('Recebemos de', { x: padL, y, size: 11, font, color: fg });
  page.drawText(trunc(r.clientName || 'cliente', 46), { x: padL + textW('Recebemos de ', 11), y, size: 11, font: bold, color: fg });
  y -= 18;
  page.drawText('a quantia de', { x: padL, y, size: 11, font, color: fg });
  page.drawText(money(r.pago), { x: padL + textW('a quantia de ', 11), y, size: 12, font: bold, color: terr });
  y -= 18;
  page.drawText(trunc(`referente a ${r.referente}.`, 80), { x: padL, y, size: 11, font, color: fg });
  y -= 26;

  // Optional item table.
  if (r.items && r.items.length) {
    page.drawText('ITENS', { x: padL, y, size: 8, font: bold, color: soft });
    y -= 4;
    page.drawLine({ start: { x: padL, y }, end: { x: padR, y }, thickness: 0.5, color: line });
    y -= 14;
    for (const it of r.items.slice(0, 8)) {
      page.drawText(trunc(`${it.qty}×  ${it.name}`, 52), { x: padL, y, size: 9.5, font, color: fg });
      rightText(money(it.total), padR, y, 9.5, font, fg);
      y -= 14;
    }
    if (r.items.length > 8) { page.drawText(`+ ${r.items.length - 8} item(ns)…`, { x: padL, y, size: 8, font, color: soft }); y -= 14; }
    y -= 4;
  }

  // Totals block.
  page.drawLine({ start: { x: padL, y: y + 4 }, end: { x: padR, y: y + 4 }, thickness: 0.5, color: line });
  y -= 12;
  const kv = (label, val, b = false, color = fg) => { page.drawText(label, { x: padR - 200, y, size: 10, font: b ? bold : font, color }); rightText(val, padR, y, 10, b ? bold : font, color); y -= 16; };
  if (r.desconto > 0.005) { kv('Subtotal', money(r.subtotal)); kv('Desconto da venda', `- ${money(r.desconto)}`, false, rgb(0.18, 0.45, 0.20)); }
  if (r.total && Math.abs(r.total - r.pago) > 0.005) kv('Total do pedido', money(r.total));
  kv('Valor pago' + (r.forma ? ` (${r.forma})` : ''), money(r.pago), true);
  if (r.descontoQuitacao > 0.005) kv('Desconto na quitação', money(r.descontoQuitacao), false, rgb(0.18, 0.45, 0.20));
  if (r.saldo > 0.005) kv('Saldo restante', money(r.saldo), false, rgb(0.70, 0.15, 0.12));
  else kv('Situação', 'QUITADO', true, rgb(0.18, 0.45, 0.20));

  // Optional observações.
  if (r.observacoes) {
    y -= 2;
    page.drawText(trunc(`Obs.: ${r.observacoes}`, 92), { x: padL, y, size: 9, font, color: soft });
    y -= 14;
  }

  // Frame the card around the content just drawn (border only — page is already white).
  const cardBottom = y - 4;
  page.drawRectangle({ x: M, y: cardBottom, width: right - M, height: cardTop - cardBottom, borderColor: line, borderWidth: 1 });

  // Signature line + responsável + disclaimer (below the card).
  const sy = cardBottom - 48;
  page.drawLine({ start: { x: padL, y: sy }, end: { x: padL + 220, y: sy }, thickness: 0.7, color: soft });
  page.drawText(trunc(emp.responsavel || nome, 50), { x: padL, y: sy - 12, size: 9, font, color: soft });
  page.drawText('Comprovante de pagamento — não substitui nota fiscal.', { x: M, y: cardBottom - 84, size: 8, font, color: soft });

  return doc.save();
}

/**
 * Branded A4 budget or non-fiscal receipt created manually from Financeiro. Unlike the compact
 * order receipt above, this document supports an arbitrary item list and multiple pages.
 * @param {{type:'orcamento'|'recibo',numero?:string,date:string,validUntil?:string,
 *   clientName:string,clientPhone?:string,clientAddress?:string,
 *   items:Array<{name:string,qty:number,unitPrice:number,total:number}>,total:number,
 *   paid?:number,balance?:number,paymentCondition?:string,notes?:string,
 *   empresa?:{nome?:string,cnpj?:string,endereco?:string,telefone?:string,responsavel?:string,logo?:string}}} spec
 * @returns {Promise<Uint8Array>}
 */
async function generateCommercialDocumentPdf(spec) {
  const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const navy = rgb(0.23, 0.32, 0.44); const teal = rgb(0.08, 0.45, 0.51);
  const terr = rgb(0.604, 0.290, 0.184); const soft = rgb(0.37, 0.39, 0.39);
  const line = rgb(0.85, 0.82, 0.78); const good = rgb(0.18, 0.45, 0.20); const bad = rgb(0.70, 0.15, 0.12);
  const right = A4[0] - M; const emp = spec.empresa || {};
  const isBudget = spec.type === 'orcamento'; const title = isBudget ? 'ORÇAMENTO' : 'RECIBO NÃO FISCAL';
  const ptDate = (value) => { const [yy, mm, dd] = String(value || '').slice(0, 10).split('-'); return yy && mm && dd ? `${dd}/${mm}/${yy}` : String(value || ''); };
  const width = (text, size, face = font) => face.widthOfTextAtSize(String(text), size);
  let page; let y; let pageNo = 0; let logo = null;
  if (emp.logo) {
    try { logo = /^data:image\/jpe?g/i.test(emp.logo) ? await doc.embedJpg(emp.logo) : await doc.embedPng(emp.logo); }
    catch { logo = null; }
  }
  const rightText = (text, valueY, size = 9, face = font, color = navy) => page.drawText(String(text), { x: right - width(text, size, face), y: valueY, size, font: face, color });
  const tableHeader = () => {
    page.drawRectangle({ x: M, y: y - 17, width: right - M, height: 22, color: rgb(0.95, 0.97, 0.96) });
    page.drawText('ITEM', { x: M + 7, y: y - 10, size: 8, font: bold, color: navy });
    page.drawText('QTD.', { x: 355, y: y - 10, size: 8, font: bold, color: navy });
    page.drawText('VALOR UNIT.', { x: 405, y: y - 10, size: 8, font: bold, color: navy });
    rightText('TOTAL', y - 10, 8, bold, navy); y -= 29;
  };
  const newPage = (continuation = false, includeTable = true) => {
    page = doc.addPage(A4); pageNo += 1; y = A4[1] - M;
    const logoScale = logo ? Math.min(72 / logo.width, 48 / logo.height, 1) : 0;
    const logoW = logo ? logo.width * logoScale : 0; const logoH = logo ? logo.height * logoScale : 0;
    if (logo) page.drawImage(logo, { x: M, y: y - logoH, width: logoW, height: logoH });
    const companyX = logo ? M + logoW + 12 : M;
    page.drawText(trunc(emp.nome || 'Quitutes do Paiol', 36), { x: companyX, y: y - 13, size: 14, font: bold, color: terr });
    rightText(continuation ? `${title} — CONTINUAÇÃO` : title, y - 12, continuation ? 9 : 13, bold, teal);
    let infoY = y - 28;
    for (const info of [emp.cnpj && `CNPJ ${emp.cnpj}`, emp.telefone && `Telefone ${emp.telefone}`, emp.endereco].filter(Boolean).slice(0, 3)) {
      page.drawText(trunc(info, 58), { x: companyX, y: infoY, size: 8, font, color: soft }); infoY -= 10;
    }
    y -= 63;
    page.drawLine({ start: { x: M, y }, end: { x: right, y }, thickness: 2, color: teal }); y -= 18;
    if (!continuation) {
      page.drawText(`Data: ${ptDate(spec.date)}`, { x: M, y, size: 9, font, color: soft });
      if (spec.numero) rightText(spec.numero, y, 9, font, soft); y -= 20;
      page.drawText('CLIENTE', { x: M, y, size: 8, font: bold, color: soft }); y -= 16;
      page.drawText(trunc(spec.clientName || 'Cliente não identificado', 65), { x: M, y, size: 12, font: bold, color: navy }); y -= 14;
      const contact = [spec.clientPhone, spec.clientAddress].filter(Boolean).join(' · ');
      if (contact) { page.drawText(trunc(contact, 88), { x: M, y, size: 8.5, font, color: soft }); y -= 15; }
      y -= 5;
    }
    if (includeTable) tableHeader();
  };
  const ensure = (height, includeTable = true) => { if (!page || y - height < M + 55) newPage(true, includeTable); };
  newPage(false);
  for (const item of spec.items || []) {
    ensure(24);
    page.drawText(trunc(item.name || 'Item', 48), { x: M + 7, y, size: 9.5, font, color: navy });
    page.drawText(String(Number(item.qty) || 0).replace('.', ','), { x: 358, y, size: 9, font, color: navy });
    page.drawText(money(item.unitPrice), { x: 405, y, size: 9, font, color: navy });
    rightText(money(item.total), y, 9.5, bold, navy);
    y -= 18;
    page.drawLine({ start: { x: M, y: y + 5 }, end: { x: right, y: y + 5 }, thickness: 0.35, color: line });
  }
  ensure(150, false);
  y -= 8;
  page.drawLine({ start: { x: M, y: y + 5 }, end: { x: right, y: y + 5 }, thickness: 1, color: teal }); y -= 13;
  const summary = (label, value, options = {}) => {
    page.drawText(label, { x: right - 215, y, size: options.bold ? 11 : 9.5, font: options.bold ? bold : font, color: options.color || navy });
    rightText(value, y, options.bold ? 11 : 9.5, options.bold ? bold : font, options.color || navy); y -= options.bold ? 19 : 16;
  };
  summary('Total', money(spec.total), { bold: true });
  if (isBudget) {
    if (spec.validUntil) summary('Validade', `até ${ptDate(spec.validUntil)}`);
  } else {
    summary('Valor pago', money(spec.paid), { bold: true, color: good });
    if ((Number(spec.balance) || 0) > 0.005) summary('Valor a pagar', money(spec.balance), { color: bad });
    else summary('Situação', 'QUITADO', { bold: true, color: good });
  }
  y -= 5;
  if (spec.paymentCondition) {
    page.drawText('CONDIÇÃO DE PAGAMENTO', { x: M, y, size: 8, font: bold, color: soft }); y -= 14;
    page.drawText(trunc(spec.paymentCondition, 92), { x: M, y, size: 9.5, font, color: navy }); y -= 20;
  }
  if (spec.notes) {
    page.drawText('OBSERVAÇÕES', { x: M, y, size: 8, font: bold, color: soft }); y -= 14;
    page.drawText(trunc(spec.notes, 94), { x: M, y, size: 9, font, color: soft }); y -= 20;
  }
  if (!isBudget) {
    y -= 20;
    page.drawLine({ start: { x: M, y }, end: { x: M + 230, y }, thickness: 0.7, color: soft });
    page.drawText(trunc(emp.responsavel || emp.nome || 'Responsável', 50), { x: M, y: y - 13, size: 8.5, font, color: soft });
  }
  const disclaimer = isBudget ? 'Orçamento comercial — não substitui nota fiscal.' : 'Comprovante de pagamento não fiscal — não substitui nota fiscal.';
  for (let index = 0; index < doc.getPageCount(); index += 1) {
    const current = doc.getPage(index);
    current.drawText(disclaimer, { x: M, y: 21, size: 7.5, font, color: soft });
    current.drawText(`Página ${index + 1} de ${doc.getPageCount()}`, { x: right - 72, y: 21, size: 7.5, font, color: soft });
  }
  return doc.save();
}

/**
 * A4 production comanda for a selected period. The caller consolidates repeated products into
 * one list, regardless of the delivery date inside the selected period.
 * @param {{period?:string,generatedAt?:string,production?:Array<{name:string,prevista:number,produzido:number}>}} spec

async function generateComandaPdf(spec) {
  const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const navy = rgb(0.23, 0.32, 0.44);
  const teal = rgb(0.08, 0.45, 0.51);
  const soft = rgb(0.37, 0.39, 0.39);
  let page; let y;

  const newPage = () => {
    page = doc.addPage(A4); y = A4[1] - M;
    page.drawText('Quitutes do Paiol', { x: M, y: y - 12, size: 16, font: bold, color: navy });
    page.drawText(`COMANDA DE PRODUCAO  ${spec.period || spec.date || ''}`, { x: M, y: y - 34, size: 10, font: bold, color: teal });
    if (spec.generatedAt) page.drawText(`Gerada em ${spec.generatedAt}`, { x: A4[0] - M - 145, y: y - 34, size: 8, font, color: soft });
    page.drawLine({ start: { x: M, y: y - 43 }, end: { x: A4[0] - M, y: y - 43 }, thickness: 2, color: teal });
    y -= 62;
  };
  const ensure = (need) => { if (!page || y - need < M) newPage(); };
  newPage();
  page.drawRectangle({ x: M, y: y - 20, width: A4[0] - 2 * M, height: 27, color: rgb(0.91, 0.96, 0.95) });
  page.drawText('LISTA UNICA DE PRODUCAO', { x: M + 9, y: y - 11, size: 11, font: bold, color: teal });
  y -= 39;
  for (const item of spec.production || []) {
    ensure(22);
    page.drawText(trunc(item.name, 54), { x: M, y, size: 10, font: bold, color: navy });
    page.drawText(`encomendado + avulso ${item.prevista}   produzido ${item.produzido}`, { x: A4[0] - 240, y, size: 9.5, font, color: soft });
    y -= 20;
  }
  if (!(spec.production || []).length) page.drawText('Sem itens de producao no periodo.', { x: M, y, size: 10, font, color: soft });
  return doc.save();
}

/**
 * Detailed A4 client statement, with every purchase item and payment in the selected period.
 * The current all-time balance is shown separately so a period filter never hides prior debt.
 * @param {{client:{name?:string,phone?:string,address?:string}|null,start?:string,end?:string,
 *   movements:Array<object>,periodPurchases:number,periodPayments:number,periodBalance:number,
 *   totalCharged:number,totalPaid:number,currentBalance:number}} statement
 */
async function generateClientStatementPdf(statement) {
  const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const navy = rgb(0.23, 0.32, 0.44);
  const teal = rgb(0.08, 0.45, 0.51);
  const soft = rgb(0.37, 0.39, 0.39);
  const line = rgb(0.85, 0.82, 0.78);
  const good = rgb(0.18, 0.45, 0.20);
  const bad = rgb(0.70, 0.15, 0.12);
  const right = A4[0] - M;
  const textWidth = (text, size, face = font) => face.widthOfTextAtSize(text, size);
  const rightText = (page, text, x, y, size, face = font, color = navy) => page.drawText(text, { x: x - textWidth(text, size, face), y, size, font: face, color });
  const ptDate = (value) => { const [y, m, d] = String(value || '').slice(0, 10).split('-'); return y && m && d ? `${d}/${m}/${y}` : ''; };
  const period = statement.start || statement.end
    ? `${statement.start ? ptDate(statement.start) : 'início'} até ${statement.end ? ptDate(statement.end) : 'hoje'}`
    : 'Histórico geral';
  let page; let y; let pageNo = 0;

  const newPage = () => {
    page = doc.addPage(A4); pageNo += 1; y = A4[1] - M;
    page.drawText('Quitutes do Paiol', { x: M, y: y - 12, size: 15, font: bold, color: navy });
    rightText(page, statement.isOrigin ? 'FICHA FINANCEIRA DA ORIGEM' : 'FICHA FINANCEIRA DO CLIENTE', right, y - 11, 10, bold, teal);
    y -= 29;
    page.drawLine({ start: { x: M, y }, end: { x: right, y }, thickness: 2, color: teal });
    y -= 23;
    page.drawText(trunc(statement.client?.name || 'Cliente não identificado', 55), { x: M, y, size: 13, font: bold, color: navy });
    y -= 14;
    const contact = [statement.client?.phone, statement.client?.address].filter(Boolean).join(' - ');
    if (contact) { page.drawText(trunc(contact, 88), { x: M, y, size: 8.5, font, color: soft }); y -= 13; }
    page.drawText(`Período: ${period}`, { x: M, y, size: 8.5, font, color: soft });
    y -= 21;
  };
  const ensure = (height) => { if (!page || y - height < M + 24) newPage(); };
  newPage();

  const summary = [
    [statement.isOrigin ? 'Lançamentos no filtro' : 'Compras no filtro', statement.periodPurchases, navy],
    ['Pagamentos no filtro', statement.periodPayments, good],
    ['Saldo atual', statement.currentBalance, statement.currentBalance > 0.005 ? bad : good],
    statement.isOrigin ? ['Perdas no filtro', statement.periodLosses || 0, bad] : ['Crédito disponível', statement.creditBalance || 0, good],
  ];
  const boxW = (right - M - 12) / 2; const boxH = 42;
  summary.forEach(([label, value, color], index) => {
    const col = index % 2; const row = Math.floor(index / 2); const x = M + col * (boxW + 12); const top = y - row * (boxH + 8);
    page.drawRectangle({ x, y: top - boxH, width: boxW, height: boxH, borderColor: line, borderWidth: 0.8 });
    page.drawText(label, { x: x + 9, y: top - 14, size: 8, font, color: soft });
    page.drawText(money(value), { x: x + 9, y: top - 31, size: 11, font: bold, color });
  });
  y -= 2 * (boxH + 8) + 9;
  page.drawText('MOVIMENTAÇÕES', { x: M, y, size: 8.5, font: bold, color: navy }); y -= 13;

  for (const movement of statement.movements || []) {
    if (movement.type === 'payment' || movement.type === 'discount' || movement.type === 'credit-application' || movement.type === 'loss') {
      const discount = movement.type === 'discount';
      const credit = movement.type === 'credit-application';
      const loss = movement.type === 'loss';
      ensure(38);
      page.drawLine({ start: { x: M, y: y + 5 }, end: { x: right, y: y + 5 }, thickness: 0.5, color: line });
      page.drawText(`${ptDate(movement.at)}  ${discount ? 'DESCONTO NA QUITAÇÃO' : credit ? 'CRÉDITO UTILIZADO' : loss ? 'PERDA REGISTRADA' : 'PAGAMENTO'}`, { x: M, y: y - 8, size: 9, font: bold, color: loss ? bad : discount || credit ? navy : good });
      rightText(page, money(movement.amount), right, y - 8, 10, bold, loss ? bad : discount || credit ? navy : good);
      y -= 21;
      page.drawText(trunc(`${movement.description}${movement.method ? ` - ${movement.method}` : ''}`, 82), { x: M + 12, y, size: 8.5, font, color: soft });
      y -= 17;
      continue;
    }

    ensure(55);
    page.drawLine({ start: { x: M, y: y + 5 }, end: { x: right, y: y + 5 }, thickness: 0.5, color: line });
    const kind = movement.type === 'purchase' ? (movement.description === 'Venda rápida' ? 'VENDA RÁPIDA' : 'COMPRA / ENCOMENDA') : 'LANÇAMENTO A RECEBER';
    page.drawText(`${ptDate(movement.at)}  ${kind}`, { x: M, y: y - 8, size: 9, font: bold, color: navy });
    rightText(page, money(movement.amount), right, y - 8, 10, bold, navy);
    y -= 22;
    if (movement.type === 'purchase') {
      for (const item of movement.items || []) {
        ensure(16);
        const label = `${item.qty} x ${item.name}  (${money(item.unitPrice)} cada)`;
        page.drawText(trunc(label, 72), { x: M + 12, y, size: 8.5, font, color: navy });
        rightText(page, money(item.total), right, y, 8.5, font, navy);
        y -= 14;
      }
      if (movement.freight > 0) {
        ensure(16);
        page.drawText('Frete', { x: M + 12, y, size: 8.5, font, color: soft });
        rightText(page, money(movement.freight), right, y, 8.5, font, navy);
        y -= 14;
      }
      if (movement.discount > 0) {
        ensure(16);
        page.drawText('Desconto da venda', { x: M + 12, y, size: 8.5, font, color: good });
        rightText(page, `- ${money(movement.discount)}`, right, y, 8.5, font, good);
        y -= 14;
      }
      if (movement.deliveryMethod || movement.notes) {
        ensure(16);
        const detail = [`Entrega: ${movement.deliveryMethod === 'motoboy' ? 'Motoboy' : 'Retirada'}`, movement.notes && `Obs.: ${movement.notes}`].filter(Boolean).join(' - ');
        page.drawText(trunc(detail, 84), { x: M + 12, y, size: 8, font, color: soft });
        y -= 14;
      }
    } else {
      page.drawText(trunc(movement.description || 'Valor a receber', 82), { x: M + 12, y, size: 8.5, font, color: soft });
      y -= 14;
    }
    ensure(17);
    const discountText = movement.discounted > 0.005 ? `  -  Desconto ${money(movement.discounted)}` : '';
    const creditText = movement.credited > 0.005 ? `  -  Crédito ${money(movement.credited)}` : '';
    const lossText = movement.writtenOff > 0.005 ? `  -  Perda ${money(movement.writtenOff)}` : '';
    const status = movement.balance > 0.005
